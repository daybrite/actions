name: Set up Day build dependencies
description: >-
  Install everything one platform-toolkit target needs on this runner: the toolkit's dev libraries,
  the Rust std for its cross-compile, the SDK/toolchain a mobile target builds through, and
  (optionally) the tools `day pack` needs to produce a package. One step in place of a dozen.

# WHY THIS EXISTS
#
# Every workflow that builds a Day app repeated the same ladder of `if: matrix.target == …` install
# steps — this repo's dayapp.yml, daybrite/day's ci.yml and its doctor-verify.yml. Three copies of
# one recipe drift, and they had: the OpenHarmony leg alone ran SDK 5.1.0 with a cached
# command-line-tools and node wrappers in two of them, and SDK 6.1 with the CLT's own node on PATH
# in the third. What a target needs is a property OF THE TARGET, so it belongs in one place that
# every caller invokes.
#
# The recipes here are the ones daybrite/day's own CI proved, and each carries the reason it is
# shaped the way it is — those comments are the point, not decoration.
#
# Anything that is not "make this target buildable" stays with the caller: checking out the app,
# installing the day CLI (setup-day-cli), emulators, signing material, and every build/pack/script
# command itself.

inputs:
  target:
    description: >-
      The platform-toolkit combo to prepare for: macos-appkit, macos-gtk, macos-qt, ios-uikit,
      linux-gtk, linux-qt, android-material, harmony-arkui, windows-winui, web-dom. An unknown value fails loudly rather than installing nothing and failing later
      inside cargo.
    required: true
  pack:
    description: >-
      Also install what `day pack` needs for this target: flatpak-builder + linuxdeploy and its
      toolkit plugin on Linux, NSIS on Windows. macOS, iOS, Android and HarmonyOS need nothing
      beyond the build set. Skip it for a build-only job to save a few minutes.
    required: false
    default: "true"
  extras:
    description: >-
      Also install what a dayscript WALKTHROUGH needs beyond a build: the web view's dev libraries
      (an app using day-piece-webview does not link without them), a virtual display, the
      ImageMagick root-capture screenshot fallback, and CJK fonts so zh-CN screenshots are not
      tofu. Off by default: a job that only builds and packs does not need any of it.
    required: false
    default: "false"
  java:
    description: >-
      Pin JDK 21 (temurin) and Gradle for the android and harmony targets. Off by default, which
      leaves the runner's own JDK in place — Day accepts 17+, and a job whose point is "what a new
      user's machine does" should not quietly install a different one.
    required: false
    default: "false"
  rust:
    description: >-
      `rustup target add` the std this target cross-compiles against. Idempotent, so a caller that
      already installed them through dtolnay/rust-toolchain can leave this on.
    required: false
    default: "true"
  packages:
    description: >-
      Extra packages this target needs beyond Day's own set, space-separated — an app's own
      needs, such as a media player's codecs. Installed after the toolkit's, with the runner's
      package manager and its defaults: apt on Linux (recommended packages included), Homebrew
      on macOS, and Chocolatey for windows-winui, beside the toolkit's own.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Normalize deprecated target input
      id: canonical-target
      shell: bash
      env:
        RAW_TARGET: ${{ inputs.target }}
      run: |
        case "$RAW_TARGET" in
          mdc | android-mdc)
            echo "::warning::$RAW_TARGET is deprecated; use android-material"
            RAW_TARGET=android-material ;;
          material) RAW_TARGET=android-material ;;
        esac
        printf 'target=%s\n' "$RAW_TARGET" >> "$GITHUB_OUTPUT"

    - name: Validate the target
      shell: bash
      run: |
        case "${{ steps.canonical-target.outputs.target }}" in
          macos-appkit | macos-gtk | macos-qt | ios-uikit | linux-gtk | linux-qt \
            | android-material | harmony-arkui | windows-winui | web-dom) ;;
          *)
            echo "::error::setup-day-deps: unknown target '${{ steps.canonical-target.outputs.target }}'"
            exit 1 ;;
        esac

    # --- Rust std for the cross-compiled targets ------------------------------------------------
    # Android installs BOTH arches: x86_64 for the emulator screenshot leg, aarch64 for the package
    # a device runs. HarmonyOS the same, for the same reason.
    - name: Rust cross targets
      if: inputs.rust == 'true'
      shell: bash
      run: |
        set -euo pipefail
        case "${{ steps.canonical-target.outputs.target }}" in
          ios-uikit) T="aarch64-apple-ios-sim aarch64-apple-ios" ;;
          android-material) T="aarch64-linux-android x86_64-linux-android" ;;
          harmony-arkui) T="aarch64-unknown-linux-ohos x86_64-unknown-linux-ohos" ;;
          web-dom) T="wasm32-unknown-unknown" ;;
          *) T="" ;;
        esac
        # shellcheck disable=SC2086 # a deliberately word-split list
        [ -z "$T" ] || rustup target add $T

    # --- toolkit dev libraries ------------------------------------------------------------------
    - name: Toolkit deps (brew)
      if: runner.os == 'macOS' && (steps.canonical-target.outputs.target == 'macos-gtk' || steps.canonical-target.outputs.target == 'macos-qt')
      shell: bash
      env:
        # Set here rather than asked of every caller: the runner images ship third-party taps
        # (aws/tap) that trip Homebrew's tap-trust warning on each install, and an ephemeral runner
        # gains nothing from the check. The auto-update is minutes of churn for packages that are
        # already current on the image.
        HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        case "${{ steps.canonical-target.outputs.target }}" in
          macos-qt) brew install qt pkg-config ;;
          macos-gtk) brew install gtk4 libadwaita librsvg pkg-config ;;
        esac

    - name: Toolkit deps (apt)
      if: steps.canonical-target.outputs.target == 'linux-gtk' || steps.canonical-target.outputs.target == 'linux-qt'
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        set -euo pipefail
        sudo apt-get update
        # dbus is not optional even for a build-only job: GTK's file dialogs are portal-backed and
        # a runner has no session bus, so `day launch` starts a private one with `dbus-run-session`
        # (it ships in this package). Without a bus GTK reaches the portal through a NULL
        # GDBusConnection and segfaults on the second dialog.
        BASE="pkg-config dbus"
        case "${{ steps.canonical-target.outputs.target }}" in
          # SVG renderers are build dependencies, including when extras is false.
          linux-qt)
            PKGS="qt6-base-dev qt6-svg-dev"
            # Qt 6.9+ packaging (Ubuntu 25.04 and later, so `ubuntu-latest` since 26.04) moved the
            # SVG icon engine and image format plugins out of libqt6svg6 into qt6-svg-plugins.
            # linuxdeploy-plugin-qt refuses to pack without the icon engine ("Cannot deploy
            # non-existing library file .../iconengines/libqsvgicon.so"). Older releases have no
            # such package and still carry the plugins in libqt6svg6.
            if apt-cache show qt6-svg-plugins >/dev/null 2>&1; then PKGS="$PKGS qt6-svg-plugins"; fi
            ;;
          linux-gtk) PKGS="libgtk-4-dev libadwaita-1-dev librsvg2-dev" ;;
        esac
        if [ "$EXTRAS" = true ]; then
          # The web view's dev libs are a BUILD dependency of any app carrying day-piece-webview:
          # without libwebkitgtk-6.0-dev the GTK build fails looking for `libsoup-3.0.pc`, which
          # names a library nothing in the app mentions. xvfb + imagemagick are the walkthrough's
          # virtual display and its root-capture screenshot fallback; fonts-noto-cjk is why zh-CN
          # screenshots have glyphs instead of tofu boxes; xclip is the X11 clipboard broker
          # day-part-clipboard shells out to — without it every copy/paste walkthrough step is a
          # silent no-op (set_text drops the payload, get_text reads back nothing). libpulse0 is
          # the library day-part-sound loads at run time to reach the sound server: without it
          # the part reports no engine, where a desktop reports one. A runner has no sound server,
          # so nothing plays either way; the walkthrough's readouts are what it checks.
          case "${{ steps.canonical-target.outputs.target }}" in
            linux-qt) PKGS="$PKGS qt6-webengine-dev" ;;
            linux-gtk) PKGS="$PKGS libwebkitgtk-6.0-dev" ;;
          esac
          PKGS="$PKGS xvfb imagemagick fonts-noto-cjk xclip libpulse0"
        fi
        # shellcheck disable=SC2086 # deliberately word-split package lists
        sudo apt-get install -y --no-install-recommends $BASE $PKGS

    # What the harmony/web WALKTHROUGHS need beyond a build: the Oniro emulator is a QEMU
    # x86_64 guest (`day devices boot -t harmony-arkui`), and the headless web browser renders the
    # zh-CN captures as tofu without CJK fonts (imagemagick is the same capture-validation
    # tooling the linux legs carry).
    - name: Walkthrough deps (harmony emulator / web driver)
      if: inputs.extras == 'true' && (steps.canonical-target.outputs.target == 'harmony-arkui' || steps.canonical-target.outputs.target == 'web-dom')
      shell: bash
      run: |
        set -euo pipefail
        case "${{ steps.canonical-target.outputs.target }}" in
          harmony-arkui) PKGS="qemu-system-x86 qemu-utils" ;;
          web-dom) PKGS="fonts-noto-cjk imagemagick" ;;
        esac
        sudo apt-get update
        # shellcheck disable=SC2086 # deliberately word-split package lists
        sudo apt-get install -y --no-install-recommends $PKGS

    # --- the caller's own packages (inputs.packages) --------------------------------------------
    # After the toolkit's, so a package can extend what those installed.
    - name: Extra packages
      if: inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # a deliberately word-split package list
        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y $PACKAGES
            ;;
          macOS) brew install $PACKAGES ;;
          # Chocolatey edits the MACHINE PATH, which later steps do not see (see the NSIS step);
          # a tool installed here is best located and exported by the caller's own setup.
          Windows) choco install -y --no-progress $PACKAGES ;;
          *) echo "::error::setup-day-deps: no package manager for runner OS '$RUNNER_OS'"; exit 1 ;;
        esac

    # --- Android --------------------------------------------------------------------------------
    - name: JDK 21 (android / harmony)
      if: inputs.java == 'true' && (steps.canonical-target.outputs.target == 'android-material' || steps.canonical-target.outputs.target == 'harmony-arkui')
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - name: Gradle (android)
      if: inputs.java == 'true' && steps.canonical-target.outputs.target == 'android-material'
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 9.6.1
        add-job-summary: never
    - name: Android NDK env
      if: steps.canonical-target.outputs.target == 'android-material'
      shell: bash
      run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
    - name: cargo-ndk (android)
      if: steps.canonical-target.outputs.target == 'android-material'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    # --- HarmonyOS ------------------------------------------------------------------------------
    # The public SDK supplies the NDK (and hdc); hvigor and ohpm do NOT ship in it and come from the
    # command-line-tools, which is why there are two halves here. cargo-ohos drives the Rust
    # cross-compile (`day build` runs `cargo ohos rustc`): it reads the SDK's `native` component as
    # OHOS_SDK_NATIVE and sets the linker, the cc-rs compilers, bindgen, cmake and pkg-config for
    # the target itself, so none of that is exported by hand here. Pinned: the tool is young and
    # its flags still move between releases (install-action falls back to cargo-binstall's prebuilt
    # binary for it).
    - name: cargo-ohos (harmony)
      if: steps.canonical-target.outputs.target == 'harmony-arkui'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ohos@0.3.4
    - name: OHOS SDK
      if: steps.canonical-target.outputs.target == 'harmony-arkui'
      uses: openharmony-rs/setup-ohos-sdk@v1
      id: ohos-sdk
      with:
        version: 5.1.0
    - name: OHOS toolchain env
      if: steps.canonical-target.outputs.target == 'harmony-arkui'
      shell: bash
      run: |
        set -euo pipefail
        NATIVE="${{ steps.ohos-sdk.outputs.ohos_sdk_native }}"
        echo "$(dirname "$NATIVE")/toolchains" >> "$GITHUB_PATH"
        echo "OHOS_SDK_NATIVE=$NATIVE" >> "$GITHUB_ENV"
        # napi-ohos's build script reads the NDK under this name for its link search paths, the
        # one variable cargo-ohos does not set. `day build` bridges it itself; a bare
        # `cargo ohos clippy` in a caller's step needs it from here.
        echo "OHOS_NDK_HOME=$NATIVE" >> "$GITHUB_ENV"
        # hvigor's OpenHarmony mode REJECTS the flat SDK layout with "The SDK management mode has
        # changed" — it wants the versioned view (<base>/<api>/{ets,native,toolchains,…}).
        OH="$(dirname "$NATIVE")"
        BASE="$HOME/ohos-ohsdk"
        mkdir -p "$BASE"
        ln -sfn "$OH" "$BASE/18"
        echo "OHOS_BASE_SDK_HOME=$BASE" >> "$GITHUB_ENV"
    - name: Cache the OpenHarmony command-line-tools (hvigor / ohpm)
      if: steps.canonical-target.outputs.target == 'harmony-arkui'
      uses: actions/cache@v6
      with:
        path: ~/ohos-clt
        key: ohos-clt-5.1.0.840
    - name: Install hvigor/ohpm (node wrappers)
      if: steps.canonical-target.outputs.target == 'harmony-arkui'
      shell: bash
      env:
        CLT_URL: https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
      run: |
        set -euo pipefail
        C="$HOME/ohos-clt/command-line-tools"
        if [ ! -f "$C/hvigor/bin/hvigorw.js" ]; then
          mkdir -p ~/ohos-clt && cd ~/ohos-clt
          curl -fSL --retry 5 --retry-all-errors -o clt.zip "$CLT_URL"
          unzip -q -o clt.zip && rm -f clt.zip
        fi
        # hvigor/ohpm are pure JS — run them with the runner's node rather than the CLT's bundled
        # one, which ships Linux-only binaries.
        mkdir -p "$HOME/ohos-bin"
        printf '#!/usr/bin/env bash\nexec node "%s/hvigor/bin/hvigorw.js" "$@"\n' "$C" > "$HOME/ohos-bin/hvigorw"
        printf '#!/usr/bin/env bash\nexec node "%s/ohpm/bin/pm-cli.js" "$@"\n' "$C" > "$HOME/ohos-bin/ohpm"
        chmod +x "$HOME/ohos-bin/hvigorw" "$HOME/ohos-bin/ohpm"
        echo "$HOME/ohos-bin" >> "$GITHUB_PATH"
        echo "DEVECO_SDK_HOME=$C/sdk" >> "$GITHUB_ENV"

    # Match the native renderers' build probes before spending time compiling Rust crates.
    # This also catches an incomplete installation.
    - name: Verify SVG development libraries
      if: endsWith(steps.canonical-target.outputs.target, '-qt') || endsWith(steps.canonical-target.outputs.target, '-gtk')
      shell: bash
      env:
        TARGET: ${{ steps.canonical-target.outputs.target }}
      run: |
        set -euo pipefail
        case "$TARGET" in
          *-qt) pkg-config --cflags --libs Qt6Widgets Qt6Svg ;;
          *-gtk) pkg-config --print-errors --atleast-version=2.52 librsvg-2.0 ;;
        esac

    # --- Windows WinUI 3: the Windows App SDK -------------------------------------------------------
    # windows-winui builds against the Windows App SDK's NuGet packages (the build fetches them
    # into %LOCALAPPDATA%\day\winappsdk on first use, ~270 MB, so they are cached per release) and
    # a development build runs on the installed Windows App Runtime, which is not part of Windows.
    # A packed app is self-contained and needs neither. WINAPPSDK_RELEASE is the release the day
    # CLI pins (RUNTIME_VERSION in day's crates/day-toolchain/src/winappsdk.rs); keep them in step.
    - name: Cache the Windows App SDK packages (windows-winui)
      if: steps.canonical-target.outputs.target == 'windows-winui'
      uses: actions/cache@v6
      with:
        path: ~\AppData\Local\day\winappsdk
        key: winappsdk-2.5.1-${{ runner.arch }}
    - name: Windows App Runtime (windows-winui)
      if: steps.canonical-target.outputs.target == 'windows-winui'
      shell: pwsh
      env:
        WINAPPSDK_RELEASE: "2.5.1"
      run: |
        $release = $env:WINAPPSDK_RELEASE
        $have = Get-AppxPackage Microsoft.WindowsAppRuntime.2 | Where-Object { [version]$_.Version -ge [version]$release } | Select-Object -First 1
        if (-not $have) {
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $mm = ($release -split '\.')[0..1] -join '.'
          $url = "https://aka.ms/windowsappsdk/$mm/$release/windowsappruntimeinstall-$arch.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\windowsappruntimeinstall.exe"
          & "$env:RUNNER_TEMP\windowsappruntimeinstall.exe" --quiet --force
          if ($LASTEXITCODE -ne 0) { throw "the Windows App Runtime installer exited $LASTEXITCODE" }
          $have = Get-AppxPackage Microsoft.WindowsAppRuntime.2 | Where-Object { [version]$_.Version -ge [version]$release } | Select-Object -First 1
          if (-not $have) { throw "Microsoft.WindowsAppRuntime.2 >= $release is not registered after the install" }
        }
        Write-Host "Windows App Runtime: $($have.Version)"

    # --- packaging tools (inputs.pack) ----------------------------------------------------------
    - name: Flatpak tooling (linux pack)
      if: inputs.pack == 'true' && (steps.canonical-target.outputs.target == 'linux-gtk' || steps.canonical-target.outputs.target == 'linux-qt')
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - name: linuxdeploy tooling (linux pack)
      if: inputs.pack == 'true' && (steps.canonical-target.outputs.target == 'linux-gtk' || steps.canonical-target.outputs.target == 'linux-qt')
      shell: bash
      env:
        TOOLKIT: ${{ steps.canonical-target.outputs.target == 'linux-qt' && 'qt' || 'gtk' }}
      run: |
        set -euo pipefail
        # appimagetool needs FUSE, which a runner does not have; APPIMAGE_EXTRACT_AND_RUN is the
        # documented way round it. dpkg-dev supplies dpkg-architecture, which the GTK plugin exits
        # on when missing.
        sudo apt-get install -y --no-install-recommends fuse3 libfuse2t64 || \
          sudo apt-get install -y --no-install-recommends fuse libfuse2 || true
        sudo apt-get install -y --no-install-recommends dpkg-dev
        curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/linuxdeploy" \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        # The two plugins are NOT distributed the same way: qt ships an AppImage on a rolling
        # `continuous` release; gtk has no releases at all and is a shell script in its repository
        # (pinned to a commit — an unpinned branch is a third party editing this build without a
        # pull request). linuxdeploy finds a plugin by globbing `linuxdeploy-plugin-<name>*` beside
        # its own binary, so the `.sh` suffix is fine as long as both land in one directory.
        case "$TOOLKIT" in
          qt)
            PLUGIN="$RUNNER_TEMP/linuxdeploy-plugin-qt"
            curl -fsSL --retry 5 --retry-all-errors -o "$PLUGIN" \
              "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
            ;;
          gtk)
            PLUGIN="$RUNNER_TEMP/linuxdeploy-plugin-gtk.sh"
            curl -fsSL --retry 5 --retry-all-errors -o "$PLUGIN" \
              "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh"
            # The plugin copies `<libdir>/gtk-4.0` (the loadable-module directory) into the
            # AppDir unconditionally, under `set -e`. GTK 4.20 built the print backends into the
            # library, so a 4.20+ libgtk-4-1 (Ubuntu 26.04, GTK 4.22) ships no such directory and
            # the copy fails the whole pack. An empty directory is what that GTK has to offer.
            GTK4_MODULES="$(pkg-config --variable=libdir gtk4)/gtk-4.0"
            [ -d "$GTK4_MODULES" ] || sudo mkdir -p "$GTK4_MODULES"
            ;;
        esac
        chmod +x "$RUNNER_TEMP/linuxdeploy" "$PLUGIN"
        {
          echo "DAY_LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy"
          echo "DAY_LINUXDEPLOY_PLUGIN_${TOOLKIT^^}=$PLUGIN"
          echo "APPIMAGE_EXTRACT_AND_RUN=1"
        } >> "$GITHUB_ENV"
    - name: Configure the NSIS installer cache
      if: inputs.pack == 'true' && steps.canonical-target.outputs.target == 'windows-winui'
      id: nsis-installer
      shell: pwsh
      env:
        NSIS_VERSION: '3.13'
        NSIS_SHA256: 'db9a1038bbc0e53fef24f423fd609979bd578e942f1be1198db186d1c42652a3'
      run: |
        $setup = Join-Path $env:RUNNER_TEMP "day-installers/nsis-$env:NSIS_VERSION-setup.exe"
        "path=$setup" >> $env:GITHUB_OUTPUT
        "version=$env:NSIS_VERSION" >> $env:GITHUB_OUTPUT
        "sha256=$env:NSIS_SHA256" >> $env:GITHUB_OUTPUT
        "key=nsis-installer-v1-$env:RUNNER_OS-$env:RUNNER_ARCH-$env:NSIS_VERSION-$env:NSIS_SHA256" >> $env:GITHUB_OUTPUT
    - name: Restore the NSIS installer
      if: inputs.pack == 'true' && steps.canonical-target.outputs.target == 'windows-winui'
      id: nsis-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.nsis-installer.outputs.path }}
        key: ${{ steps.nsis-installer.outputs.key }}
    - name: NSIS (windows pack)
      if: inputs.pack == 'true' && steps.canonical-target.outputs.target == 'windows-winui'
      shell: pwsh
      env:
        NSIS_INSTALLER: ${{ steps.nsis-installer.outputs.path }}
        NSIS_VERSION: ${{ steps.nsis-installer.outputs.version }}
        NSIS_SHA256: ${{ steps.nsis-installer.outputs.sha256 }}
      run: |
        # Cache the installer, not the machine installation. Always verify restored bytes;
        # a miss/corrupt file downloads the pinned release with retries. A valid hit needs
        # neither Chocolatey metadata nor a SourceForge request.
        $setup = $env:NSIS_INSTALLER
        $version = $env:NSIS_VERSION
        $sha256 = $env:NSIS_SHA256
        $valid = (Test-Path -LiteralPath $setup -PathType Leaf) -and ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -eq $sha256)
        if (-not $valid) {
          New-Item -ItemType Directory -Path (Split-Path -Parent $setup) -Force | Out-Null
          # Keep partial/unverified downloads out of the cached path.
          $partial = "$setup.download"
          try {
            curl.exe -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o $partial "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version-setup.exe"
            if ($LASTEXITCODE -ne 0) { throw "NSIS $version download failed (curl exit $LASTEXITCODE)" }
            $got = (Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $sha256) { throw "nsis-$version-setup.exe: SHA-256 $got, expected $sha256" }
            Move-Item -LiteralPath $partial -Destination $setup -Force
          } finally {
            if (Test-Path -LiteralPath $partial) { Remove-Item -LiteralPath $partial -Force }
          }
        } else {
          Write-Host "Using verified cached NSIS $version installer"
        }
        # An installer edits the machine PATH, which does not reach later Actions steps.
        # Find makensis explicitly and export DAY_MAKENSIS for day pack and day doctor.
        function Find-Makensis {
          $roots = @("$env:ProgramFiles\NSIS", "${env:ProgramFiles(x86)}\NSIS", "$env:ChocolateyInstall\bin", "$env:ChocolateyInstall\lib\nsis") | Where-Object { $_ -and (Test-Path $_) }
          if (-not $roots) { return $null }
          Get-ChildItem -Path $roots -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        $exe = Find-Makensis
        if (-not $exe) {
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS $version installer exited $($process.ExitCode)" }
          $exe = Find-Makensis
        }
        if (-not $exe) { throw "makensis.exe not found after installing NSIS $version" }
        "DAY_MAKENSIS=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "makensis: $($exe.FullName)"
    # Save now, before compilation/tests: their failure must not discard a verified installer.
    # No restore-keys: an older version or different checksum is never a compatible fallback.
    - name: Save the NSIS installer
      if: inputs.pack == 'true' && steps.canonical-target.outputs.target == 'windows-winui' && steps.nsis-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.nsis-installer.outputs.path }}
        key: ${{ steps.nsis-cache.outputs.cache-primary-key }}
