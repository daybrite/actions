name: Assert the checkout is pristine
description: >-
  Fail unless the working tree has no uncommitted changes, so the artifact this run packs can be
  rebuilt from its commit.

inputs:
  path:
    description: Directory to check (defaults to the workspace root).
    required: false
    default: "."
  skip-reason:
    description: >-
      When set, skip the check and say why. The guarantee this enforces — that the artifact can be
      rebuilt from its commit — does not exist for a project that is in no commit, so a caller that
      GENERATES the project it builds passes its reason here instead of getting a failure it cannot
      act on.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Skipped
      if: inputs.skip-reason != ''
      shell: bash
      run: echo "::notice::pristine check skipped — ${{ inputs.skip-reason }}"

    - name: Check
      if: inputs.skip-reason == ''
      shell: bash
      run: |
        set -euo pipefail
        # `day pack` records HEAD and a `dirty` flag in the SBOM, and `day rebuild` refuses an
        # artifact whose flag is set: a commit cannot describe a tree that has extra files in it.
        # So a packing job must keep the checkout pristine — whatever it downloads or generates
        # belongs in $RUNNER_TEMP, not in the workspace, which on GitHub Actions IS the checkout.
        # Run this immediately before `day pack`, so a stray path names itself here instead of
        # surfacing a job later as "no rebuild can reproduce it".
        changes="$(git -C "${{ inputs.path }}" status --porcelain)"
        if [ -n "$changes" ]; then
          echo "::error::the working tree is not pristine, so the artifact this job packs could not be rebuilt from its commit"
          printf '%s\n' "$changes"
          echo "Untracked files count too: they are inputs the commit does not describe. Put"
          echo "anything a job downloads or generates under \$RUNNER_TEMP instead of the workspace."
          exit 1
        fi
        echo "working tree pristine at $(git -C "${{ inputs.path }}" rev-parse --short HEAD)"
