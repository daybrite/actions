name: Store rules
description: >-
  The stores' rules the shared workflow holds a listing to — each store's fields and limits,
  locale spellings and screenshot sizes — as a file for `day store stage --rules`, `day store
  screenshots --rules` and `day lint`. Kept here rather than only inside the day CLI, so a store
  changing what it accepts is a data edit in this repository, in force for every app on its next
  run, with no CLI release in between. The CLI ships the same file as its default, and `day store
  export` carries the rules in force.
outputs:
  path:
    description: The rules file, for DAY_STORE_RULES or `--rules`.
    # From the step, not `github.action_path` here: that context is set only while the
    # action's steps run, and in a composite action's `outputs` it evaluates to nothing, which
    # handed every caller `/store-rules.toml` (Day-Showcase's store uploads, 2026-09-25).
    value: ${{ steps.locate.outputs.path }}
runs:
  using: composite
  steps:
    - id: locate
      shell: bash
      run: |
        set -euo pipefail
        rules="${{ github.action_path }}/store-rules.toml"
        [ -f "$rules" ] || { echo "::error::store-rules.toml is not beside this action ($rules)"; exit 1; }
        echo "path=$rules" >> "$GITHUB_OUTPUT"
        echo "store rules from $rules"
