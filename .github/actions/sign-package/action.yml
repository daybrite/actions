name: Sign a package
description: >-
  Sign a packed app with key material named on the command line — an iOS .ipa with a
  distribution certificate and an App Store profile (stored, or issued now from an App Store
  Connect key), an Android .aab or .apk with the upload keystore — through `day sign apply`, which
  re-signs the package as an archive so no app code runs. The material lives in an ephemeral
  keychain that is destroyed when the action ends, whatever happened in between. Both the shared
  `dayapp.yml` workflow (its `sign-ios` job) and the App Fair's queue sign with this action; a
  caller sets up the day CLI first (`setup-day-cli`, which exports DAY_BIN).

inputs:
  target:
    description: The Day target the package was packed for, ios-uikit or android-mdc.
    required: true
  package:
    description: The package to sign, an absolute path.
    required: true
  rename-unsigned:
    description: >-
      A package named `<stem>-unsigned.<ext>` (what `day pack --no-sign` writes) is signed to
      `<stem>.<ext>`, the unsigned file is removed, and the provenance sidecars beside it are
      renamed after the signed one. Off, the package is signed in place.
    required: false
    default: "true"
  also-sign:
    description: >-
      Android: further packages to sign with the same key, one path per line (the .apk beside
      the .aab, say). One that cannot be signed on this runner is deleted with a warning rather
      than left unsigned, since an unsigned .apk cannot be installed.
    required: false
    default: ""
  # --- Android ------------------------------------------------------------------------------
  keystore-b64:
    description: Base64 upload keystore.
    required: false
  key-alias:
    description: The key alias inside that keystore.
    required: false
  keystore-password:
    description: The keystore password.
    required: false
  key-password:
    description: The key password.
    required: false
  # --- Apple --------------------------------------------------------------------------------
  apple-cert-p12:
    description: Base64 distribution certificate (.p12).
    required: false
  apple-cert-password:
    description: The password for that certificate.
    required: false
  apple-identity:
    description: >-
      The signing identity, by name or SHA-1. `codesign` matches a name as a prefix, so "iPhone
      Distribution: …" and "Apple Distribution: …" are different identities. Empty takes the one
      identity the certificate holds, and refuses a certificate that holds more than one.
    required: false
    default: ""
  apple-profile-b64:
    description: >-
      Base64 App Store provisioning profile. Empty asks Apple for one now, for `app-id` against
      the imported certificate, through the App Store Connect key below (`fastlane sigh`), so
      the caller stores no profile per app.
    required: false
    default: ""
  app-id:
    description: The bundle id to issue a profile for, when no profile is given.
    required: false
    default: ""
  apple-team:
    description: The Apple Developer team id the App Store Connect key belongs to.
    required: false
    default: ""
  asc-key-id:
    description: App Store Connect API key id, for issuing a profile.
    required: false
    default: ""
  asc-issuer:
    description: App Store Connect issuer id, for issuing a profile.
    required: false
    default: ""
  asc-key-b64:
    description: Base64 App Store Connect API key (.p8), for issuing a profile.
    required: false
    default: ""
  asc-key-path:
    description: "The App Store Connect API key as a file already on the runner; wins over asc-key-b64."
    required: false
    default: ""

outputs:
  package:
    description: The signed package's path (renamed when rename-unsigned applied).
    value: ${{ steps.done.outputs.package }}

runs:
  using: composite
  steps:
    - name: Check the caller set up the day CLI
      shell: bash
      run: |
        set -euo pipefail
        [ -n "${DAY_BIN:-}" ] && [ -x "$DAY_BIN" ] || { echo "::error::sign-package needs DAY_BIN — run daybrite/actions/.github/actions/setup-day-cli first"; exit 1; }
        [ -f "${{ inputs.package }}" ] || { echo "::error::no package at ${{ inputs.package }}"; exit 1; }
        case "${{ inputs.target }}" in
          ios-uikit|android-mdc) ;;
          *) echo "::error::sign-package signs ios-uikit and android-mdc packages, not ${{ inputs.target }}"; exit 1 ;;
        esac

    # The signed file's name: `<stem>-unsigned.<ext>` becomes `<stem>.<ext>`, the way the release
    # job names its assets, so `day rebuild` still finds the provenance sidecars beside it.
    - name: Name the signed package
      id: name
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        RENAME: ${{ inputs.rename-unsigned }}
      run: |
        set -euo pipefail
        SIGNED="$PACKAGE"
        if [ "$RENAME" = true ]; then
          ext="${PACKAGE##*.}"
          case "$PACKAGE" in
            *-unsigned."$ext") SIGNED="${PACKAGE%-unsigned.$ext}.$ext" ;;
          esac
        fi
        echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

    # --- Android ---------------------------------------------------------------------------
    - name: Sign the Android package
      if: inputs.target == 'android-mdc'
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        SIGNED: ${{ steps.name.outputs.signed }}
        KEYSTORE_B64: ${{ inputs.keystore-b64 }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        DAY_SIGN_STORE_PASS: ${{ inputs.keystore-password }}
        DAY_SIGN_KEY_PASS: ${{ inputs.key-password }}
        ALSO: ${{ inputs.also-sign }}
      run: |
        set -euo pipefail
        [ -n "${KEYSTORE_B64:-}" ] || { echo "::error::no upload keystore (keystore-b64) to sign with"; exit 1; }
        [ -n "${KEY_ALIAS:-}" ] || { echo "::error::no key alias (key-alias) for the keystore"; exit 1; }
        umask 077
        printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.keystore"
        # `day sign apply` takes the key on the command line, so the app's [signing] tables are
        # not read and cannot influence which of this runner's variables are used.
        "$DAY_BIN" sign apply "$PACKAGE" ${SIGNED:+--out "$SIGNED"} \
          --keystore "$RUNNER_TEMP/upload.keystore" --key-alias "$KEY_ALIAS"
        [ -f "$SIGNED" ] || { echo "::error::day sign apply wrote no $SIGNED"; exit 1; }
        if [ "$SIGNED" != "$PACKAGE" ]; then
          rm -f "$PACKAGE"
          for side in "$PACKAGE".*; do
            [ -e "$side" ] || continue
            mv "$side" "$SIGNED${side#"$PACKAGE"}"
          done
        fi
        # An .apk takes zipalign and apksigner from the Android build-tools, where the .aab takes
        # jarsigner. A runner without them must not stop a store submission, and an unsigned .apk
        # must not reach a release, so one that cannot be signed is deleted here.
        while IFS= read -r extra; do
          [ -n "$extra" ] || continue
          [ -f "$extra" ] || continue
          if "$DAY_BIN" sign apply "$extra" \
              --keystore "$RUNNER_TEMP/upload.keystore" --key-alias "$KEY_ALIAS"; then
            continue
          fi
          rm -f "$extra"
          echo "::warning::$(basename "$extra") could not be signed on this runner, so it is left out; the package the store receives is signed"
        done <<< "$ALSO"
        rm -f "$RUNNER_TEMP/upload.keystore"

    # --- Apple -----------------------------------------------------------------------------
    - name: Create an ephemeral signing keychain
      if: inputs.target == 'ios-uikit'
      shell: bash
      env:
        CERT_P12: ${{ inputs.apple-cert-p12 }}
        CERT_PASSWORD: ${{ inputs.apple-cert-password }}
        IDENTITY: ${{ inputs.apple-identity }}
      run: |
        set -euo pipefail
        [ -n "${CERT_P12:-}" ] || { echo "::error::no distribution certificate (apple-cert-p12) to sign with"; exit 1; }
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASS="$(openssl rand -base64 24)"
        security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
        umask 077
        printf '%s' "$CERT_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/cert.p12"
        MAGIC="$(head -c 2 "$RUNNER_TEMP/cert.p12" | xxd -p)"
        if [ "$MAGIC" != 3082 ]; then
          echo "::error::apple-cert-p12 decoded to $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') byte(s) that are not a PKCS#12 certificate (expected DER 30 82, got '${MAGIC:-nothing}'). The secret must hold the output of \`base64 -i Certificates.p12\`, not the certificate itself."
          rm -f "$RUNNER_TEMP/cert.p12"
          exit 1
        fi
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign -f pkcs12
        rm -f "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
        security find-identity -v -p codesigning "$KEYCHAIN"
        if [ -n "${IDENTITY:-}" ]; then
          # Compare against the imported certificate, so a mismatch is reported here instead of
          # as codesign's "no identity found" later in the run.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$IDENTITY" || {
            echo "::error::the imported certificate is not \"$IDENTITY\"; pass the name printed above as apple-identity"
            exit 1
          }
          SIGN_ID="$IDENTITY"
        else
          COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c '^[[:space:]]*[0-9][0-9]*)')"
          [ "$COUNT" = 1 ] || { echo "::error::expected exactly 1 identity in the certificate, found $COUNT; name one with apple-identity"; exit 1; }
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*1\)/ {print $2; exit}')"
        fi
        {
          echo "SIGN_KEYCHAIN=$KEYCHAIN"
          echo "SIGN_ID=$SIGN_ID"
        } >> "$GITHUB_ENV"

    - name: Take or issue the App Store profile
      if: inputs.target == 'ios-uikit'
      shell: bash
      env:
        # fastlane reports usage to its own servers unless told not to.
        FASTLANE_OPT_OUT_USAGE: "1"
        PROFILE_B64: ${{ inputs.apple-profile-b64 }}
        APP_ID: ${{ inputs.app-id }}
        APPLE_TEAM: ${{ inputs.apple-team }}
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER: ${{ inputs.asc-issuer }}
        ASC_KEY_B64: ${{ inputs.asc-key-b64 }}
        ASC_KEY_PATH: ${{ inputs.asc-key-path }}
      run: |
        set -euo pipefail
        DEST="$RUNNER_TEMP/appstore.mobileprovision"
        umask 077
        if [ -n "${PROFILE_B64:-}" ]; then
          # A stored profile wins, for an app that needs a particular one.
          printf '%s' "$PROFILE_B64" | tr -d '[:space:]' | base64 --decode > "$DEST"
          echo "using the stored profile"
        else
          # Otherwise Apple issues one now for the app id, against the certificate imported
          # above, so no profile is stored or renewed by the caller.
          [ -n "${APP_ID:-}" ] || { echo "::error::no profile (apple-profile-b64) and no app-id to issue one for"; exit 1; }
          if [ -z "${ASC_KEY_PATH:-}" ] && [ -n "${ASC_KEY_B64:-}" ]; then
            ASC_KEY_PATH="$RUNNER_TEMP/asc-for-profile.p8"
            printf '%s' "$ASC_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$ASC_KEY_PATH"
          fi
          [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER:-}" ] && [ -s "${ASC_KEY_PATH:-}" ] || {
            echo "::error::no App Store Connect key (asc-key-id, asc-issuer, asc-key-b64 or asc-key-path), so no profile can be issued for $APP_ID"
            exit 1
          }
          # fastlane's API-key file, written where only this job can read it.
          python3 -c 'import json, os, pathlib; print(json.dumps({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER"], "key": pathlib.Path(os.environ["ASC_KEY_PATH"]).read_text(), "in_house": False}))' > "$RUNNER_TEMP/asc-key.json"
          command -v fastlane >/dev/null || sudo gem install fastlane --no-document
          # `--force` regenerates the profile, so it carries the certificate this run signs with.
          fastlane sigh \
            --api_key_path "$RUNNER_TEMP/asc-key.json" \
            --app_identifier "$APP_ID" \
            ${APPLE_TEAM:+--team_id "$APPLE_TEAM"} \
            --platform ios \
            --force \
            --output_path "$RUNNER_TEMP/profiles" \
            --filename appstore.mobileprovision
          mv "$RUNNER_TEMP/profiles/appstore.mobileprovision" "$DEST"
          rm -f "$RUNNER_TEMP/asc-key.json" "$RUNNER_TEMP/asc-for-profile.p8"
        fi
        security cms -D -i "$DEST" | plutil -extract UUID raw -o - - >/dev/null \
          || { echo "::error::the profile is not a .mobileprovision"; exit 1; }
        # What the profile is, for reading against a later signing failure.
        security cms -D -i "$DEST" | plutil -p - | grep -E '"(Name|UUID|TeamIdentifier|ExpirationDate)"' || true
        echo "SIGN_PROFILE=$DEST" >> "$GITHUB_ENV"

    # `day sign apply` re-signs the package as an archive: the profile is embedded, every binary
    # inside is signed with the identity, and no app code runs.
    - name: Sign the .ipa
      if: inputs.target == 'ios-uikit'
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        SIGNED: ${{ steps.name.outputs.signed }}
      run: |
        set -euo pipefail
        "$DAY_BIN" sign apply "$PACKAGE" ${SIGNED:+--out "$SIGNED"} \
          --profile "$SIGN_PROFILE" --identity "$SIGN_ID"
        [ -f "$SIGNED" ] || { echo "::error::day sign apply wrote no $SIGNED"; exit 1; }
        if [ "$SIGNED" != "$PACKAGE" ]; then
          rm -f "$PACKAGE"
          for side in "$PACKAGE".*; do
            [ -e "$side" ] || continue
            mv "$side" "$SIGNED${side#"$PACKAGE"}"
          done
        fi
        ls -1 "$(dirname "$SIGNED")"

    - name: Report the signed package
      id: done
      shell: bash
      run: echo "package=${{ steps.name.outputs.signed }}" >> "$GITHUB_OUTPUT"

    - name: Destroy the signing keychain
      if: always()
      shell: bash
      run: |
        [ -n "${SIGN_KEYCHAIN:-}" ] && security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP/cert.p12" \
          "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/asc-key.json" "$RUNNER_TEMP/asc-for-profile.p8"
