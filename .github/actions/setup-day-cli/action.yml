name: Set up the day CLI
description: >-
  Put a `day` CLI on the runner and export DAY_BIN, from crates.io, from git, or from an artifact
  this run already built.

inputs:
  version:
    description: >-
      `latest` (newest crates.io release), a semver (`v1.2.3` / `1.2.3`), a 40-hex commit, or a
      branch of the day repository. Ignored when `source` is `artifact`.
    required: false
    default: latest
  git:
    description: Git URL of the day repository, for branch/commit installs.
    required: false
    default: https://github.com/daybrite/day.git
  source:
    description: >-
      `install` builds the CLI with cargo (crates.io or git). `artifact` downloads the
      `day-<os>-<arch>` artifact an earlier job in THIS run uploaded — which is how the day
      repository tests its own CLI against its own apps, and how any caller can avoid compiling
      the CLI once per matrix leg.
    required: false
    default: install
  cache:
    description: >-
      Cache a CLI built from git, keyed on the exact commit the branch, tag or commit in `version`
      resolves to: `day-cli-<runner image>-<arch>-<commit>`. A leg whose commit already has a
      cached build restores it instead of compiling; a new commit builds and saves it. Releases
      from crates.io (`latest`, a semver) and `source: artifact` are not cached. `false` builds
      every time.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Download the day CLI (${{ runner.os }})
      if: inputs.source == 'artifact'
      uses: actions/download-artifact@v8
      with:
        name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
        path: ${{ runner.temp }}/day-cli

    - name: Locate the day CLI (exports DAY_BIN)
      if: inputs.source == 'artifact'
      shell: bash
      run: |
        set -euo pipefail
        # The binary stays in the runner temp dir, NOT the workspace: the workspace is the
        # checkout, and an untracked directory in it makes `day pack` record a dirty tree, which
        # `day rebuild` then refuses. On Windows $RUNNER_TEMP is a DOS path, which cygpath turns
        # into one `find` can walk.
        TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
        BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
        [ -n "$BIN" ] || { echo "::error::no day binary in the day-* artifact"; exit 1; }
        # upload-artifact drops the executable bit.
        chmod +x "$BIN" 2>/dev/null || true
        echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
        "$BIN" version

    # NO build-directory cache here, deliberately (2026-08): a cached CARGO_TARGET_DIR made
    # `cargo install --git --branch main` reuse the PREVIOUS run's day-cli wholesale — zero
    # recompilation, "Finished in 3.33s" — installing a stale binary labeled with the new
    # commit. For a tool whose generated files are pristine-checked in every app repo, a
    # binary that silently lags its own source is worse than the minutes a cold build costs.
    #
    # The `cache` input caches the INSTALLED binary instead, under a key naming the one commit
    # it was built from: the ref is resolved to a commit here and the build installs that
    # commit with --rev, so a key can never hold another commit's binary, even if the branch
    # moves while the run is in flight. The key names the runner image rather than just the OS
    # because a Linux binary links the glibc of the image that built it, and a new image rolls
    # out gradually.
    - name: Resolve the day commit (for the CLI cache)
      id: rev
      if: inputs.source != 'artifact' && inputs.cache == 'true'
      shell: bash
      env:
        VERSION_IN: ${{ inputs.version }}
        GIT_URL: ${{ inputs.git }}
      run: |
        set -euo pipefail
        V="${VERSION_IN:-latest}"
        REV=""
        if [ "$V" = latest ] || [[ "$V" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "A crates.io release ($V) is not cached."
          exit 0
        elif [[ "$V" =~ ^[0-9a-fA-F]{40}$ ]]; then
          REV="$(printf '%s' "$V" | tr 'A-F' 'a-f')"
        else
          # A branch wins over a tag of the same name, as `cargo install --branch` would pick;
          # an annotated tag's peeled `^{}` line names its commit rather than the tag object.
          REFS="$(git ls-remote "$GIT_URL" "refs/heads/$V" "refs/tags/$V" "refs/tags/$V^{}")"
          for REF in "refs/heads/$V" "refs/tags/$V^{}" "refs/tags/$V"; do
            REV="$(printf '%s\n' "$REFS" | awk -v r="$REF" '$2 == r { print $1; exit }')"
            [ -z "$REV" ] || break
          done
          if [ -z "$REV" ]; then
            echo "::warning::'$V' is neither a branch nor a tag of $GIT_URL, so the day CLI is not cached"
            exit 0
          fi
        fi
        # The image name implies the OS but not the architecture (macos15 names both the Intel
        # and the Apple silicon image). A self-hosted runner sets no ImageOS, so the OS stands
        # in for it there.
        IMAGE="${ImageOS:-$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')}"
        ARCH=x86_64
        [ "$RUNNER_ARCH" != ARM64 ] || ARCH=aarch64
        echo "rev=$REV" >> "$GITHUB_OUTPUT"
        echo "key=day-cli-$IMAGE-$ARCH-$REV" >> "$GITHUB_OUTPUT"
        echo "$V resolves to $REV"

    # Its own directory under the runner temp dir, outside both the workspace (see the artifact
    # step above) and ~/.cargo, so the cache holds the CLI and nothing else cargo installed.
    - name: Restore the cached day CLI
      id: cache
      if: steps.rev.outputs.rev != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/day-cli-cache
        key: ${{ steps.rev.outputs.key }}

    - name: Install the day CLI (${{ inputs.version }}, cached per commit)
      if: steps.rev.outputs.rev != ''
      shell: bash
      env:
        GIT_URL: ${{ inputs.git }}
        REV: ${{ steps.rev.outputs.rev }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        ROOT="$RUNNER_TEMP/day-cli-cache"
        BIN="$(cygpath -u "$ROOT" 2>/dev/null || printf '%s' "$ROOT")/bin/day"
        [ "$RUNNER_OS" != Windows ] || BIN="$BIN.exe"
        if [ "$CACHE_HIT" = true ] && [ -x "$BIN" ]; then
          echo "Using the day CLI cached for $REV."
        else
          cargo install day-cli --locked --git "$GIT_URL" --rev "$REV" --root "$ROOT"
        fi
        if [ "$RUNNER_OS" = Windows ]; then
          printf '%s\n' "$RUNNER_TEMP\\day-cli-cache\\bin" >> "$GITHUB_PATH"
        else
          echo "$ROOT/bin" >> "$GITHUB_PATH"
        fi
        echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
        "$BIN" version

    # Saved right after the build rather than in a post step, so a leg whose app build fails
    # later still leaves the CLI for the next run. Legs that miss together each try to save the
    # same key; the first wins, and the rest log a warning.
    - name: Cache the day CLI
      if: steps.rev.outputs.rev != '' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/day-cli-cache
        key: ${{ steps.rev.outputs.key }}

    - name: Install the day CLI (${{ inputs.version }})
      if: inputs.source != 'artifact' && steps.rev.outputs.rev == ''
      shell: bash
      env:
        VERSION_IN: ${{ inputs.version }}
        GIT_URL: ${{ inputs.git }}
      run: |
        set -euo pipefail
        V="${VERSION_IN:-latest}"
        if [ "$V" = latest ]; then
          cargo install day-cli --locked
        elif [[ "$V" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          cargo install day-cli --locked --version "${V#v}"
        elif [[ "$V" =~ ^[0-9a-fA-F]{40}$ ]]; then
          cargo install day-cli --locked --git "$GIT_URL" --rev "$V"
        else
          cargo install day-cli --locked --git "$GIT_URL" --branch "$V"
        fi
        # An installed CLI is on PATH; export DAY_BIN anyway so every caller can use one spelling.
        echo "DAY_BIN=day" >> "$GITHUB_ENV"
        day version
