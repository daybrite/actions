name: Generate the release launch scripts
description: >-
  Render `launch.sh` and `launch.ps1` into a release's asset directory: one-line scripts that
  download and run THIS release's desktop build. They are release assets rather than hosted files
  so that the version a user runs is decided by the URL they fetch, and so any Day app gets them
  without hosting anything.

inputs:
  assets-dir:
    description: >-
      The assembled release assets. Read to learn which desktop builds this release shipped; the
      scripts are written into it.
    required: true
  repo:
    description: "owner/name of the repository the release belongs to."
    required: true
  tag:
    description: The release tag. Baked in, so a script downloads its OWN release's artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Render launch.sh and launch.ps1
      shell: bash
      env:
        ASSETS_DIR: ${{ inputs.assets-dir }}
        RELEASE_REPO: ${{ inputs.repo }}
        RELEASE_TAG: ${{ inputs.tag }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cd "$ASSETS_DIR"

        # Each template carries its release facts as ordinary assignments at the top, between two
        # markers. Rendering is therefore "the header, then new facts, then everything from the end
        # marker on" — no in-place substitution, so an asset name can hold any character without
        # escaping. `facts` is whatever the caller echoes.
        render() { # $1 = template, $2 = output; reads the facts from stdin
          {
            sed -n '1,/^# --- release facts/p' "$1" | sed '$d'
            echo "# --- release facts (generated by daybrite/actions for $RELEASE_TAG) ---"
            cat
            sed -n '/^# --- end release facts/,$p' "$1"
          } > "$2"
        }

        # The asset for one target, matched by extension AND combo: a provenance sidecar is named
        # after its artifact, so it contains both, and only anchoring the extension separates them.
        asset_for() { # $1 = target, $2 = extension
          find . -maxdepth 1 -type f -name "*-$1*.$2" -exec basename {} \; | sort | head -1
        }

        # --- launch.sh: macOS and Linux ------------------------------------------------------
        # Linux takes the .appimage, not the .flatpak the same release ships: it is one executable
        # carrying its own toolkit, so running it needs nothing installed, which is the whole
        # premise of a curl-able launcher.
        table=""
        for target in macos-appkit linux-gtk linux-qt; do
          case "$target" in
            macos-appkit) ext=dmg ;;
            *) ext=appimage ;;
          esac
          asset="$(asset_for "$target" "$ext")"
          if [ -n "$asset" ]; then
            table="$table$target=$asset"$'\n'
          fi
        done
        table="${table%$'\n'}"
        if [ -z "$table" ]; then
          echo "::notice::no macos-appkit .dmg or linux .appimage in this release — no launch.sh generated"
        else
          render "$ACTION_DIR/launch.sh" launch.sh <<EOF
        REPO="$RELEASE_REPO"
        TAG="$RELEASE_TAG"
        # One \`<target>=<asset>\` per line, listing exactly what this release shipped.
        ASSETS="$table"
        EOF
          chmod +x launch.sh
          bash -n launch.sh
          echo "launch.sh targets:"
          sed -n '/^ASSETS="/,/"$/p' launch.sh
        fi

        # --- launch.ps1: Windows -------------------------------------------------------------
        # The NSIS installer, not the .msix: an .msix will not install unless its certificate is
        # one Windows already trusts, and CI signs with a per-run development cert. The installer
        # is per-user and relocatable, so the script can put it in a temp directory.
        win="$(asset_for windows-xaml exe)"
        if [ -z "$win" ]; then
          echo "::notice::no windows-xaml -setup.exe in this release — no launch.ps1 generated"
        else
          render "$ACTION_DIR/launch.ps1" launch.ps1 <<EOF
        \$Repo = "$RELEASE_REPO"
        \$Tag = "$RELEASE_TAG"
        \$Asset = "$win"
        EOF
          # Parse it before the release exists. A broken .ps1 attached to a published release is a
          # broken one-liner on the download page until the next tag; failing here costs a re-run.
          if command -v pwsh > /dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $errs = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path ./launch.ps1), [ref]$null, [ref]$errs) | Out-Null
              if ($errs) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
              Write-Host "launch.ps1 parses"'
          else
            echo "::warning::pwsh not on this runner — launch.ps1 was not parse-checked"
          fi
          echo "launch.ps1 asset: $win"
        fi
