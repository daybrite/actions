# validate — prove the reusable build-day-app workflow works before anyone depends on it.
#
# Scaffolds a fresh app with `day new app` (via the reusable workflow's setup-command input) and
# builds it for all 8 primary platform-toolkit pairs, web-dom included — so the web build + staging
# path is exercised too. This covers the whole surface a real caller uses: the target matrix and
# runner mapping, the day CLI install path, every per-target toolchain recipe, `day build`,
# `day pack` (and the web-dom dist staging), the dayscript runner (the scaffold ships
# dayscript/demo.yaml), and the artifact uploads. The release-assets and Pages-deploy jobs stay
# skipped — this repo doesn't tag app releases, and deploy-web is off (it publishes to a live
# Pages site, which a validation run must not do).
#
# day-version is "main" so the CLI and the scaffold's git framework dependency come from the same
# tree. ("latest" would pair the released CLI's template with the framework's main branch, which
# can skew between releases.)
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The launch scripts are generated from an asset list, so the interesting failure is not "does
  # the template parse" but "does the RENDERED file parse, and did it pick the right assets".
  # A fixture release is cheap and catches both — including on a macOS-only workstation, where
  # neither pwsh nor an AppImage is available to check by hand.
  launch-scripts:
    name: launch scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fake a release's assets
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          # Every shape the generator has to choose between: two Linux formats where only the
          # AppImage is wanted, an .msix beside the installer the Windows script wants, mobile
          # artifacts that neither script can run, and a provenance sidecar per artifact whose
          # name contains both the target and the package extension.
          touch demo-app-macos-appkit.dmg demo-app-macos-appkit.dmg.buildinfo.json \
                demo-app-linux-gtk-x86_64.flatpak demo-app-linux-gtk-x86_64.appimage \
                demo-app-linux-qt-x86_64.flatpak demo-app-linux-qt-x86_64.appimage \
                demo-app-windows-xaml.msix demo-app-windows-xaml-setup.exe \
                demo-app-windows-xaml-setup.exe.sbom-cdx.json \
                demo-app-android-mdc.aab demo-app-ios-uikit.ipa screenshots-macos-appkit.zip
      - name: Generate them
        uses: ./.github/actions/launch-script
        with:
          assets-dir: assets
          repo: daybrite/demo-app
          tag: v9.9.9
      - name: Check what they picked
        run: |
          set -euo pipefail
          cd assets
          # Compare the generated tables EXACTLY, rather than grepping the whole file for words
          # like "flatpak": both scripts explain in prose why they choose what they choose, so a
          # word-absence test fails on its own documentation. What matters is the selection.
          # awk, not a sed range: a sed `/^ASSETS="/,/"$/` cannot end on its own start line, so a
          # one-target release would read past the table into the rest of the file.
          table="$(awk '/^ASSETS="/ { f = 1; sub(/^ASSETS="/, "") }
                        f { if (sub(/"$/, "")) { print; exit } print }' launch.sh)"
          expected='macos-appkit=demo-app-macos-appkit.dmg
          linux-gtk=demo-app-linux-gtk-x86_64.appimage
          linux-qt=demo-app-linux-qt-x86_64.appimage'
          if [ "$table" != "$expected" ]; then
            echo "::error::launch.sh selected the wrong assets"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$table") || true
            exit 1
          fi
          # Windows takes the per-user installer, never the .msix (which needs a trusted cert).
          asset="$(sed -n 's/^\$Asset = "\(.*\)"$/\1/p' launch.ps1)"
          if [ "$asset" != "demo-app-windows-xaml-setup.exe" ]; then
            echo "::error::launch.ps1 selected '$asset'"
            exit 1
          fi
          [ -x launch.sh ] || { echo "::error::launch.sh is not executable"; exit 1; }
          # --help runs the whole option-parsing path without downloading anything.
          ./launch.sh --help
          if ./launch.sh --target android-mdc; then
            echo "::error::launch.sh should refuse a target it has no build for"
            exit 1
          fi
          pwsh -NoProfile -File ./launch.ps1 -Help

  build-scaffold:
    uses: ./.github/workflows/build-day-app.yml
    with:
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      day-version: main
      # Exercise the device-profile fan-out: android-mdc becomes two parallel jobs, the second
      # packing nothing and uploading `screenshots-android-mdc-tablet`. Android carries it rather
      # than iOS because the fan-out logic is shared and ubuntu minutes are the cheap ones — the
      # iOS half of the path (prefix-matching a simulator) runs on every single-profile build too.
      android-profiles: pixel_5, pixel_tablet=tablet
      project-path: ci-app
      setup-command: >-
        day new app ci-app
        --toolkit windows-xaml,macos-appkit,linux-gtk,linux-qt,ios-uikit,android-mdc,harmony-arkui,web-dom
        --appid dev.daybrite.ciapp --git --no-input
