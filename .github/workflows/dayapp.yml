# dayapp — the reusable build workflow for conventional Day projects.
#
# Call it from a Day app repository to build, exercise, package, and (for web-dom) deploy the app
# for a set of platform-toolkit targets. The recipes are a subset of daybrite/day's own ci.yml
# showcase pipeline, reduced to: install the day CLI, build the project, run its dayscripts
# (capturing screenshots), and `day pack` a distributable. Everything waits on a `preflight` job
# that runs cheap Rust first-pass checks (inputs.preflight-checks — `cargo fmt --all -- --check`
# by default, clippy/check/test opt-in) so a formatting slip fails one ubuntu job, not every
# runner in the matrix. On a semantic-version tag (vX.Y.Z), a
# final job attaches every package and a per-target screenshot zip to the GitHub release. Packages
# are packed with `--no-version-in-name` (version-less filenames like app-fair.aab); each asset
# name is normalized to lowercase-kebab, tagged with its platform-toolkit combo, and stripped of
# pack's `-unsigned` .ipa marker (Day Skies.dmg → day-skies-macos-appkit.dmg; day-skies-setup.exe →
# day-skies-windows-xaml-setup.exe; day-skies.hap → day-skies-harmony-arkui.hap), so each is
# reachable at a stable .../releases/latest/download/<name> URL.
#
# Example caller (.github/workflows/ci.yml in the app repo) — build every target, and also publish
# the web build to this repo's GitHub Pages on each push to the default branch:
#
#   permissions:
#     contents: write         # release-asset upload on tag builds
#     pages: write            # web-dom → GitHub Pages (only used when deploy-web is set)
#     id-token: write         # deploy-pages OIDC token (only used when deploy-web is set)
#   jobs:
#     app:
#       uses: daybrite/actions/.github/workflows/dayapp.yml@main
#       secrets: inherit          # forwards optional DAY_* signing secrets
#       with:
#         targets: macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, web-dom
#         deploy-web: true        # publish the web-dom build to the repo's GitHub Pages
#
# Signing: pack degrades to the dev tier (ad-hoc / unsigned device .ipa / dev keystore /
# self-signed) when the DAY_*
# secrets are absent — it never fails for that reason. On semantic-version tags, the same secret
# names daybrite/day's ci.yml uses (DAY_SIGN_MACOS_IDENTITY, DAY_APPLE_CERT_P12, …) light up
# release signing when configured and forwarded with `secrets: inherit`.
#
# Store uploads: on the same semantic-version tags, three independent jobs can hand the packed
# .ipa / macOS build products / .aab to the app's own fastlane lanes (App Store Connect, Mac App
# Store, Google Play). Each is auto-enabled when the repo carries a Fastfile with the matching
# `platform :ios` / `platform :mac` / `platform :android` block, or forced with the
# upload-ios/-macos/-play inputs. The Fastfile owns credentials and store policy; the workflow
# hands it the artifact via DAY_IPA / DAY_PKG_OR_APP / DAY_AAB.
#
# Staging a release: `release-mode: pre-release` publishes the tag's release behind GitHub's
# pre-release flag, so its packages are downloadable by tag while `releases/latest` and the
# project website's release channel keep describing the version before it. Marking the release
# Latest fires a `release: released` event; a caller that listens for it
#
#   on:
#     push:
#       tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
#     release:
#       types: [released]
#
# rebuilds and redeploys the site against the new latest release. That run assembles no release
# and uploads to no store, since the tag's own build did both.
#
# Web deploy: with `deploy-web: true` (and web-dom among the targets), a final `pages` job
# publishes the web-dom build to the CALLER's own GitHub Pages — reusing the release-profile dist
# the build job already produced, so there is no second build. The dist is relative-path, so it
# serves from a project-Pages subpath (https://<owner>.github.io/<repo>/) with no `<base>` tag. By
# default it deploys on a push to the repo's default branch; set `web-deploy-tag-pattern` to a
# regex (e.g. `^v[0-9]+\.[0-9]+\.[0-9]+$`) to publish only on matching tags instead. The caller
# must grant `pages: write` + `id-token: write` (shown above) and, one time, set Settings → Pages
# → Source = "GitHub Actions"; no secrets are involved (the deploy uses the workflow's OIDC token).

name: dayapp

on:
  workflow_call:
    inputs:
      targets:
        description: >-
          Platform-toolkit pairs to build, comma- or space-separated. Supported:
          macos-appkit, macos-gtk, macos-qt, ios-uikit, linux-gtk, linux-qt,
          android-mdc, harmony-arkui, windows-xaml, windows-qt, windows-gtk, web-dom.
        type: string
        required: true
      day-version:
        description: >-
          Which day CLI to install: "latest" (newest crates.io release), a semantic version
          ("v1.2.3" or "1.2.3", from crates.io), a 40-hex commit, or a branch name of the day
          repository (built from git).
        type: string
        default: latest
      day-git:
        description: Git URL of the day repository, for branch/commit installs.
        type: string
        default: https://github.com/daybrite/day.git
      day-verbose:
        description: >-
          Run the day CLI verbose (DAY_VERBOSE=1): every `day build`/`launch`/`pack`/`rebuild`
          forwards its sub-commands' raw output — the cargo/gradle/xcodebuild/hvigor command
          lines and logs — instead of showing only day's own status lines. On by default, so a
          failed CI build shows the command that broke; set false for the quiet output.
          Installing the day CLI itself is cargo's own build and is unaffected either way.
          A pinned day-version that predates DAY_VERBOSE ignores it.
        type: boolean
        required: false
        default: true
      project-path:
        description: Directory of the Day project within the repository.
        type: string
        default: "."
      flavors:
        description: >-
          Build flavors to add to the matrix, comma- or space-separated. A flavor is a
          `Day-<name>.toml` beside the project's Day.toml that restates what differs — app id,
          title, targets, cargo features, resources, store listing — and a flavor named here gets
          a leg per target, built, scripted and packed with `DAY_FLAVOR=<name>` in the
          environment. The base app always builds: flavors add legs, they do not replace them.

              flavors: custom

          A flavor leg uploads `flavor-<name>-dist-<target>` and
          `flavor-<name>-screenshots-<target>`. Release assets, macOS notarization, the store
          uploads and the Pages deployment stay with the base app, so a flavor is built and
          exercised in CI without a second release path appearing under the same tag.

          A flavor whose `Day-<name>.toml` the project does not carry fails the run in preflight.
        type: string
        default: ""
      release-flavor:
        description: >-
          Attach this flavor's packages to the release as well as the base app's. Empty (the
          default) leaves a flavor's packages as workflow artifacts alone.

          What this is for: a flavor whose packages someone else has to be able to fetch and check
          — the App Fair's submission queue rebuilds an app from its tag and compares what it
          built against the release the maintainer published, and it can only do that when the
          release carries the same flavor's packages.
        type: string
        default: ""
      store-flavor:
        description: >-
          Which build the store-upload jobs publish on a semantic-version tag: the base app when
          empty (the default), or the named flavor. The flavor must also be in `flavors:`, since
          what gets uploaded is the package that leg packed.

              flavors: appfair
              store-flavor: appfair

          The upload jobs then take the `flavor-<name>-dist-<target>` artifact and stage that
          flavor's listing (`store-<name>/`, per its `Day-<name>.toml`), so the submission carries
          the flavor's app id, version, build number and store copy. What this is for: an app
          whose store records belong to a flavor rather than to the base build — a white-label
          release, or a rebuilt app continuing another one's listing.
        type: string
        default: ""
      setup-command:
        description: >-
          Optional shell command run at the repository root after the day CLI is installed and
          before anything else (e.g. `day new app …` to scaffold the project under test).
          Setting it marks the project as GENERATED, which skips the preflight checks,
          `update-day-deps` and the pristine check. For what one target needs on a checked-out
          project, use `target-packages` and `target-setup` instead.
        type: string
        default: ""
      target-packages:
        description: >-
          Extra packages particular targets need beyond Day's own set — one LINE per entry, as
          `<targets>: <packages>`, where several targets may share a line and a target may appear
          on several. Every leg of a named target installs them through setup-day-deps, with the
          runner's package manager: apt on the Ubuntu runners (linux, android, harmony, web),
          Homebrew on the macOS ones (macos-*, ios-uikit), Chocolatey for windows-xaml, and
          MSYS2's MINGW64 packages for windows-qt and windows-gtk.

              target-packages: |
                linux-gtk, linux-qt: gstreamer1.0-plugins-good gstreamer1.0-libav
                linux-qt: qt6-multimedia-dev

          A line starting with `#` is skipped. A line naming something that is not a target fails
          the run; a target this call does not build is only noted.
        type: string
        default: ""
      target-setup:
        description: >-
          Shell commands particular targets run after their dependencies install and before
          `day build` — one LINE per command, as `<targets>: <command>`, run with bash at the
          repository root in line order. `$DAY_BIN` is on hand, and a command can hand a variable
          to later steps through `$GITHUB_ENV`.

              target-setup: |
                linux-qt: echo "QT_MEDIA_BACKEND=gstreamer" >> "$GITHUB_ENV"

          Unlike `setup-command`, neither this nor `target-packages` marks the project as
          generated: the preflight checks, `update-day-deps` and the pristine check all still
          apply, so anything a command downloads or writes belongs under `$RUNNER_TEMP`.
        type: string
        default: ""
      scripts:
        description: >-
          Dayscripts to run on each target, comma- or space-separated paths relative to the
          project. "auto" (default) runs every dayscript/*.yaml or scripts/*.yaml in the project;
          "none" skips scripts entirely.
        type: string
        default: auto
      target-scripts:
        description: >-
          Dayscripts for particular targets, overriding `scripts` for those targets only — one
          LINE per rule, as `<targets>: <scripts>`, in the same shape as `target-setup` and
          `target-packages`. A target the list does not name falls back to `scripts`.

              target-scripts: |
                macos-appkit, windows-xaml: dayscript/walkthrough.yaml dayscript/windows.yaml
                android-mdc: dayscript/walkthrough.yaml dayscript/clipboard-roundtrip.yaml
                web-dom: dayscript/walkthrough.yaml dayscript/speech.yaml

          What this is for: a script can be meaningful on one target and meaningless on another,
          and `auto` (every dayscript in the project) is all-or-nothing. An app with a script per
          platform feature — a window script only the desktop toolkits have windows for, an
          emulator script only Android runs — names them per target here instead of running the
          whole directory everywhere and relying on each script to skip itself.

          The values are script lists exactly as `scripts` takes them, including `none` to run
          nothing on a target that should only build.
        type: string
        default: ""
      scripts-once:
        description: >-
          Scripts that run ONCE, in the app's own theme and locale, instead of once per
          `themes` × `locales` variant — comma- or space-separated paths, matched against the
          scripts that would otherwise run.

              scripts-once: dayscript/crash.yaml dayscript/crash-report.yaml

          For a script that CONSUMES the state it asserts on, where a second run has nothing left
          to find. The crash pair is the worked example: one script crashes the app to leave a
          report, the next asserts the report is there and taps Clear. Crossed with eight
          variants, the first run passes and the other seven fail on the report the first one
          cleared — the app is behaving correctly and the script is being asked the question twice.

          These run AFTER the crossed scripts, in the order given, so a pair like the above still
          sees the state the earlier scripts left.
        type: string
        default: ""
      launch-env:
        description: >-
          Space-separated KEY=VALUE pairs passed to every scripted launch as `--env` (values must
          not contain spaces). Example: "WEATHER_MOCK=1".
        type: string
        default: ""
      capture-size:
        description: >-
          Pixel size of the desktop-class screenshots (the desktop toolkits and web-dom), passed to
          every scripted launch as `--capture-size`: `2560x1600`, `2880x1800@2` (`@` names the
          render scale), or `window` for the app's own `[window]` size at the runner display's
          scale. Empty (default) leaves it to the app's Day.toml `[screenshots]` table, whose own
          default is 2560x1600 at 2x: a 1280x800-point window, and a size the Mac App Store
          accepts. Phones and tablets capture their device's panel and ignore it.
        type: string
        default: ""
      locales:
        description: >-
          Locales to run each dayscript under, comma- or space-separated (e.g. "en fr ar zh-CN"),
          or "all" for every locale the app ships (its `resource/locales/<tag>/` catalogs, default
          locale first). Each locale's screenshots land in their own variant directory. Empty =
          one run in the default locale.
        type: string
        default: ""
      android-abis:
        description: >-
          Android ABIs to build into the android-mdc package (APK/AAB), comma- or
          space-separated. Each ABI adds its own lib/<abi>/ slice, and its rustup target is
          installed automatically. Supported: arm64-v8a, armeabi-v7a, x86, x86_64. Applies only to
          the android-mdc target; ignored by every other target.
        type: string
        default: arm64-v8a x86_64
      day-source:
        description: >-
          Where the day CLI comes from. `install` (default) builds it with cargo, from crates.io or
          from git, per `day-version`. `artifact` downloads the `day-<os>-<arch>` artifact an
          EARLIER JOB IN THE SAME RUN uploaded — which is how the day repository tests its own CLI
          against its own app, and how any caller can stop compiling the CLI once per matrix leg.
        type: string
        required: false
        default: install
      day-cache:
        description: >-
          Cache a day CLI built from git (a branch, tag or commit in `day-version`), keyed on the
          exact commit that ref resolves to, so a leg whose commit is already built restores the
          CLI instead of compiling it. A crates.io release is not cached. Set false to build the
          CLI on every leg.
        type: boolean
        required: false
        default: true
      tolerate-failures:
        description: >-
          Let the best-effort work fail without failing the run: the pack and dayscripts of the
          portable-toolkit targets (macos-gtk, macos-qt, windows-qt, windows-gtk), the HarmonyOS
          emulator's boot and walkthrough, and the web-dom browser install. Off by default, so any
          of those failing fails its leg, and a failed leg holds back the release and the website
          deploys until a re-run of the failed jobs succeeds. `optional=true` device rows are
          tolerated either way.
        type: boolean
        required: false
        default: false
      artifact-prefix:
        description: >-
          Prefix for the package artifact names, so a repository that already publishes
          `dist-<target>` from another workflow does not collide. `showcase-` yields
          `showcase-dist-macos-appkit`. Screenshot artifacts are always `screenshots-<target>`.
        type: string
        required: false
        default: ""
      themes:
        description: >-
          Themes to run each dayscript under (e.g. `light dark`), expanded against `locales` into
          one run per combination. Empty runs the system default only.
        type: string
        required: false
        default: ""
      ios-profiles:
        description: >-
          Device profiles to run `ios-uikit`'s dayscripts on, comma-separated. Each becomes its
          own PARALLEL job, so two profiles cost two jobs rather than two script runs in one.
          A profile is matched as a PREFIX against the simulators available on the runner —
          `iPhone` takes the first iPhone, `iPad Pro` the first iPad Pro — because runner images
          rotate exact device names, and a pinned "iPhone 15" quietly disappears with the next
          image. A `*` stands for any run of characters, and the newest model wins among several
          matches: `iPhone * Pro Max` is the largest iPhone the image carries, whose captures are
          the 6.9-inch size App Store Connect requires for iPhone screenshots. An unmatched prefix
          fails the job loudly, listing what the image does have.

          Append `=<slug>` to fix the artifact suffix for a long device name
          (`iPad Pro 13-inch (M4)=ipad` uploads `screenshots-ios-uikit-ipad`); the default slug
          is the device name, kebab-cased.

          The FIRST profile is the primary one: it packs, uploads the packages and release
          assets, and keeps the plain `screenshots-ios-uikit` artifact name, so every existing
          consumer is unaffected. Later profiles build, run the scripts, and upload
          `screenshots-ios-uikit-<slug>` — they never pack, which is what keeps a tag build from
          racing two identical release assets. Unset = the default pair, a phone and a tablet
          (see `ios-devices`).
        type: string
        required: false
        default: ""
      ios-devices:
        description: >-
          Device profiles to run `ios-uikit`'s dayscripts on — one per LINE, each a
          comma-separated set of `key=value` fields. Each becomes its own PARALLEL job, so two
          profiles cost two jobs rather than two script runs in one.

          Fields: `device` (required), `os`, `orientation`, `slug`, `optional`.

              ios-devices: |
                device=iPhone * Pro Max,     os=iOS 26, orientation=portrait,  slug=iphone
                device=iPad Pro 13-inch,     os=iOS 26, orientation=landscape, slug=ipad
                device=iPhone * Pro Max,     os=iOS 16, optional=true

          `device` matches as a PREFIX against the simulators the runner has, and `os` as a major
          version taking the newest point release installed — because runner images rotate exact
          device names and runtimes, and a pinned "iPhone 15" quietly disappears with the next
          image. A `*` stands for any run of characters and the newest model wins, so
          `iPhone * Pro Max` is the largest iPhone the image carries: its captures are the
          6.9-inch size App Store Connect requires for iPhone screenshots, where a plain `iPhone`
          landed on a 6.3-inch model whose captures the store takes only as an optional set. An
          unmatched profile fails the job loudly, listing what the image does have; silently
          capturing the wrong form factor under this job's name would be worse.

          `orientation` is `portrait` (default) or `landscape`, applied headlessly through
          `devicectl device orientation set`. It asks nothing of the caller: every macOS job here
          runs on `xcode-27`, whose Xcode installs a `devicectl` that can drive simulators. Which
          `devicectl` a machine has is decided by its XCODE and not by its macOS — Xcode ships the
          CoreDevice framework its wrapper execs, and 26.6 ships a version (518.33) that cannot see
          a simulator at all where 27 ships one (642.15) that turns them.

          `slug` fixes the artifact suffix and the CAPTURE DIRECTORY; it defaults to the
          kebab-cased device name AND the `os` when one is named (`device=iPhone * Pro Max,
          os=iOS 16` → `iphone-pro-max-ios16`). Captures land in `<target>/<slug>/<variant>/`, so
          two devices of one target no longer overwrite each other when the site job merges every
          screenshot artifact into one tree — and the published gallery gives each its own column.
          The OS is in the default because a back-deployment row is usually the SAME device as a
          current row: without it the two would collide on one artifact name and one capture
          directory, and the older captures would overwrite the newer. Name `slug` yourself to
          override, as the rows above do for the primary pair.

          `optional=true` marks a row whose failure does not fail the run — a probe against the
          floor the app declares (`IPHONEOS_DEPLOYMENT_TARGET`, `minSdk`), where the point is to
          learn whether the app still builds and runs down there. It is ignored on a target's
          FIRST row, which packs and feeds the release jobs. Combine it with an older `os` to add
          floor coverage to an existing matrix one line at a time.

          The FIRST profile is the primary one: it packs, uploads the packages and release
          assets, and keeps the plain `screenshots-ios-uikit` artifact name. Later profiles build,
          run the scripts, and upload `screenshots-ios-uikit-<slug>`.

          Supersedes `ios-profiles`, which still works and is unchanged.
        type: string
        required: false
        default: ""
      android-profiles:
        description: >-
          The same for `android-mdc`, as AVD device profiles from `avdmanager list device`
          (`medium_phone`, `medium_tablet`) — passed to the emulator action verbatim, so these are
          exact ids rather than prefixes. `=<slug>` and the first-is-primary rule work as they do
          for ios-profiles. Unset = the default pair, a phone and a tablet (see
          `android-devices`).
        type: string
        required: false
        default: ""
      android-devices:
        description: >-
          Device profiles for `android-mdc`, one per LINE, in the same shape as `ios-devices`:
          `device=…, os=…, orientation=…, density=…, slug=…, optional=…`. Each line becomes its own
          parallel job with its own screenshot artifact and gallery column.

              android-devices: |
                device=medium_phone,  os=36, orientation=portrait,  slug=phone
                device=medium_tablet, os=36, orientation=landscape, slug=tablet
                device=medium_phone,  os=24, optional=true

          `device` is an exact `avdmanager list device` id (`medium_phone`, `pixel_5`), not a
          prefix — unlike iOS, these ids are stable and an unknown one should fail loudly. `os` is
          an API level (`36`, `API 36`, `android-36`) and defaults to 36. `orientation` is
          `portrait` (default) or `landscape`, applied to the DISPLAY by
          `day devices boot --orientation` and verified there.

          What decides these defaults is what the runner HAS: the device catalog comes from the
          Android command-line tools on the image, which is version 12.0 and older than a desktop
          Android Studio — 66 profiles against 96 — so `pixel_8` and later and `small_tablet` are
          simply absent there and avdmanager fails with "No device found". Check a candidate
          against the runner catalog, not a laptop. `medium_phone` and `medium_tablet` are both
          present in 12.0, and being generic they are the pair least likely to age out of it.

          `medium_phone` is 1080x2400 at 420 dpi and `medium_tablet` 2560x1600 at 320. The tablet
          is past the three million pixels at which `day devices boot` halves a headless panel to
          keep the emulator answering, so it captures at 1280x800 — which is also 1280x800 in
          POINTS, the tablet layout Day-Showcase's walkthrough is written against.

          Google Play's tablet slots want at least 1080 px on a screenshot's short side
          (measured against the publishing API, not the help page), and the phone slot takes up
          to about 2.25:1. The halved 1280x800 tablet capture is under that floor, so `day store
          stage` scales it up by the smallest whole factor that clears it (x2, to 2560x1600, the
          panel's own size) before placing it, as the store rules' `upscale = true` for Play's
          tablet kinds allows; the phone capture is placed as it is. A scaled capture is softer
          than a native one. `Nexus 7 2013` at `density=240` captures 1920x1200 whole, but its
          2.3 million pixels behind a desktop-width layout wedged the headless emulator on
          Day-Showcase's Web view page (2026-09-24), so the default pair is the one to keep.

          `density` re-reads a panel at a density of your choosing, which moves the size in
          POINTS without touching the capture's pixels: a way to hand a walkthrough the layout it
          was written against on a profile whose native density would not give it.

          `slug` and `optional` work as they do for `ios-devices`: the API level joins the default
          slug (`device=medium_phone, os=24` → `medium-phone-24`), and `optional=true` lets a row
          at the app's `minSdk` report without failing the run. The two default rows keep their
          literal `phone` and `tablet` slugs, so an app that names no devices publishes exactly
          the artifact names and gallery columns it always has.

          Supersedes `android-profiles`, which stays for callers that already set it.
        type: string
        required: false
        default: ""
      harmony-devices:
        description: >-
          Device profiles for `harmony-arkui`, one per LINE, in the same shape as `ios-devices`:
          `device=…, orientation=…, slug=…, optional=…`. Each line becomes its own parallel job
          with its own emulator, screenshot artifact and gallery column.

              harmony-devices: |
                device=phone,  orientation=portrait,  slug=phone
                device=tablet, orientation=landscape, slug=tablet

          There is one Oniro emulator image, and its screen is whatever size QEMU is told, so a
          `device` here is a PANEL rather than a catalog entry: `phone` (360x720, what every run
          captured on before profiles existed), `tablet` (1280x800, the size the Android tablet
          row captures at, so a walkthrough written against that layout sees the same points), or
          a literal `WxH`. `orientation` turns the panel (`tablet, orientation=portrait` is
          800x1280); the guest has no sensor to turn it any other way. The image identifies
          itself as a phone whatever the panel, so a tablet row tests the app's wide layout, not
          the system's tablet behaviors. `os` is not a field: the image is one OpenHarmony
          release. `slug` and `optional` work as they do for `ios-devices`; the two default rows
          keep their literal `phone` and `tablet` slugs.
        type: string
        required: false
        default: ""
      app-id:
        description: >-
          The app's bundle id. When set, the linux legs verify the packed flatpak actually installs
          and reports that id — a bundle that builds but will not install is worth catching here
          rather than on a user's machine.
        type: string
        required: false
        default: ""
      lint:
        description: Run `day lint` before building (fluent coverage, ids, routes, store listings).
        type: boolean
        required: false
        default: true
      assert-pristine:
        description: >-
          Fail if the checkout has uncommitted changes before packing. An artifact packed from a
          dirty tree records a commit that does not describe it, and `day rebuild` refuses it.
          Automatically skipped when `setup-command` is set, since that generates the project.
        type: boolean
        required: false
        default: true
      signing-environment:
        description: >-
          GitHub environment holding the macOS release-signing secrets (DAY_MACOS_CERT_P12,
          DAY_MACOS_CERT_PASSWORD, DAY_SIGN_MACOS_IDENTITY, DAY_NOTARY_KEY_B64, DAY_NOTARY_KEY_ID,
          DAY_NOTARY_ISSUER). When set, a tag build signs and notarizes the .dmg in a SEPARATE job
          that checks out nothing and runs only Apple's own tools — the Developer ID is never
          present in the job that builds repository code. Empty (default) ships a dev-signed .dmg.
        type: string
        required: false
        default: ""
      validate-rebuild:
        description: >-
          After packing, rebuild each artifact from its own recorded provenance and compare
          (`day rebuild --strict`). Off by default: it costs a second full build per target.
        type: boolean
        required: false
        default: false
      release-assets:
        description: >-
          Whether this call assembles the GitHub release for a semantic-version tag. True (the
          default) is what a repository with one workflow wants. False leaves the release to
          another call — the case a second workflow in the same repository creates, where one
          call owns the release and the other exists to build and publish something else (a
          `store-flavor` submission, say). Two calls both assembling one release race each
          other over its notes.
        type: boolean
        default: true
      publish-release:
        description: >-
          Publish the GitHub release for the tag, or leave it as a draft for a human to review and
          publish. A draft is fully assembled — every package attached, checksums, launch scripts,
          install commands at the top of the notes — it is simply not visible to anyone without
          write access, sends no notifications, and does not answer the
          `releases/latest/download/…` and `releases/download/<tag>/…` URLs the launch scripts and
          the notes point at. Those start working when someone publishes it.
          Never un-publishes: a release that is already public stays public on a re-run.
        type: boolean
        required: false
        default: true
      release-mode:
        description: >-
          What the tag's release becomes once this run has assembled it:

            publish      public, and the release `releases/latest` answers with (today's default)
            pre-release  public and flagged a pre-release, which `releases/latest` skips
            draft        a complete draft, visible only to people with write access

          `pre-release` stages a version: every package, checksum and install command is on the
          release and anyone with the link can install it, while `releases/latest/download/…`,
          the project website's release channel and anything else that reads "the latest
          release" keep describing the previous version. Marking it Latest in the GitHub UI, or
          `gh release edit <tag> --prerelease=false`, fires a `release: released` event; a caller
          that listens for it

              on:
                release:
                  types: [released]

          rebuilds and redeploys the site, and the release channel then describes the new
          version. That run assembles no release and uploads to no store, since the tag build
          already did both.

          A release that is already public and not a pre-release is never demoted by a re-run.
          Empty follows `publish-release`, which this input replaces.
        type: string
        required: false
        default: ""
      deploy-web:
        description: >-
          Publish the web-dom build to the CALLER's GitHub Pages after the build matrix (reusing
          the dist the build job already produced — no second build). Requires `web-dom` in
          `targets`, and the caller to grant `pages: write` + `id-token: write` (see the header).
          Off by default.
        type: boolean
        default: false
      daysite-version:
        description: >-
          Git ref of daybrite/daysite the website job builds with (branch, tag, or SHA). Only
          used when the repository has a website/ directory.
        type: string
        required: false
        default: "main"
      deploy-website:
        description: >-
          Whether this call deploys the project website (daysite) to the caller's GitHub Pages.
          Empty (default) auto-detects: on when the repository has website/site.toml and the ref
          qualifies (see web-deploy-tag-pattern). "false" turns it off for a call that must not
          publish, which every SECOND call of this workflow in one job graph must be: two calls
          that both deploy upload two Pages artifacts into one run, and whichever deploys last
          fails on the duplicate, or publishes a site built from the other call's artifacts.
          "true" forces it regardless of the ref.
        type: string
        required: false
        default: ""
      web-deploy-tag-pattern:
        description: >-
          When deploy-web is set: empty (default) deploys on a push to the repository's default
          branch; a bash regex (e.g. `^v[0-9]+\.[0-9]+\.[0-9]+$`) deploys only on a tag matching
          it. Ignored unless deploy-web is true.
        type: string
        default: ""
      preflight-checks:
        description: >-
          Rust checks the preflight job runs before the matrix starts, comma- or space-separated
          from: fmt, clippy, check, test. The default `fmt` (cargo fmt --all -- --check) takes
          seconds and needs no build; clippy/check/test compile the whole workspace on the
          preflight runner and delay every matrix leg behind them, which is why they are opt-in.
          Empty skips the checks. Any failure fails the run before a single runner builds.
        type: string
        required: false
        default: fmt
      update-day-deps:
        description: >-
          Refresh the day crates in Cargo.lock to the tip of what the app's git dependency tracks,
          instead of building the revision the committed lock pins. Off by default: an app wants
          its lock honoured, which is what makes a build reproducible and what lets the checks
          above pass `--locked`. Turn it on for a repository whose job is to prove the CURRENT
          framework still builds — the reference app — where a lock pinned at whatever revision
          it was generated against would silently stop testing day at all.
          The revision is resolved ONCE, in preflight, and every build and validate leg is moved
          to that exact revision. Resolving per job instead would let a push land mid-run and give
          `validate-rebuild` two different framework revisions to compare, which fails as an
          unreproducible build when nothing is actually wrong.
        type: boolean
        required: false
        default: false
      upload-ios:
        description: >-
          Upload the packed .ipa to App Store Connect on semantic-version tags, via the app's own
          fastlane lane (ios-upload-lane). Empty (default) auto-detects: on when the app has lanes
          for it (a fastlane/Fastfile or platform/ios/fastlane/Fastfile under project-path
          containing `platform :ios`, or a store/storefront.toml listing that `day store stage` turns
          into lanes) and the App Store Connect key secrets DAY_ASC_KEY_ID, DAY_ASC_ISSUER and
          DAY_ASC_KEY_B64 are set. "true"/"false" override the detection.
        type: string
        required: false
        default: ""
      upload-macos:
        description: >-
          Upload the macos-appkit build products to the Mac App Store on semantic-version tags,
          via the app's own fastlane lane (macos-upload-lane). Empty (default) auto-detects: on
          when a fastlane/Fastfile under project-path contains `platform :mac` and the App Store
          Connect key secrets DAY_ASC_KEY_ID, DAY_ASC_ISSUER and DAY_ASC_KEY_B64 are set.
          "true"/"false" override the detection.
        type: string
        required: false
        default: ""
      upload-play:
        description: >-
          Upload the packed .aab to Google Play on semantic-version tags, via the app's own
          fastlane lane (play-upload-lane). Empty (default) auto-detects: on when the app has lanes
          for it (a fastlane/Fastfile or platform/android/fastlane/Fastfile under project-path
          containing `platform :android`, or a store/storefront.toml listing that `day store stage` turns
          into lanes) and the DAY_PLAY_JSON_KEY secret is set. "true"/"false" override the
          detection.
        type: string
        required: false
        default: ""
      ios-upload-lane:
        description: The fastlane arguments the appstore-ios job runs (platform + lane).
        type: string
        required: false
        default: ios upload
      macos-upload-lane:
        description: The fastlane arguments the appstore-macos job runs (platform + lane).
        type: string
        required: false
        default: mac upload
      play-upload-lane:
        description: The fastlane arguments the playstore-android job runs (platform + lane).
        type: string
        required: false
        default: android upload
      store-screenshots:
        description: >-
          Replace the App Store and Google Play listings' screenshots on each upload with the
          captures store/storefront.toml `[storefront…screenshots]` declares per store and device kind (naming the
          walkthrough's `screenshot:` steps), taken from this run's own screenshot
          artifacts (the `screenshots-<target>` bundle the build leg uploaded, so the set is the
          tagged version's). The upload checks the set against each store's rules (Apple's exact
          sizes per device; Play's 1080-7680 px range with the long side at most 2.3× the short,
          as its API enforces; the ceiling per locale; a capture in every locale on every
          required device) and fails on any refusal before it signs anything. The default
          `medium_tablet` captures 1280x800, under Play's 1080 px floor, and `day store stage`
          scales that capture up x2 before placing it, as the store rules allow for Play's tablet
          kinds. Needs the lanes `day store stage` writes; an app with its own Fastfile places
          its own screenshots. Off by default, which leaves what each store already shows.
        type: boolean
        required: false
        default: false
    # Optional release-signing secrets — the same names daybrite/day's ci.yml uses. All optional:
    # absent secrets degrade pack to the dev tier. Forward them all with `secrets: inherit`.
    secrets:
      # The Developer ID used to sign and notarize the macOS .dmg, consumed ONLY by `sign-macos`.
      # Distinct from DAY_APPLE_CERT_P12 below, which is the distribution certificate the iOS
      # build uses during pack.
      DAY_MACOS_CERT_P12: { required: false }
      DAY_MACOS_CERT_PASSWORD: { required: false }
      DAY_SIGN_MACOS_IDENTITY: { required: false }
      DAY_NOTARY_KEY_ID: { required: false }
      DAY_NOTARY_ISSUER: { required: false }
      DAY_NOTARY_KEY_B64: { required: false }
      DAY_APPLE_TEAM: { required: false }
      DAY_ASC_KEY_ID: { required: false }
      DAY_ASC_ISSUER: { required: false }
      DAY_ASC_KEY_B64: { required: false }
      DAY_APPLE_CERT_P12: { required: false }
      DAY_APPLE_CERT_PASSWORD: { required: false }
      # The App Store provisioning profile for the app id, base64. `day pack` exports over an
      # installed profile with the certificate above (an API key cannot use Xcode's
      # cloud-managed signing, so an automatic export has nothing to sign with).
      DAY_IOS_PROFILE_B64: { required: false }
      DAY_ANDROID_KEYSTORE_B64: { required: false }
      DAY_ANDROID_KEY_ALIAS: { required: false }
      # The Google Play service-account JSON (its contents, not base64), which the
      # playstore-android job hands to the lane as SUPPLY_JSON_KEY.
      DAY_PLAY_JSON_KEY: { required: false }
      DAY_KS_PASS: { required: false }
      DAY_KEY_PASS: { required: false }
      DAY_OHOS_KEYSTORE_B64: { required: false }
      DAY_OHOS_CERT_B64: { required: false }
      DAY_OHOS_PROFILE_B64: { required: false }
      DAY_OHOS_KEY_ALIAS: { required: false }
      DAY_OHOS_KS_PASS: { required: false }
      DAY_OHOS_KEY_PASS: { required: false }

defaults:
  run:
    shell: bash

env:
  # fastlane reports usage to its own servers unless told not to. Set for every job, so an app's
  # own Fastfile is covered as well as the ones `day store stage` generates.
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  # The gate every other job waits on: run the cheap Rust first-pass checks, turn the `targets`
  # input into a build matrix (target → runner, doctor toolkit, extra rust std targets), decide
  # whether this run is a semantic-version release, and decide which store uploads it ends with.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      # Every macOS job in this workflow runs here, defined ONCE so the floor moves deliberately.
      #
      # `xcode-27` is a FLOOR, not a preference. Turning a simulator headlessly needs a `devicectl`
      # that can see simulators, and that comes from the CoreDevice framework XCODE installs, not
      # from macOS: Xcode 26.6 ships CoreDevice 518.33, which cannot see a simulator at all, and
      # Xcode 27 ships 642.15, which drives them. Every default GitHub macOS image stops at 26.6,
      # so on those a device profile asking for `landscape` captured portrait and said nothing.
      macos_runner: ${{ steps.plan.outputs.macos_runner }}
      # The BUILD matrix: one row per target, times each mobile target's device profiles.
      matrix: ${{ steps.plan.outputs.matrix }}
      # The same rows before that expansion — one per target, the shape every job that consumes a
      # PACKAGE wants, since only the primary profile row of a target packs one.
      pack-matrix: ${{ steps.plan.outputs.pack_matrix }}
      release: ${{ steps.plan.outputs.release }}
      # What the release job makes of the release: publish, pre-release or draft.
      release_mode: ${{ steps.plan.outputs.release_mode }}
      # True when a `release: released` event started this run, which rebuilds the site and
      # nothing else: the tag's build assembled the release and uploaded to the stores already.
      promotion: ${{ steps.plan.outputs.promotion }}
      # The plan's Pages decisions, after the check that github-pages admits a tag.
      deploy_web: ${{ steps.pages.outputs.deploy_web }}
      website: ${{ steps.pages.outputs.website }}
      # The day revision every leg builds against, under inputs.update-day-deps. Empty when the
      # input is off, which is the signal each leg reads to leave the committed lock alone.
      day-rev: ${{ steps.day-dep.outputs.rev }}
    steps:
      # A full checkout, not the old website/site.toml sparse one: the first-pass checks read the
      # whole workspace and the store-upload detection greps the repo's Fastfiles.
      - uses: actions/checkout@v7

      # Rust first-pass checks (inputs.preflight-checks). The entire matrix waits on this job, so
      # a formatting slip or a clippy lint fails the run in one ubuntu job instead of N runners
      # deep into their builds — that is the point of a preflight. Skipped for setup-command
      # callers: their project is generated later, so there is no source here to check.
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.setup-command == '' && (inputs.preflight-checks != '' || inputs.update-day-deps)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: inputs.setup-command == '' && inputs.preflight-checks != ''
        with:
          workspaces: ${{ inputs.project-path }}

      # A lock this checkout can actually resolve, before anything that depends on one.
      #
      # `--locked` below refuses to CREATE a lock, so a repository that commits none fails there.
      # A committed lock can be just as unusable: `day patch --local` points the day dependencies
      # at a checkout on the developer's machine, and cargo then REWRITES Cargo.lock to record
      # those paths. Commit that and the lock describes a machine nobody else has — every day
      # crate loses its `source`, so there is no `day` package from git to update and no revision
      # to read back. Both dead ends have the same cure, so neither is worth distinguishing:
      # `cargo metadata --locked` is precisely the question "does this lock describe this
      # checkout, without changing it?", and a no means throw it away and resolve from the
      # manifest. A healthy lock is left exactly as committed, which is what keeps `--locked`
      # meaningful for the repositories that do pin.
      - name: Prepare Cargo.lock
        if: inputs.setup-command == '' && (inputs.preflight-checks != '' || inputs.update-day-deps)
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          if cargo metadata --locked --format-version 1 >/dev/null 2>&1; then
            echo "Cargo.lock resolves this checkout as committed"
          else
            echo "::notice::Cargo.lock is missing or does not describe this checkout — resolving a fresh one"
            rm -f Cargo.lock
            cargo generate-lockfile
          fi

      # Track the branch instead of the lock (inputs.update-day-deps). Must come BEFORE the checks
      # below: they pass `--locked`, which fails outright on a lock that needs updating.
      #
      # Every day crate comes from one git source with no revision pinned in Cargo.toml, so they
      # share a single locked revision and `-p day` moves all of them together.
      - name: Resolve the day revision to track
        id: day-dep
        if: inputs.setup-command == '' && inputs.update-day-deps
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          cargo update -p day
          # Read the revision back out of the lock rather than asking git for the branch tip: the
          # lock is what the build actually uses, and it is the app's own Cargo.toml that decides
          # which repository and branch that is — this workflow does not get to assume.
          REV=$(python3 - <<'PY'
          import re, pathlib, sys
          for blk in pathlib.Path("Cargo.lock").read_text().split("[[package]]"):
              if re.search(r'^name = "day"$', blk, re.M):
                  m = re.search(r'^source = "git\+[^"]*#(\w+)"', blk, re.M)
                  if m:
                      print(m.group(1)); sys.exit(0)
          sys.exit("no git-sourced `day` package in Cargo.lock — is this a Day app tracking day by git?")
          PY
          )
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "tracking day at $REV" >> "$GITHUB_STEP_SUMMARY"

      - name: First-pass checks
        if: inputs.setup-command == '' && inputs.preflight-checks != ''
        working-directory: ${{ inputs.project-path }}
        env:
          CHECKS_IN: ${{ inputs.preflight-checks }}
        run: |
          set -euo pipefail
          for c in ${CHECKS_IN//,/ }; do
            case "$c" in
              fmt)    cargo fmt --all -- --check ;;
              clippy) cargo clippy --workspace --all-targets --locked -- -D warnings ;;
              check)  cargo check --workspace --locked ;;
              test)   cargo test --workspace --locked ;;
              *) echo "::error::unknown check '$c' in inputs.preflight-checks — supported: fmt clippy check test"; exit 1 ;;
            esac
          done

      - name: Plan the matrix
        id: plan
        env:
          TARGETS_IN: ${{ inputs.targets }}
          TARGET_SCRIPTS_IN: ${{ inputs.target-scripts }}
          ANDROID_ABIS_IN: ${{ inputs.android-abis }}
          IOS_PROFILES_IN: ${{ inputs.ios-profiles }}
          IOS_DEVICES_IN: ${{ inputs.ios-devices }}
          ANDROID_PROFILES_IN: ${{ inputs.android-profiles }}
          ANDROID_DEVICES_IN: ${{ inputs.android-devices }}
          HARMONY_DEVICES_IN: ${{ inputs.harmony-devices }}
          TARGET_PACKAGES_IN: ${{ inputs.target-packages }}
          TARGET_SETUP_IN: ${{ inputs.target-setup }}
          FLAVORS_IN: ${{ inputs.flavors }}
          RELEASE_MODE_IN: ${{ inputs.release-mode }}
          STORE_SCREENSHOTS_IN: ${{ inputs.store-screenshots }}
          PUBLISH_RELEASE_IN: ${{ inputs.publish-release }}
          DEPLOY_WEB_IN: ${{ inputs.deploy-web }}
          DEPLOY_WEBSITE_IN: ${{ inputs.deploy-website }}
          WEB_PATTERN: ${{ inputs.web-deploy-tag-pattern }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          # THE macOS runner floor — see the `macos_runner` output above for why it is xcode-27.
          # Defined here and echoed out, so the matrix rows below and the standalone macOS jobs
          # (signing, the two store uploads) can never drift apart.
          MACOS_RUNNER=xcode-27
          echo "macos_runner=$MACOS_RUNNER" >> "$GITHUB_OUTPUT"
          # Map the requested Android ABIs (inputs.android-abis) to their rustup targets, so the
          # android-mdc leg installs exactly what `day pack` cross-compiles into the package.
          # x86_64-linux-android is always kept on top for the x86_64 emulator screenshot leg,
          # regardless of which ABIs ship in the package.
          ABIS="${ANDROID_ABIS_IN:-arm64-v8a x86_64}"
          android_rust="x86_64-linux-android"
          for one in ${ABIS//,/ }; do
            case "$one" in
              arm64-v8a)   rt=aarch64-linux-android ;;
              armeabi-v7a) rt=armv7-linux-androideabi ;;
              x86)         rt=i686-linux-android ;;
              x86_64)      rt=x86_64-linux-android ;;
              *) echo "::error::unknown android ABI '$one' in inputs.android-abis — supported: arm64-v8a armeabi-v7a x86 x86_64"; exit 1 ;;
            esac
            case ",$android_rust," in *",$rt,"*) ;; *) android_rust="$android_rust,$rt" ;; esac
          done
          rows=()
          for t in ${TARGETS_IN//,/ }; do
            # tier=extra marks the portable non-primary combos (GTK/Qt off their home OS):
            # their pack + script steps are best-effort, mirroring their walkthrough-coverage
            # role in daybrite/day's own CI.
            case "$t" in
              macos-appkit)   row='{"target":"macos-appkit","os":"'"$MACOS_RUNNER"'","toolkit":"appkit","rust_targets":"","tier":"primary"}' ;;
              macos-gtk)      row='{"target":"macos-gtk","os":"'"$MACOS_RUNNER"'","toolkit":"gtk","rust_targets":"","tier":"extra"}' ;;
              macos-qt)       row='{"target":"macos-qt","os":"'"$MACOS_RUNNER"'","toolkit":"qt","rust_targets":"","tier":"extra"}' ;;
              ios-uikit)      row='{"target":"ios-uikit","os":"'"$MACOS_RUNNER"'","toolkit":"uikit","rust_targets":"aarch64-apple-ios-sim,aarch64-apple-ios","tier":"primary"}' ;;
              linux-gtk)      row='{"target":"linux-gtk","os":"ubuntu-latest","toolkit":"gtk","rust_targets":"","tier":"primary"}' ;;
              linux-qt)       row='{"target":"linux-qt","os":"ubuntu-latest","toolkit":"qt","rust_targets":"","tier":"primary"}' ;;
              android-mdc) row="{\"target\":\"android-mdc\",\"os\":\"ubuntu-latest\",\"toolkit\":\"android\",\"rust_targets\":\"$android_rust\",\"tier\":\"primary\"}" ;;
              harmony-arkui)     row='{"target":"harmony-arkui","os":"ubuntu-latest","toolkit":"harmonyos","rust_targets":"aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos","tier":"primary"}' ;;
              windows-xaml)  row='{"target":"windows-xaml","os":"windows-latest","toolkit":"xaml","rust_targets":"","tier":"primary"}' ;;
              web-dom)        row='{"target":"web-dom","os":"ubuntu-latest","toolkit":"dom","rust_targets":"wasm32-unknown-unknown","tier":"primary"}' ;;
              windows-qt)     row='{"target":"windows-qt","os":"windows-latest","toolkit":"qt","rust_targets":"","tier":"extra"}' ;;
              windows-gtk)    row='{"target":"windows-gtk","os":"windows-latest","toolkit":"gtk","rust_targets":"","tier":"extra"}' ;;
              *)
                echo "::error::unknown target '$t' — supported: macos-appkit macos-gtk macos-qt ios-uikit linux-gtk linux-qt android-mdc harmony-arkui windows-xaml windows-qt windows-gtk web-dom"
                exit 1 ;;
            esac
            rows+=("$row")
          done
          [ ${#rows[@]} -gt 0 ] || { echo "::error::inputs.targets is empty"; exit 1; }
          matrix="{\"include\":[$(IFS=,; echo "${rows[*]}")]}"
          # One row per target: what a PACKAGE consumer wants, since only a target's primary
          # profile row packs one. The build matrix below may carry several rows per target.
          echo "pack_matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

          # Device profiles (inputs.ios-profiles / android-profiles) fan a mobile target out into
          # one row — one parallel job — per profile. jq builds them rather than bash: a device
          # name carries spaces and parentheses ("iPad Pro 13-inch (M4)"), and hand-quoting those
          # into JSON is how a matrix ends up silently malformed.
          IOS_P="${IOS_PROFILES_IN:-}"
          ANDROID_P="${ANDROID_PROFILES_IN:-}"
          IOS_D="${IOS_DEVICES_IN:-}"
          ANDROID_D="${ANDROID_DEVICES_IN:-}"
          HARMONY_D="${HARMONY_DEVICES_IN:-}"
          case "$IOS_P$ANDROID_P$IOS_D$ANDROID_D$HARMONY_D" in
            *'"'*) echo "::error::a device profile may not contain a double quote"; exit 1 ;;
          esac
          # The `-devices` inputs supersede the `-profiles` ones; naming both is a mistake worth
          # stopping on rather than silently preferring one.
          if [ -n "$(echo "$IOS_P" | tr -d '[:space:]')" ] && [ -n "$(echo "$IOS_D" | tr -d '[:space:]')" ]; then
            echo "::error::set either ios-profiles or ios-devices, not both (ios-devices supersedes it)"
            exit 1
          fi
          if [ -n "$(echo "$ANDROID_P" | tr -d '[:space:]')" ] && [ -n "$(echo "$ANDROID_D" | tr -d '[:space:]')" ]; then
            echo "::error::set either android-profiles or android-devices, not both (android-devices supersedes it)"
            exit 1
          fi
          # A store upload of this run's captures takes the default Android pair: the halved
          # `medium_tablet` capture (1280x800) is under Google Play's 1080 px floor, and `day
          # store stage` scales it up to clear it, as the store rules allow for Play's tablet
          # kinds. Said here so a run that turns the input on knows what it will send.
          if [ "${STORE_SCREENSHOTS_IN:-false}" = true ] && [ -z "$(echo "$ANDROID_D$ANDROID_P" | tr -d '[:space:]')" ] \
             && printf '%s' "${TARGETS_IN:-}" | tr ', ' '\n\n' | grep -qx android-mdc; then
            echo "::notice::store-screenshots is on with the default Android profiles: the tablet capture (1280x800) is scaled up x2 for Google Play's tablet slots; name android-devices for a profile captured at a store size"
          fi
          # Per-target additions (inputs.target-packages / target-setup), one `<targets>: <value>`
          # entry per line. jq folds them into each row below; this only refuses a line it cannot
          # read and a name that is not a target, so a typo fails here instead of quietly
          # installing nothing. A real target this call does not build is only noted, which lets
          # one list serve calls with different target sets.
          SUPPORTED="macos-appkit macos-gtk macos-qt ios-uikit linux-gtk linux-qt android-mdc harmony-arkui windows-xaml windows-qt windows-gtk web-dom"
          check_per_target() {
            local input="$1" line names name
            while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              case "$line" in "" | \#*) continue ;; esac
              case "$line" in
                *:*) ;;
                *) echo "::error::$input: expected '<targets>: …' but found '$line'"; exit 1 ;;
              esac
              names="${line%%:*}"
              # shellcheck disable=SC2086 # a deliberately word-split target list
              for name in ${names//,/ }; do
                case " $SUPPORTED " in
                  *" $name "*) ;;
                  *) echo "::error::$input names '$name', which is not a target — supported: $SUPPORTED"; exit 1 ;;
                esac
                case " ${TARGETS_IN//,/ } " in
                  *" $name "*) ;;
                  *) echo "::notice::$input names $name, which this call does not build" ;;
                esac
              done
            done <<< "$2"
          }
          check_per_target target-packages "${TARGET_PACKAGES_IN:-}"
          check_per_target target-setup "${TARGET_SETUP_IN:-}"
          matrix=$(printf '%s' "$matrix" | jq -c \
            --arg ios "$IOS_P" --arg android "$ANDROID_P" --arg iosdev "$IOS_D" \
            --arg androiddev "$ANDROID_D" --arg harmonydev "$HARMONY_D" \
            --arg packages "${TARGET_PACKAGES_IN:-}" \
            --arg setup "${TARGET_SETUP_IN:-}" --arg tscripts "${TARGET_SCRIPTS_IN:-}" '
            def slugify: ascii_downcase | gsub("[^a-z0-9]+"; "-")
                         | sub("^-+"; "") | sub("-+$"; "");
            def trim: sub("^\\s+"; "") | sub("\\s+$"; "");
            # `target-packages` / `target-setup`: the values of every line naming target $t, in
            # line order. The line was checked above, so it has a colon; only the FIRST splits,
            # since a command may carry more. Lines starting with a hash are comments.
            def per_target($s; $t):
              $s | split("\n") | map(trim) | map(select(length > 0 and (startswith("#") | not)))
                 | map(index(":") as $at
                       | {targets: (.[0:$at] | split(",") | map(trim)),
                          value: (.[$at + 1:] | trim)})
                 | map(select(any(.targets[]; . == $t)) | .value);
            # "iPhone 16, iPad Pro 13-inch (M4)=ipad" → [{device,slug}], slug defaulting to the
            # kebab-cased device name.
            def profiles($s):
              $s | split(",") | map(trim) | map(select(length > 0))
                 | map(split("=") | if length > 1
                       then {device: (.[0] | trim), slug: (.[1] | trim | slugify)}
                       else {device: .[0], slug: (.[0] | slugify)} end);
            # `ios-devices`: one profile per LINE, each `key=value` fields separated by commas.
            # The comma is the field separator INSIDE a profile, which is exactly why profiles
            # are separated by newlines rather than by commas as the older input does.
            def fields($line):
              $line | split(",") | map(trim) | map(select(length > 0))
                    | map(split("=") | {key: (.[0] | trim | ascii_downcase),
                                        value: (.[1:] | join("=") | trim)})
                    | from_entries;
            # The `os` reduced to a naming part: lowercased, non-alphanumerics dropped. `iOS 16`
            # becomes `ios16` and `24` stays `24`, so a slug says which OS produced the captures.
            def osname: ascii_downcase | gsub("[^a-z0-9]+"; "");
            def devices($s):
              $s | split("\n") | map(trim) | map(select(length > 0))
                 | map(fields(.))
                 | map(select(.device != null and .device != ""))
                 | map({device: .device,
                        os: (.os // ""),
                        orientation: (.orientation // "portrait"),
                        density: (.density // ""),
                        # An explicit `slug` still wins. Otherwise the OS joins the device in the
                        # default, because a floor row and a current row are usually the SAME
                        # device and would collide on one artifact name and one capture directory
                        # — `medium_phone` twice, with the API 24 captures overwriting API 36.
                        slug: ((.slug // (if ((.os // "") | test("[^ ]")) 
                                          then (.device + "-" + (.os | osname))
                                          else .device end)) | slugify),
                        # `optional=true` marks a row whose failure must not fail the run: a
                        # back-deployment probe against the floor an app declares, where the point
                        # is to learn where it stands. Ignored on the first row of a target, which
                        # packs and feeds the release jobs (see `primary` below) — a release that
                        # silently skipped its build is not a result anyone wants.
                        optional: ((.optional // "") | ascii_downcase | . == "true" or . == "yes" or . == "1")});
            # What a mobile target runs on when the caller named nothing: a phone AND a tablet,
            # because those are the two device classes a store listing asks for and the two an
            # adaptive UI has to be looked at on. The iOS pair is sized for App Store Connect;
            # the Android pair is the generic one the runner catalog is likeliest to keep, and
            # its tablet capture is BELOW what Google Play takes (the Device profiles section of
            # the README says which sizes each store takes, and `android-devices` above names the
            # store-sized alternative). Naming `ios-devices` or `android-devices` replaces the
            # whole list, which is how an app runs on one device or on five.
            #
            # No apostrophes in this program: it reaches jq inside a single-quoted shell string,
            # and one would end the string and hand jq nothing (`Top-level program not given`).
            def fallback($t):
              if $t == "ios-uikit" then
                [{device: "iPhone * Pro Max", os: "", orientation: "portrait",  density: "",
                  slug: "iphone", optional: false},
                 {device: "iPad Pro 13-inch", os: "", orientation: "landscape", density: "",
                  slug: "ipad", optional: false}]
              elif $t == "android-mdc" then
                # These slugs stay literal (`phone`, not `phone-36`): they are the artifact names
                # and gallery columns every app that names no devices already publishes under.
                [{device: "medium_phone",  os: "36", orientation: "portrait",  density: "",
                  slug: "phone", optional: false},
                 {device: "medium_tablet", os: "36", orientation: "landscape", density: "",
                  slug: "tablet", optional: false}]
              elif $t == "harmony-arkui" then
                # One Oniro image on two panels (`harmony-devices` above): the phone every run
                # captured on before, and a landscape tablet the size of the Android one.
                [{device: "phone",  os: "", orientation: "portrait",  density: "",
                  slug: "phone", optional: false},
                 {device: "tablet", os: "", orientation: "landscape", density: "",
                  slug: "tablet", optional: false}]
              else [] end;
            { include: [
                .include[] as $r
                | (if $r.target == "ios-uikit" then
                     (if ($iosdev | ascii_downcase | test("[a-z]")) then devices($iosdev)
                      else profiles($ios) end)
                   elif $r.target == "android-mdc" then
                     # API level down to digits: a caller may write 36, API 36 or android-36, and
                     # the level reaches a CACHE PATH as well as the CLI. The CLI reads all three,
                     # but `system-images/android-API 36` caches nothing.
                     (if ($androiddev | ascii_downcase | test("[a-z]")) then
                        (devices($androiddev) | map(.os |= gsub("[^0-9]"; "")))
                      else profiles($android) end)
                   elif $r.target == "harmony-arkui" then
                     (if ($harmonydev | ascii_downcase | test("[a-z]")) then devices($harmonydev)
                      else [] end)
                   else [] end) as $named
                | (if ($named | length) > 0 then $named
                   elif (fallback($r.target) | length) > 0 then fallback($r.target)
                   # Everything that is not a mobile target: one job, no device level.
                   else [{device: "", slug: ""}] end) as $ps
                | range(0; $ps | length) as $i
                | $r + {
                    profile: $ps[$i].device,
                    # `ios-devices` extras; empty for a legacy `ios-profiles` row, which the
                    # boot step reads as "any OS, portrait".
                    device_os: ($ps[$i].os // ""),
                    device_orientation: ($ps[$i].orientation // ""),
                    # Android only: the panel density `day devices setup --density` applies.
                    device_density: ($ps[$i].density // ""),
                    # The capture-tree level, `<target>/<slug>/<variant>/`. Empty for a target
                    # running on ONE device, which keeps its captures where a single-device
                    # gallery expects them.
                    device_slug: (if ($ps | length) > 1 then $ps[$i].slug else "" end),
                    # Only the first row of a target packs, uploads packages, and feeds the
                    # release/signing/store jobs. The rest exist for their screenshots.
                    primary: ($i == 0),
                    # Never on the packing row, whatever the caller wrote.
                    optional: (($ps[$i].optional // false) and ($i != 0)),
                    # The job name stays the bare target for a target running on one device, so
                    # required status checks configured against it keep matching. Two jobs cannot
                    # share a name, so a phone-and-tablet target names each after its device.
                    # The OS rides the job name too when the caller named one, so two rows on the
                    # same device are told apart in the checks list as well as in the artifacts.
                    label: (if ($named | length) == 0 and ($ps | length) == 1 then $r.target
                            elif (($ps[$i].os // "") | test("[^ ]"))
                              then "\($r.target) · \($ps[$i].device) · \($ps[$i].os)"
                            else "\($r.target) · \($ps[$i].device)" end),
                    # First profile keeps the plain name every existing consumer reads.
                    shots_artifact: (if $i == 0 then "screenshots-\($r.target)"
                                     else "screenshots-\($r.target)-\($ps[$i].slug)" end),
                    # What the caller added for this target, on every one of its rows.
                    packages: (per_target($packages; $r.target) | join(" ")),
                    setup: (per_target($setup; $r.target) | join("\n")),
                    # The dayscript list for this target, when `target-scripts` names it. Empty
                    # means "no rule for this target", which the leg reads as `scripts`.
                    scripts: (per_target($tscripts; $r.target) | join(" ")),
                  }
              ] }')
          # Build flavors (inputs.flavors): one more leg per row per flavor, the base app always
          # among them. A flavor is a Day-<name>.toml layered over Day.toml, and the leg carries
          # it in DAY_FLAVOR rather than in a flag, so every day command the leg runs — build,
          # the scripted launches, pack — builds the same app without a flag per step.
          FLAVORS="${FLAVORS_IN:-}"
          for f in ${FLAVORS//,/ }; do
            case "$f" in
              *[!A-Za-z0-9_-]*) echo "::error::flavor '$f' — a flavor name takes letters, digits, '-' and '_'"; exit 1 ;;
            esac
            # The manifest has to exist here, or the failure would be N identical build-job
            # failures for one typo, each after a toolchain install.
            file="${PROJECT_PATH:-.}/Day-$f.toml"
            [ -f "$file" ] || { echo "::error::inputs.flavors names '$f', but $file does not exist"; exit 1; }
          done
          # A flavor may ship on fewer targets than the app (`targets` in its own [app] table), so
          # read each one's list here and give it legs only for the targets it declares. Building
          # the others would fail in the leg, on a manifest that never claimed them.
          flavor_targets=$(FLAVORS="$FLAVORS" PROJECT_PATH="${PROJECT_PATH:-.}" python3 - <<'PYEOF'
          import json, os, pathlib, tomllib
          root = pathlib.Path(os.environ["PROJECT_PATH"])
          out = {}
          for name in os.environ.get("FLAVORS", "").replace(",", " ").split():
              data = tomllib.loads((root / f"Day-{name}.toml").read_text())
              targets = data.get("app", {}).get("targets")
              out[name] = targets if isinstance(targets, list) else None
          print(json.dumps(out))
          PYEOF
          )
          matrix=$(printf '%s' "$matrix" | jq -c --arg flavors "$FLAVORS" --argjson ftargets "$flavor_targets" '
            def trim: sub("^\\s+"; "") | sub("\\s+$"; "");
            ([""] + ($flavors | gsub(","; " ") | split(" ") | map(trim)
                     | map(select(length > 0)))) as $fs
            | { include: [
                  .include[] as $r
                  | $fs[] as $f
                  # The base app builds every target the caller named; a flavor builds the ones
                  # it declares, and all of them when it declares none.
                  | select($f == "" or ($ftargets[$f] == null)
                           or (($ftargets[$f] | index($r.target)) != null))
                  | $r + {
                      flavor: $f,
                      # Artifact names and job names stay exactly what they were for the base
                      # app, so existing status checks and artifact consumers see no change.
                      label: (if $f == "" then $r.label else "\($r.label) · \($f)" end),
                      shots_artifact: (if $f == "" then $r.shots_artifact
                                       else "flavor-\($f)-\($r.shots_artifact)" end),
                      # Not `dist-…` for a flavor: the release job attaches every `dist-*`
                      # artifact, and a flavor build is not part of the base app release.
                      dist_artifact: (if $f == "" then "dist-\($r.target)"
                                      else "flavor-\($f)-dist-\($r.target)" end),
                    }
                ] }')
          for f in ${FLAVORS//,/ }; do
            n=$(printf '%s' "$matrix" | jq --arg f "$f" '[.include[] | select(.flavor == $f)] | length')
            [ "$n" -gt 0 ] || echo "::warning::flavor '$f' declares no target that inputs.targets builds, so it has no legs in this run"
          done
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"
          rel=false
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            rel=true
          fi
          echo "release=$rel" | tee -a "$GITHUB_OUTPUT"

          # What the release becomes (inputs.release-mode), with the older boolean as the default.
          case "${RELEASE_MODE_IN// /}" in
            "") [ "$PUBLISH_RELEASE_IN" = true ] && mode=publish || mode=draft ;;
            publish|pre-release|draft) mode="${RELEASE_MODE_IN// /}" ;;
            *) echo "::error::release-mode: publish, pre-release or draft — got '$RELEASE_MODE_IN'"; exit 1 ;;
          esac
          echo "release_mode=$mode" | tee -a "$GITHUB_OUTPUT"

          # A `release: released` event: the maintainer marked a staged release Latest. The tag's
          # own build already attached the packages and ran the store lanes, so this run exists to
          # rebuild the site against the release that is now the latest one.
          promotion=false
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            promotion=true
            [ "$mode" = pre-release ] || echo "::warning::a release event arrived while release-mode is '$mode'; the trigger belongs with release-mode: pre-release, and this run rebuilds the site for nothing else"
          fi
          echo "promotion=$promotion" | tee -a "$GITHUB_OUTPUT"

          # Web-dom → GitHub Pages deploy gate (inputs.deploy-web + web-deploy-tag-pattern). The
          # pages job reuses the dist-web-dom artifact, so web-dom must be a target.
          deploy_web=false
          if [ "$DEPLOY_WEB_IN" = true ]; then
            case " ${TARGETS_IN//,/ } " in
              *" web-dom "*) ;;
              *) echo "::error::deploy-web is set but 'web-dom' is not in inputs.targets — add it to publish the web build"; exit 1 ;;
            esac
            if [ -n "${WEB_PATTERN// /}" ]; then
              # $WEB_PATTERN is unquoted on purpose — quoting it makes `=~` a literal, not a regex.
              if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" =~ $WEB_PATTERN ]]; then
                deploy_web=true
              fi
            elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              deploy_web=true
            fi
            [ "$deploy_web" = true ] \
              || echo "::notice::deploy-web is set but ref '$GITHUB_REF_NAME' ($GITHUB_REF_TYPE) does not qualify (web-deploy-tag-pattern='${WEB_PATTERN}', default branch='${DEFAULT_BRANCH}') — skipping the Pages deploy."
          fi
          echo "deploy_web=$deploy_web" | tee -a "$GITHUB_OUTPUT"

          # Website gate: a website/site.toml in the repo is the opt-in (no separate input), and
          # the ref rule is deploy-web's — default branch, or web-deploy-tag-pattern when set —
          # PLUS every release tag. When it fires, the website job deploys the full daysite (with
          # the web-dom build under its webapp/ subdirectory) and the root-deploy pages job
          # stands down.
          #
          # The tag is there because the site publishes two build channels (daysite's
          # src/lib/channels.ts): the release channel is assembled from the newest release's own
          # assets, so its content changes the moment a release is published. Without this, a
          # freshly tagged version reached the site only on the next unrelated push to the
          # default branch, and until then the release pages described the previous one.
          #
          # An explicit deploy-website input outranks all of that. "false" is for a second call
          # of this workflow in the same job graph (Day-Trader's demo-data call): with the
          # site.toml rule alone, both calls deployed, both uploaded a Pages artifact named for
          # the same run attempt, and whichever deployed second failed on the duplicate — after
          # the first had published a site assembled from the wrong call's artifacts.
          website=false
          case "$DEPLOY_WEBSITE_IN" in
            true) website=true ;;
            false) echo "::notice::deploy-website: false — this call does not deploy the website." ;;
            "")
              if [ -f "${PROJECT_PATH:-.}/website/site.toml" ]; then
                if [ -n "${WEB_PATTERN// /}" ]; then
                  if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" =~ $WEB_PATTERN ]]; then
                    website=true
                  fi
                elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || [ "$rel" = true ]; then
                  website=true
                fi
                [ "$website" = true ] \
                  || echo "::notice::website/site.toml present but ref '$GITHUB_REF_NAME' does not qualify — skipping the website deploy."
              fi
              ;;
            *) echo "::error::deploy-website: accepts '' (auto), 'true', or 'false' — got '$DEPLOY_WEBSITE_IN'"; exit 1 ;;
          esac
          echo "website=$website" | tee -a "$GITHUB_OUTPUT"

      # A tag reaches the github-pages environment only when that environment's deployment rules
      # admit it. Turning Pages on creates the environment admitting the Pages branch alone, so a
      # release tag's site deploy used to fail before its first step, and failed the run with it
      # (Day-Games v0.1.2). This reads the rules the way GitHub applies them and stands both Pages
      # jobs down with a warning when the tag would be refused. When the rules cannot be read, the
      # deploys stay on and GitHub gives its verdict as the job starts, as before.
      - name: Check that github-pages admits this tag
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_WEB: ${{ steps.plan.outputs.deploy_web }}
          WEBSITE: ${{ steps.plan.outputs.website }}
          PROMOTION: ${{ steps.plan.outputs.promotion }}
        run: |
          set -euo pipefail
          admitted=true
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ "$DEPLOY_WEB" = true ] || [ "$WEBSITE" = true ]; }; then
            ENV_API="repos/$GITHUB_REPOSITORY/environments/github-pages"
            ERR="$RUNNER_TEMP/github-pages-rules.err"
            if ! env_json="$(gh api "$ENV_API" 2>"$ERR")"; then
              if grep -q "HTTP 404" "$ERR"; then
                echo "::notice::github-pages does not exist yet, so tag '$GITHUB_REF_NAME' can deploy; the deploy job creates the environment"
              else
                echo "::notice::could not read the github-pages rules ($(head -1 "$ERR")), so the site deploy runs and GitHub decides whether tag '$GITHUB_REF_NAME' may deploy"
              fi
            elif [ "$(jq -c '.deployment_branch_policy' <<<"$env_json")" = null ]; then
              echo "::notice::github-pages admits every branch and tag, so tag '$GITHUB_REF_NAME' can deploy"
            elif [ "$(jq -r '.deployment_branch_policy.protected_branches' <<<"$env_json")" = true ]; then
              admitted=false
              echo "::warning::github-pages admits protected branches only, so tag '$GITHUB_REF_NAME' cannot deploy the site and the site deploy is skipped. To publish on tags, set Settings > Environments > github-pages > Deployment branches and tags to 'Selected branches and tags' and add a tag rule such as v*"
            elif ! rules="$(gh api --paginate "$ENV_API/deployment-branch-policies?per_page=100" \
                --jq '.branch_policies[] | select(.type == "tag") | .name' 2>"$ERR")"; then
              echo "::notice::could not read the github-pages deployment rules ($(head -1 "$ERR")), so the site deploy runs and GitHub decides whether tag '$GITHUB_REF_NAME' may deploy"
            else
              # GitHub matches a rule with Ruby's File.fnmatch, where a wildcard never matches `/`.
              matched="$(RULES="$rules" python3 -c '
          import os, re, sys

          def regex(glob):
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**", i):
                      out, i = out + ".*", i + 2
                      continue
                  c = glob[i]
                  if c == "*":
                      out += "[^/]*"
                  elif c == "?":
                      out += "[^/]"
                  elif c == "[" and "]" in glob[i + 2:]:
                      end = glob.index("]", i + 2)
                      body = glob[i + 1:end]
                      out += "[" + ("^" + body[1:] if body.startswith("!") else body) + "]"
                      i = end
                  else:
                      out += re.escape(c)
                  i += 1
              return out

          for glob in os.environ["RULES"].splitlines():
              if glob and re.fullmatch(regex(glob), sys.argv[1]):
                  print(glob)
                  break
          ' "$GITHUB_REF_NAME")"
              if [ -n "$matched" ]; then
                echo "::notice::github-pages admits tag '$GITHUB_REF_NAME' through its rule '$matched'"
              else
                admitted=false
                echo "::warning::github-pages has no tag rule matching '$GITHUB_REF_NAME', so the tag cannot deploy the site and the site deploy is skipped. To publish on tags, add a rule: gh api -X POST $ENV_API/deployment-branch-policies -f name='v*' -f type=tag"
              fi
            fi
          fi
          if [ "$admitted" = true ]; then
            echo "deploy_web=$DEPLOY_WEB" | tee -a "$GITHUB_OUTPUT"
            echo "website=$WEBSITE" | tee -a "$GITHUB_OUTPUT"
          else
            echo "deploy_web=false" | tee -a "$GITHUB_OUTPUT"
            echo "website=false" | tee -a "$GITHUB_OUTPUT"
            # A promotion run exists to rebuild the site. Refused the environment, it has nothing
            # left to do, and every job below stands down; without this the run ends green and
            # silent, which reads as "the promotion worked".
            [ "$PROMOTION" != true ] || echo "::warning::$GITHUB_REF_NAME was marked Latest, and this run cannot deploy the site, so it does nothing. Admit the tag to github-pages (the rule above) and re-run it."
          fi

  build:
    # The bare target when the caller named no device profiles, `<target> · <device>` when it did
    # — so a run that never asked for profiles keeps the job names its branch protection knows.
    name: ${{ matrix.label }}
    needs: [preflight]
    # A promotion run rebuilds for the website alone, so one that deploys no website has nothing
    # to do: the release it was fired by already carries everything this would build.
    if: ${{ needs.preflight.outputs.promotion != 'true' || needs.preflight.outputs.website == 'true' }}
    runs-on: ${{ matrix.os }}
    # A row marked `optional=true` (a back-deployment probe against the app's floor) reports its
    # result without failing the run. The planner refuses the flag on a target's first row, so
    # the packing row always gates.
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # The build flavor this leg builds (inputs.flavors), empty for the base app. Every `day`
      # command reads it, so no step below carries a `--flavor` flag of its own.
      DAY_FLAVOR: ${{ matrix.flavor }}
      # Where that build writes: a flavor keeps its compiled and staged output apart, the way
      # `--day-src` does, so two flavors of one app never overwrite each other.
      DAY_BUILD_DIR: build/day${{ matrix.flavor != '' && format('/flavors/{0}', matrix.flavor) || '' }}
      # Verbose day CLI (inputs.day-verbose): lint/doctor stay terse either way; build, pack,
      # and every scripted launch — including the ones the generated dayscript runner performs,
      # which no flag from this file could reach — forward their sub-commands' raw output.
      DAY_VERBOSE: ${{ inputs.day-verbose && '1' || '0' }}
      # Release signing, active on semantic-version tags only — branch/PR packs stay dev-signed
      # even when the repository secrets exist. Absent/empty secrets degrade to the dev tier.
      # The names match daybrite/day's ci.yml; forward them with `secrets: inherit`.
      # NO macOS signing material reaches this job on any ref. It builds arbitrary repository code
      # — cargo, every dependency's build.rs, the app's own dayscripts — so it packs the .dmg at
      # the DEV tier even on a tag. The Developer ID and the notary key live in `sign-macos`,
      # which runs no repository code at all.
      DAY_APPLE_TEAM: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_APPLE_TEAM || '' }}
      DAY_ASC_KEY_ID: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_ASC_KEY_ID || '' }}
      DAY_ASC_ISSUER: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_ASC_ISSUER || '' }}
      DAY_ANDROID_KEY_ALIAS: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_ANDROID_KEY_ALIAS || '' }}
      DAY_KS_PASS: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_KS_PASS || '' }}
      DAY_KEY_PASS: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_KEY_PASS || '' }}
      DAY_OHOS_KEY_ALIAS: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_OHOS_KEY_ALIAS || '' }}
      DAY_OHOS_KS_PASS: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_OHOS_KS_PASS || '' }}
      DAY_OHOS_KEY_PASS: ${{ needs.preflight.outputs.release == 'true' && secrets.DAY_OHOS_KEY_PASS || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2

      # The day revision preflight resolved (inputs.update-day-deps). `--precise` and not a bare
      # `cargo update`, so every leg of the matrix compiles the SAME framework revision even if
      # someone pushes to day while the run is in flight. Empty output = the input is off, and the
      # committed lock stands.
      - name: Track the day revision preflight resolved
        if: needs.preflight.outputs.day-rev != ''
        working-directory: ${{ inputs.project-path }}
        run: cargo update -p day --precise "${{ needs.preflight.outputs.day-rev }}"

      # --- the day CLI (cargo install, per the day-version input) -------------------------
      - name: Set up the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}

      - name: Setup command
        if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}

      # --- everything this target needs, in one step ---------------------------------------
      # The toolkit's dev libraries, the Rust std for its cross-compile and the SDK a mobile target
      # builds through — a property of the TARGET, so it lives in one action (this repo's
      # setup-day-deps) that daybrite/day's doctor-verify.yml calls too, rather than a ladder of
      # `if: matrix.target == …` steps kept in step by hand across three repositories.
      #
      # `extras` brings what a walkthrough needs beyond a build (the web view's dev libs, a virtual
      # display, screenshot tooling, CJK fonts); `pack` brings flatpak/linuxdeploy/NSIS, below,
      # closer to where they are used.
      - name: Set up ${{ matrix.target }} dependencies
        uses: daybrite/actions/.github/actions/setup-day-deps@main
        with:
          target: ${{ matrix.target }}
          # Only the row that packs pays for the packaging tools: a second device-profile row
          # builds and runs scripts and never packs, so it can skip flatpak/linuxdeploy/NSIS.
          pack: ${{ matrix.primary }}
          extras: true
          java: true
          # The toolchain step above already installed the matrix's rust targets.
          rust: false
          # What the caller's app needs for this target beyond Day's set (inputs.target-packages).
          packages: ${{ matrix.packages }}

      # The caller's own commands for this target (inputs.target-setup), after the dependencies
      # above so a command can build on what they installed.
      - name: Target setup (${{ matrix.target }})
        if: matrix.setup != ''
        env:
          TARGET_SETUP: ${{ matrix.setup }}
        run: bash -eo pipefail -c "$TARGET_SETUP"

      # --- validate the environment, then build ---------------------------------------------
      # Source-level checks before anything is built: fluent coverage, duplicate ids, unknown
      # routes, permission drift, and the store listing's per-store rules (docs/store.md).
      - name: Lint
        if: inputs.lint
        working-directory: ${{ inputs.project-path }}
        run: $DAY_BIN lint

      - name: Doctor (${{ matrix.toolkit }})
        run: $DAY_BIN doctor --toolkit ${{ matrix.toolkit }}

      - name: Build (${{ matrix.target }})
        id: build
        working-directory: ${{ inputs.project-path }}
        run: $DAY_BIN build -p ${{ matrix.target }}

      # --- distribution packaging (before scripts, so packages survive a script flake) ------
      # No Apple material reaches this job: the iOS .ipa is packed unsigned here and signed in
      # `sign-ios` after the build, the way `sign-macos` signs the .app, so the job that runs the
      # app's code and its dayscripts never holds a certificate. (It used to import the
      # distribution certificate and archive with automatic signing, which minted a development
      # certificate on every run's fresh keychain until the account was full; Day-Showcase
      # v0.4.13, 2026-09-24.)
      - name: Materialize signing material
        if: needs.preflight.outputs.release == 'true' && matrix.primary
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.DAY_ANDROID_KEYSTORE_B64 }}
          OHOS_KEYSTORE_B64: ${{ secrets.DAY_OHOS_KEYSTORE_B64 }}
          OHOS_CERT_B64: ${{ secrets.DAY_OHOS_CERT_B64 }}
          OHOS_PROFILE_B64: ${{ secrets.DAY_OHOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          put() { # $1=b64 secret value, $2=file name, $3=env var to export
            if [ -n "$1" ]; then
              echo "$1" | base64 --decode > "$RUNNER_TEMP/$2"
              echo "$3=$RUNNER_TEMP/$2" >> "$GITHUB_ENV"
            fi
          }
          case "${{ matrix.target }}" in
            # macos-*, ios-uikit: nothing — the Developer ID and notary key live in `sign-macos`,
            # the distribution certificate and App Store profile in `sign-ios`.
            android-mdc) put "${ANDROID_KEYSTORE_B64:-}" upload.keystore DAY_ANDROID_KEYSTORE ;;
            harmony-arkui)
              put "${OHOS_KEYSTORE_B64:-}" ohos.p12 DAY_OHOS_KEYSTORE
              put "${OHOS_CERT_B64:-}" ohos.cer DAY_OHOS_CERT
              put "${OHOS_PROFILE_B64:-}" ohos.p7b DAY_OHOS_PROFILE ;;
          esac

      # The linux legs pack BOTH formats (day pack, §16.5), so both toolchains are installed.
      - name: Stage the web dist (web-dom)
        if: matrix.target == 'web-dom'
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          $DAY_BIN build -p web-dom --profile release
          dist="$DAY_BUILD_DIR/cargo/web-dom/release/dist"
          if [ ! -f "$dist/index.html" ]; then
            echo "::error::web-dom release build produced no dist at $dist — does the app's Cargo.toml declare the 'dom = [\"day/dom\"]' feature? (day new app scaffolds it.)"
            find "$DAY_BUILD_DIR/cargo/web-dom" -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          # The web artifact IS the built dist folder, zipped: index.html + shim.js + day.css +
          # app.wasm + assets/… at the zip root. Recurse from inside dist so the assets/ subtree is
          # preserved (a flat `zip -j` would drop it).
          #
          # web-dom is the one shipped target with no `day pack`, so the release name is assembled
          # here instead of by the CLI. `.project.artifact` is the same stem every packed artifact
          # uses, which is what keeps this zip in the set rather than beside it.
          out="$PWD/build/day/dist"
          mkdir -p "$out"
          stem="$("$DAY_BIN" metadata --json | jq -r '.project.artifact')"
          [ -n "$stem" ] && [ "$stem" != null ] || { echo "::error::day metadata reported no artifact stem"; exit 1; }
          ( cd "$dist" && zip -qr "$out/$stem-web-dom.zip" . )

      # The commit in the SBOM only describes the artifact if the tree it was built from matches
      # that commit exactly — see the action.
      - name: Assert the checkout is pristine
        if: inputs.assert-pristine
        uses: daybrite/actions/.github/actions/assert-pristine@main
        with:
          # The project directory, so the action's default `Cargo.lock` ignore names THIS
          # project's lock — the one `Prepare Cargo.lock` and `update-day-deps` rewrite — even
          # when the project lives in a subdirectory of its repository (a piece's `demo/`).
          # The whole repository is still checked: git status reports every path from any
          # directory.
          path: ${{ inputs.project-path }}
          # A `setup-command` caller scaffolds the project into the workspace, so the tree is
          # untracked BY DESIGN and no commit describes what gets packed. Skipping says that out
          # loud rather than failing on a condition the caller cannot fix.
          skip-reason: ${{ inputs.setup-command != '' && 'the project was generated by setup-command, so no commit describes it' || '' }}

      - name: Pack (${{ matrix.target }})
        id: pack
        # Only a target's PRIMARY profile row packs. A second row exists for its screenshots on
        # another device; letting it pack too would upload a second copy of every package under
        # the same artifact name and, on a tag, race the first for the release asset.
        if: matrix.target != 'web-dom' && matrix.primary
        # Best-effort on the non-primary combos only when the caller asks (tolerate-failures).
        continue-on-error: ${{ inputs.tolerate-failures && matrix.tier == 'extra' }}
        working-directory: ${{ inputs.project-path }}
        env:
          ANDROID_ABIS_IN: ${{ inputs.android-abis }}
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            # DAY_ANDROID_ABI is authoritative for `day pack`: it packs a lib/<abi>/ slice for every
            # listed ABI (inputs.android-abis, default both arm64-v8a and x86_64), whatever devices
            # are attached. The preflight job's matrix installed the matching rustup targets.
            android-mdc) export DAY_ANDROID_ABI="${DAY_ANDROID_ABI:-${ANDROID_ABIS_IN:-arm64-v8a x86_64}}" ;;
            harmony-arkui) export DAY_OHOS_ARCH="${DAY_OHOS_ARCH:-arm64}" ;;
          esac
          # --no-version-in-name → version-less artifact names (app-fair.aab, not app-fair-1.0.0.aab),
          # so each release asset is reachable at a stable .../releases/latest/download/<name> URL.
          # The iOS package is always packed unsigned here (`-unsigned.ipa`); `sign-ios` signs it.
          NO_SIGN=""
          [ "${{ matrix.target }}" = ios-uikit ] && NO_SIGN="--no-sign"
          $DAY_BIN pack -p ${{ matrix.target }} --no-version-in-name --format json $NO_SIGN

      # The handoff to `sign-macos`: the built .app, its entitlements, and the provenance sidecars,
      # so the signing job can produce a notarized .dmg without ever seeing this build tree.
      - name: Stage the unsigned .app for signing
        if: matrix.target == 'macos-appkit' && matrix.flavor == ''
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/appstage"; mkdir -p "$STAGE"
          # ditto, not cp — the bundle-aware copy, which keeps permissions and symlinks intact.
          for a in build/day/pack/macos-appkit/*.app; do ditto "$a" "$STAGE/$(basename "$a")"; done
          ENT="$(sed -n 's/^entitlements = "\(.*\)".*/\1/p' Day.toml | head -1)"
          if [ -n "$ENT" ] && [ -f "$ENT" ]; then cp "$ENT" "$STAGE/entitlements.plist"; fi
          mkdir -p "$RUNNER_TEMP/appout"
          ditto -c -k "$STAGE" "$RUNNER_TEMP/appout/app.zip"
          cp build/day/dist/*.json "$RUNNER_TEMP/appout/" 2>/dev/null || true
          # The signing job rebuilds the .dmg from the .app, so it has to reproduce the name
          # `day pack` chose rather than invent one from the bundle title — the sidecars staged
          # above are named after that exact file (§20.4), and would otherwise describe nothing.
          basename "$(find build/day/dist -maxdepth 1 -name '*.dmg' | head -1)" > "$RUNNER_TEMP/appout/dmg-name.txt"

      - name: Upload the unsigned .app
        if: matrix.target == 'macos-appkit' && matrix.flavor == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}app-macos-appkit
          path: ${{ runner.temp }}/appout/
          if-no-files-found: error
          overwrite: true

      - name: Upload packages
        # `always()` so a later script flake still ships the packages, but not when there is
        # nothing to ship: `if-no-files-found: error` would report the empty directory as a second
        # failure and bury the real one. So the build must have SUCCEEDED (a failure anywhere
        # before it — lint, doctor — skips it, and skipping this too keeps the log honest), and
        # pack must not have failed. A skipped pack still uploads: that is web-dom, which stages a
        # zip of the dist instead of packing.
        if: always() && matrix.primary && steps.build.outcome == 'success' && steps.pack.outcome != 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}${{ matrix.dist_artifact }}
          path: ${{ inputs.project-path }}/build/day/dist/
          if-no-files-found: ${{ matrix.tier == 'primary' && 'error' || 'warn' }}
          # A failed leg may already have uploaded this before failing later; its re-run replaces
          # that attempt's copy, which upload-artifact otherwise refuses as a duplicate name.
          overwrite: true

      # --- dayscripts + screenshots ----------------------------------------------------------
      # Every target runs the scripts: desktop and iOS through the generated runner below,
      # Android and HarmonyOS on their emulators, web-dom in a headless Playwright browser
      # driven by the CLI's own bundled page-driver. The emulator legs are best-effort —
      # packages are already uploaded above and must not be blocked by a screenshot flake.
      - name: Prepare the dayscript runner
        id: scripts
        working-directory: ${{ inputs.project-path }}
        env:
          # The row's per-target list (inputs.target-scripts) wins over the global one.
          SCRIPTS_IN: ${{ matrix.scripts != '' && matrix.scripts || inputs.scripts }}
          LOCALES_IN: ${{ inputs.locales }}
          THEMES_IN: ${{ inputs.themes }}
          LAUNCH_ENV_IN: ${{ inputs.launch-env }}
          SCRIPTS_ONCE_IN: ${{ inputs.scripts-once }}
          CAPTURE_SIZE_IN: ${{ inputs.capture-size }}
          COMBO: ${{ matrix.target }}
          DEVICE_SLUG: ${{ matrix.device_slug }}
        run: |
          set -euo pipefail
          LIST=""
          case "${SCRIPTS_IN:-auto}" in
            none) ;;
            ""|auto) LIST="$( (ls dayscript/*.yaml scripts/*.yaml 2>/dev/null || true) | tr '\n' ' ')" ;;
            *) LIST="${SCRIPTS_IN//,/ }" ;;
          esac
          if [ -z "${LIST// /}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no dayscripts to run"
            exit 0
          fi
          # Scripts the caller marked `scripts-once` leave the crossed list and run last, once.
          # Membership is by path as written, matched whole, so `crash.yaml` cannot catch
          # `pre-crash.yaml`.
          # `if`, not `&&`: under `set -e` a failing `&&` compound aborts the shell, and a
          # non-match here is the ordinary case rather than an error.
          ONCE=""
          REST=""
          for f in $LIST; do
            keep=yes
            for o in ${SCRIPTS_ONCE_IN//,/ }; do
              if [ "$f" = "$o" ]; then keep=no; fi
            done
            if [ "$keep" = yes ]; then REST="$REST $f"; else ONCE="$ONCE $f"; fi
          done
          for o in ${SCRIPTS_ONCE_IN//,/ }; do
            case " $LIST " in
              *" $o "*) ;;
              *) echo "::warning::scripts-once: $o is not among the scripts this target runs" ;;
            esac
          done
          LOCALES="${LOCALES_IN//,/ }"
          # `all` is the app's own locale set, read from the catalogs it ships. An app that adds
          # a language then has it walked through without also editing its workflow, which is the
          # whole point: the list that decides what ships and the list CI exercises are one list.
          # Order follows day-build's own default rule — `en` first when the app has it, the rest
          # in tag order — so the default locale is the first to fail and the variant directories
          # come out in a stable order.
          if [ "${LOCALES// /}" = all ]; then
            LOCALES="$(find resource/locales -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
              | sed 's|.*/||' | sort \
              | awk '$0 == "en" { en = $0; next } { rest = rest " " $0 } \
                     END { sub(/^ /, "", rest); print (en ? en (rest ? " " rest : "") : rest) }')"
            if [ -z "${LOCALES// /}" ]; then
              echo "::error::locales: all — no locale catalogs under ${PWD}/resource/locales"
              exit 1
            fi
            echo "locales: all → $LOCALES"
          fi
          THEMES="${THEMES_IN//,/ }"
          ENVS=""
          for kv in $LAUNCH_ENV_IN; do ENVS="$ENVS --env $kv"; done
          OUT="$RUNNER_TEMP/run-dayscripts.sh"
          # Two runner shapes, chosen by what the installed CLI supports:
          #
          # NEW (day > 0.1.2): `day launch --locales` owns the per-locale loop, the variant
          # naming, the linux headless plumbing (both toolkits under an xvfb sized from Day.toml,
          # WebKit flags for gtk, the xcb platform for qt — a real display, so the system
          # clipboard works), and the iOS app-death retry — the knowledge this step used to
          # inline, now shared with day's own CI through the CLI.
          #
          # LEGACY (released CLIs without --locales): the previous inline wrapper, kept
          # verbatim so `day-version: latest` keeps working. DELETE this branch when the
          # first release carrying --locales ships and `latest` resolves to it.
          if $DAY_BIN launch --help 2>/dev/null | grep -q -- --locales; then
            # Computed before the heredoc: quotes nested inside \${var:+…} would be eaten by
            # quote removal during expansion, splitting a two-locale list into two arguments.
            LOCFLAG=""
            [ -n "${LOCALES// /}" ] && LOCFLAG=" --locales \"$LOCALES\""
            THEMEFLAG=""
            [ -n "${THEMES// /}" ] && THEMEFLAG=" --themes \"$THEMES\""
            # The capture-tree level for this job's device (docs/screenshots.md). Empty for a
            # single-device target, which keeps its captures exactly where every existing site
            # build expects them; set, it stops two form factors of one target overwriting each
            # other when the site job merges every screenshot artifact into one tree.
            DEVFLAG=""
            [ -n "${DEVICE_SLUG:-}" ] && DEVFLAG=" --device-slug \"$DEVICE_SLUG\""
            # The desktop-class capture size, when the caller overrides the app's Day.toml
            # [screenshots]. Only a CLI that knows the flag gets it; an older one keeps capturing
            # at the app's window size, and says why here rather than failing on the flag.
            CAPFLAG=""
            if [ -n "${CAPTURE_SIZE_IN// /}" ]; then
              if $DAY_BIN launch --help 2>/dev/null | grep -q -- --capture-size; then
                CAPFLAG=" --capture-size \"${CAPTURE_SIZE_IN// /}\""
              else
                echo "::warning::capture-size: ignored — the installed day CLI predates --capture-size"
              fi
            fi
            cat > "$OUT" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$PWD"
          run_one() {
            local flags=()
            for s in "\$@"; do flags+=(--script "\$s"); done
            $DAY_BIN launch -p $COMBO "\${flags[@]}"$THEMEFLAG$LOCFLAG$DEVFLAG$CAPFLAG$ENVS
          }
          # Same launch without the theme/locale cross (inputs.scripts-once): one run in the
          # app's own appearance and language.
          run_once() {
            local flags=()
            for s in "\$@"; do flags+=(--script "\$s"); done
            $DAY_BIN launch -p $COMBO "\${flags[@]}"$DEVFLAG$CAPFLAG$ENVS
          }
          EOF
            if [ "$COMBO" = web-dom ]; then
              # All scripts in ONE launch: web state (OPFS in the driver's throwaway browser
              # profile, on an ephemeral loopback origin) lives exactly as long as the launch,
              # so a seed script's store can only reach the scripts after it inside the same
              # launch — the CLI runs them in sequence against the one app instance. Native
              # targets keep one launch per script: their stores persist on disk, and the
              # relaunch between scripts doubles as cold-start coverage over the stored data.
              if [ -n "${REST// /}" ]; then echo "run_one $REST" >> "$OUT"; fi
              if [ -n "${ONCE// /}" ]; then echo "run_once $ONCE" >> "$OUT"; fi
            else
              for f in $REST; do
                echo "run_one \"$f\"" >> "$OUT"
              done
              for f in $ONCE; do
                echo "run_once \"$f\"" >> "$OUT"
              done
            fi
          else
            if [ -n "${THEMES// /}" ]; then
              echo "::warning::themes: ignored — the installed day CLI predates --themes (day > 0.1.2)"
            fi
            # Per-target launch wrapper: linux-gtk renders under xvfb sized to the app window
            # (so the root-capture screenshot fallback is exactly the app); linux-qt uses the
            # offscreen platform; ios retries once on the known simulator app-death flake.
            PREFIX=""
            case "$COMBO" in
              linux-gtk)
                W=$(sed -n 's/^width *= *\([0-9][0-9]*\).*/\1/p' Day.toml | head -1)
                H=$(sed -n 's/^height *= *\([0-9][0-9]*\).*/\1/p' Day.toml | head -1)
                PREFIX="xvfb-run -a -s \"-screen 0 ${W:-1024}x${H:-768}x24\""
                ENVS="$ENVS --env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 --env WEBKIT_DISABLE_COMPOSITING_MODE=1" ;;
              linux-qt)
                ENVS="$ENVS --env QT_QPA_PLATFORM=offscreen" ;;
            esac
            RETRY=false
            [ "$COMBO" = ios-uikit ] && RETRY=true
            cat > "$OUT" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$PWD"
          LOG="\${RUNNER_TEMP:-/tmp}/dayscript.log"
          run_one() {
            if $PREFIX day launch -p $COMBO --script "\$@"$ENVS 2>&1 | tee "\$LOG"; then return 0; fi
            if $RETRY && grep -q "engine connection lost" "\$LOG" && ! grep -q "✗" "\$LOG"; then
              echo "::warning::engine connection lost (flaky simulator app-death) — retrying the script once"
              $PREFIX day launch -p $COMBO --script "\$@"$ENVS
            else
              return 1
            fi
          }
          EOF
            for f in $LIST; do
              if [ -z "${LOCALES// /}" ]; then
                echo "run_one \"$f\"" >> "$OUT"
              else
                for L in $LOCALES; do
                  echo "run_one \"$f\" --locale $L --variant $L" >> "$OUT"
                done
              fi
            done
          fi
          chmod +x "$OUT"
          echo "generated $OUT:"
          cat "$OUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      # The simulator this job's profile names, matched as a PREFIX: runner images retire device
      # names every few months, so an exact "iPhone 15" would start failing the day the image
      # moves to 16. Unmatched is a hard error listing what the image does have — silently taking
      # some other device would upload screenshots of the wrong form factor under this job's name.
      # The simulator this job's profile names. Selection, boot, wait and orientation are all
      # `day devices boot` — the same command a developer runs, rather than a workflow-shaped
      # copy of it that drifts (it used to be inline simctl + jq here).
      - name: Boot an iOS Simulator (${{ matrix.profile }})
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'ios-uikit'
        env:
          PROFILE: ${{ matrix.profile }}
          DEVICE_OS: ${{ matrix.device_os }}
          DEVICE_ORIENTATION: ${{ matrix.device_orientation }}
        run: |
          set -euo pipefail
          # `day launch` drives every booted simulator, so this job owns exactly one. Each profile
          # is its own job, so there is no sibling run whose captures could be mixed in.
          xcrun simctl shutdown all || true
          # After the build, not overlapped with it: a hosted macOS runner has three cores, and a
          # cold boot is CPU- and I/O-bound for its whole length, not a wait. Started in the
          # background under the lint, doctor and build (tried 2026-09-24), it starved all
          # three (lint 2 s → 9 min, build 79 s → 5 min) and was itself slowed by the build, so the
          # job took seven minutes longer, not five fewer. Nothing before this step is idle
          # enough to hide a boot behind.
          # --headless: a runner has no display to put a simulator window on, so skip opening one
          # (Simulator.app up to Xcode 26, Device Hub from 27) and the extra wait that getting one
          # would need. Without it, an Xcode 27 runner used to print "Unable to find application
          # named 'Simulator'" into this log while the boot itself succeeded. Orientation does not
          # need the window; `devicectl` turns the device itself.
          args=(devices boot -p ios-uikit --device "$PROFILE" --wait --headless)
          [ -n "${DEVICE_OS:-}" ] && args+=(--os "$DEVICE_OS")
          [ -n "${DEVICE_ORIENTATION:-}" ] && args+=(--orientation "$DEVICE_ORIENTATION")
          "$DAY_BIN" "${args[@]}"

      # A hosted Windows runner's desktop is 1024x768, and Windows will not open a window larger
      # than the desktop: the 1280x800 window the default capture size asks for would come back
      # clipped to it. Raise the resolution first. Best-effort: on an image without the cmdlet
      # the captures are smaller, which the gallery shows and no build should fail over.
      - name: Size the desktop for the capture window (windows)
        if: steps.scripts.outputs.found == 'true' && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "desktop is now $($b.Width)x$($b.Height)"

      - name: Run dayscripts (${{ matrix.target }})
        if: steps.scripts.outputs.found == 'true' && matrix.target != 'android-mdc' && matrix.target != 'harmony-arkui' && matrix.target != 'web-dom'
        continue-on-error: ${{ inputs.tolerate-failures && matrix.tier == 'extra' }}
        run: bash "$RUNNER_TEMP/run-dayscripts.sh"

      - name: Enable KVM group perms (android / harmony emulator)
        # Make /dev/kvm world-accessible so the emulators can open it (`day devices boot -p harmony-arkui` auto-selects `-accel kvm` when /dev/kvm exists).
        if: steps.scripts.outputs.found == 'true' && (matrix.target == 'android-mdc' || matrix.target == 'harmony-arkui')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The system IMAGE is the only slow part of standing an emulator up — hundreds of
      # megabytes, and identical for every run on that API level. The AVD built from it is made
      # fresh each run by `day devices setup`, which takes about a second and so can never go
      # stale against a changed profile.
      # `${{ env.ANDROID_HOME }}` below reads the ENV CONTEXT, which sees only what a workflow,
      # job or step `env:` set — not what the runner image exported into the shell. It was
      # therefore empty, and the cache path resolved to `/system-images/android-<api>`: a
      # directory at the filesystem root that never holds the image, so every run re-downloaded
      # several hundred megabytes and cached nothing. Publishing it through $GITHUB_ENV is what
      # puts it in that context for the steps that follow.
      - name: Expose ANDROID_HOME to later expressions
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'android-mdc'
        run: echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}" >> "$GITHUB_ENV"
      - name: Cache the Android system image
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'android-mdc'
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-${{ matrix.device_os || '36' }}
          key: android-sysimg-${{ matrix.device_os || '36' }}-x86_64-google_apis
      - name: Set up and boot the emulator (day devices)
        id: androidemu
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'android-mdc'
        env:
          PROFILE: ${{ matrix.profile }}
          DEVICE_OS: ${{ matrix.device_os }}
          DEVICE_ORIENTATION: ${{ matrix.device_orientation }}
          DEVICE_DENSITY: ${{ matrix.device_density }}
        run: |
          set -euo pipefail
          # One AVD per profile, made from the same command a developer runs. The workflow holds
          # no Android SDK knowledge of its own any more — which system image an API level wants,
          # that `avdmanager` writes `hw.keyboard=no`, how to start headless — all of it lives in
          # the CLI, where a developer gets it too.
          #
          # The name is CHOSEN here rather than read back from the command. `setup` does print it,
          # but making the next step depend on that means one stray line of tool output on stdout
          # breaks the run — which is exactly what happened when sdkmanager's download bars landed
          # there and the whole blob was passed to `--device`. Naming it needs no such trust.
          AVD="day-ci-$(printf %s "$PROFILE" | tr -cs '[:alnum:]' '-')"
          $DAY_BIN devices setup -p android-mdc --name "$AVD" \
            --device "$PROFILE" --os "${DEVICE_OS:-36}" --arch x86_64 \
            ${DEVICE_ORIENTATION:+--orientation "$DEVICE_ORIENTATION"} \
            ${DEVICE_DENSITY:+--density "$DEVICE_DENSITY"}
          # Where the SDK tools actually put things, printed every run. This is cheap and it is
          # the evidence that was missing when a runner created an AVD successfully and then
          # reported having none: the tools keep `.android` wherever ANDROID_USER_HOME (or the
          # older ANDROID_SDK_HOME) points, which need not be $HOME, and the layout differs
          # between a developer's machine and this image.
          echo "::group::Android SDK layout"
          for v in HOME ANDROID_HOME ANDROID_SDK_ROOT ANDROID_USER_HOME ANDROID_SDK_HOME \
                   ANDROID_AVD_HOME; do
            printf '%-20s %s\n' "$v" "$(eval echo "\${$v:-<unset>}")"
          done
          echo "--- avdmanager list avd -c ---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd -c 2>&1 | head -20 || true
          echo "--- emulator -list-avds ---"
          "$ANDROID_HOME/emulator/emulator" -list-avds 2>&1 | head -20 || true
          echo "--- .ini files under every candidate home ---"
          for d in "${ANDROID_AVD_HOME:-}" "${ANDROID_USER_HOME:-}/avd" \
                   "${ANDROID_SDK_HOME:-}/.android/avd" "$HOME/.android/avd"; do
            [ -n "$d" ] && [ -d "$d" ] && { echo "  $d:"; ls -1 "$d" | sed 's/^/    /'; }
          done
          echo "--- day's own view ---"
          $DAY_BIN devices list -p android-mdc 2>&1 | head -20 || true
          echo "::endgroup::"
          # `--wait` blocks on sys.boot_completed rather than on adbd answering, and the serial
          # comes back on stdout so the walkthrough drives exactly the device this booted.
          #
          # The wait narrates itself: a line whenever adb's view or the boot properties change, a
          # heartbeat every 15s, and the emulator's own log tail if it exits or times out. Set the
          # caller's `day-verbose: true` (DAY_VERBOSE reaches here from the job env) for a line per
          # poll instead — worth doing when a boot hangs rather than fails.
          SERIAL="$($DAY_BIN devices boot -p android-mdc --device "$AVD" --wait --headless \
            ${DEVICE_ORIENTATION:+--orientation "$DEVICE_ORIENTATION"})"
          # Set and verify this even when the caller pins an older Day CLI. Error
          # dialogs must not cover gallery captures; crashes still appear in logcat.
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" -s "$SERIAL" shell settings put global hide_error_dialogs 1
          "$ADB" -s "$SERIAL" shell settings put secure immersive_mode_confirmations confirmed
          test "$("$ADB" -s "$SERIAL" shell settings get global hide_error_dialogs | tr -d '\r')" = 1
          "$ADB" -s "$SERIAL" shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"
      - name: Run dayscripts (android emulator · ${{ matrix.profile }})
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'android-mdc'
        # NOT best-effort. This was `continue-on-error: true` for a known intermittent
        # app-start flake, and the cost was that every REAL walkthrough failure on Android went
        # unreported too: Day-Tradr's phone-route breakage failed android-mdc and ios-uikit
        # identically for weeks, and only ios-uikit ever turned the build red — which made a
        # deterministic bug look like an iOS-only flake. A green tick has to mean the
        # walkthrough passed. The app-start flake is handled where it belongs, by the CLI's own
        # retry on engine loss (`day launch --locales`), which distinguishes a dead app from a
        # failed assertion; a flake that outlives that retry should be seen, not hidden.
        env:
          DAY_ANDROID_ABI: x86_64
          ANDROID_SERIAL: ${{ steps.androidemu.outputs.serial }}
        run: bash ${{ runner.temp }}/run-dayscripts.sh

      # --- HarmonyOS: the Oniro emulator, the same recipe daybrite/day's own CI runs.
      # Best-effort from boot to walkthrough only under tolerate-failures: the QEMU guest is slow
      # and occasionally flaky, and a caller may prefer losing a run's OHOS screenshots to
      # re-running the leg. By default a wedged emulator fails the leg; the packages are already
      # uploaded either way. QEMU itself comes from setup-day-deps (extras).
      - name: Cache the Oniro emulator image
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'harmony-arkui'
        uses: actions/cache@v6
        with:
          path: ~/.cache/oniro-emulator/v6.1
          key: oniro-emulator-v6.1-oniro_emulator.zip
      - name: Boot the Oniro emulator (${{ matrix.profile }})
        id: ohosemu
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'harmony-arkui'
        continue-on-error: ${{ inputs.tolerate-failures }}
        env:
          PROFILE: ${{ matrix.profile }}
          DEVICE_ORIENTATION: ${{ matrix.device_orientation }}
        run: |
          set -euo pipefail
          HELP="$("$DAY_BIN" devices boot --help)"
          if ! grep -Fq "starts Oniro without a window" <<< "$HELP"; then
            echo "::error::This workflow requires a current day CLI with HarmonyOS headless device boot. Update day-version."
            exit 1
          fi
          # The panel (`harmony-devices`): `--device phone|tablet|WxH` and `--orientation`, which
          # a CLI from before panels were selectable refuses. That CLI boots the phone and only
          # the phone, so the row that asked for anything else fails here rather than publishing
          # phone captures under a tablet's name.
          args=(devices boot -p harmony-arkui --headless)
          if grep -Fq "names the panel" <<< "$HELP"; then
            [ -n "${PROFILE:-}" ] && args+=(--device "$PROFILE")
            [ -n "${DEVICE_ORIENTATION:-}" ] && args+=(--orientation "$DEVICE_ORIENTATION")
          elif [ -n "${PROFILE:-}" ] && [ "$PROFILE" != phone ]; then
            echo "::error::this day CLI boots the Oniro emulator on its phone panel only; the $PROFILE row needs a CLI with 'day devices boot --device' for harmony-arkui. Update day-version."
            exit 1
          fi
          ZIP="$HOME/.cache/oniro-emulator/v6.1/oniro_emulator.zip"
          if [ ! -f "$ZIP" ]; then
            mkdir -p "$(dirname "$ZIP")"
            curl -fL -o "$ZIP" \
              "https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v6.1/oniro_emulator.zip"
          fi
          rm -rf "$RUNNER_TEMP/oniro-emulator" && mkdir -p "$RUNNER_TEMP/oniro-emulator"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/oniro-emulator"
          IMAGES="$(dirname "$(find "$RUNNER_TEMP/oniro-emulator" -name bzImage -print -quit)")"
          echo "DAY_OHOS_EMULATOR=$IMAGES" >> "$GITHUB_ENV"
          DAY_OHOS_EMULATOR="$IMAGES" "$DAY_BIN" "${args[@]}"
      - name: Run dayscripts (harmony emulator · ${{ matrix.profile }})
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'harmony-arkui' && steps.ohosemu.outcome == 'success'
        continue-on-error: ${{ inputs.tolerate-failures }}
        env:
          # Per-screenshot compositor settle before capture (script.rs): matches the measured
          # 2-3 s emulator compositor lag; the byte-identical stale-frame retry still catches
          # the stragglers.
          DAY_OHOS_SHOT_SETTLE_MS: "2500"
        run: bash "$RUNNER_TEMP/run-dayscripts.sh"

      # --- web-dom: scripted runs drive a headless Playwright browser through the page-driver
      # that ships INSIDE day-cli (`day web driver`), so driver and CLI can never disagree on
      # the control protocol. A day-version that predates the command skips the scripts with a
      # notice — exactly the old build-only behavior.
      - name: Install the walkthrough browser (web)
        id: webdriver
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'web-dom'
        continue-on-error: ${{ inputs.tolerate-failures }}
        run: |
          set -euo pipefail
          # An older CLI without the subcommand skips the scripts rather than failing the leg: the
          # scripts need the driver, and the web-dom build itself is fine. A failed browser
          # install below is a real failure, and fails the leg unless tolerate-failures is on.
          if ! DRIVER="$("$DAY_BIN" web driver 2>/dev/null)"; then
            echo "::notice::this day CLI has no 'web driver' subcommand — skipping the web-dom dayscripts"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/webdriver" && cd "$RUNNER_TEMP/webdriver"
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium
          {
            echo "DAY_WEB_DRIVER=node $DRIVER"
            echo "DAY_WEB_DRIVER_PLAYWRIGHT=$RUNNER_TEMP/webdriver"
            # Chromium, not WebKit: Playwright's Linux WebKit (the WPE port) ships no OPFS,
            # which day-part-fs needs (docs/fs.md).
            echo "DAY_WEB_DRIVER_BROWSER=chromium"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Run dayscripts (web-dom)
        if: steps.scripts.outputs.found == 'true' && matrix.target == 'web-dom' && steps.webdriver.outputs.ready == 'true'
        run: bash "$RUNNER_TEMP/run-dayscripts.sh"

      # A package that builds but will not install is worth catching here rather than on a user's
      # machine. Both Linux artifacts are checked, because they fail in different places: a
      # flatpak's manifest and appstream catalog are validated at install, and an AppImage's
      # bundling is only exercised when the thing is actually executed.
      - name: Install + inspect the flatpak
        if: ${{ inputs.app-id != '' && (matrix.target == 'linux-gtk' || matrix.target == 'linux-qt') }}
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          BUNDLE="$(find build/day/dist -maxdepth 1 -name '*.flatpak' | head -1)"
          [ -n "$BUNDLE" ] || { echo "::error::no .flatpak in build/day/dist"; exit 1; }
          flatpak install --user --noninteractive --bundle "$BUNDLE"
          flatpak info ${{ inputs.app-id }}

      # The AppImage's claim is "runs on a machine with nothing installed", and the only way to
      # check that is to run it. Under xvfb, since a runner has no display; the app is given a few
      # seconds to get a window up and is then killed — a crash-on-launch (a missing GTK/Qt module
      # the bundling failed to carry) exits before that and fails here.
      - name: Run the AppImage
        if: matrix.target == 'linux-gtk' || matrix.target == 'linux-qt'
        working-directory: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          FOUND="$(find build/day/dist -maxdepth 1 -name '*.appimage' | head -1)"
          [ -n "$FOUND" ] || { echo "::error::no .appimage in build/day/dist"; exit 1; }
          APP="$(realpath "$FOUND")"
          chmod +x "$APP"
          # Its own contents first: a bad AppDir extracts to a tree missing AppRun or the desktop
          # entry, and says so more clearly than a launch failure would.
          ( cd "$RUNNER_TEMP" && rm -rf squashfs-root && "$APP" --appimage-extract >/dev/null )
          for required in AppRun usr/bin; do
            [ -e "$RUNNER_TEMP/squashfs-root/$required" ] \
              || { echo "::error::the AppImage has no $required"; exit 1; }
          done
          ls "$RUNNER_TEMP/squashfs-root"/*.desktop >/dev/null \
            || { echo "::error::the AppImage has no .desktop at its root"; exit 1; }
          echo "bundled libraries: $(find "$RUNNER_TEMP/squashfs-root/usr/lib" -name '*.so*' 2>/dev/null | wc -l)"
          # Then the launch. `timeout` returns 124 when it had to kill a still-running app, which
          # is the PASSING outcome here; any other non-zero is the app dying on its own.
          set +e
          xvfb-run -a timeout 20s "$APP" > "$RUNNER_TEMP/appimage-run.log" 2>&1
          code=$?
          set -e
          if [ "$code" != 124 ] && [ "$code" != 0 ]; then
            echo "::error::the AppImage exited $code instead of staying up"
            tail -40 "$RUNNER_TEMP/appimage-run.log"
            exit 1
          fi
          echo "the AppImage stayed up for 20s"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # `screenshots-<target>` for the primary profile — the name every consumer already
          # reads — and `screenshots-<target>-<slug>` for each additional device.
          name: ${{ matrix.shots_artifact }}
          path: ${{ inputs.project-path }}/build/day${{ matrix.flavor != '' && format('/flavors/{0}', matrix.flavor) || '' }}/screenshots/
          if-no-files-found: ignore
          # Uploaded even when the leg fails, so a re-run of the failed leg must replace it: the
          # website then assembles the re-run's screenshots with the other legs' first ones.
          overwrite: true
      # The emulator's own output, kept by `day devices boot` on the host. A walkthrough that ends
      # in "the device stopped answering" leaves no crash to find — the guest froze, and every adb
      # call after that returns nothing — so what the emulator wrote is the one record of why.
      # The CLI prints its tail into the job log; the whole file goes here.
      - name: Upload the emulator log (android-mdc)
        if: failure() && matrix.target == 'android-mdc'
        uses: actions/upload-artifact@v7
        with:
          name: emulator-log-${{ matrix.target }}-${{ matrix.profile }}${{ matrix.flavor != '' && format('-{0}', matrix.flavor) || '' }}
          path: /tmp/day-emulator-*.log
          if-no-files-found: ignore
          overwrite: true

  # --- release assets (semantic-version tags only) ------------------------------------------
  # Attaches every package and a per-target screenshot zip to the GitHub release for the tag,
  # creating the release (as a draft, then un-drafting) if it doesn't exist yet.
  #
  # No job-level `permissions:` block here, deliberately: GitHub validates a nested job's
  # requested permissions against the CALLER's grant even when the job is skipped, so requesting
  # `contents: write` would break every read-only caller (validate.yml, app repos that never
  # tag). Instead the job inherits the caller's token — tag builds need the caller to grant
  # `permissions: contents: write`, or the release upload fails with a 403.
  # --- Rebuild the shipped artifact from its own provenance (opt-in) ---------------------------
  # `day rebuild` reads the SBOM and .buildinfo shipped beside the artifact, checks this machine's
  # toolchain against what built it, clones the recorded commit, packs it again, and compares the
  # compiled payload. Off by default because it costs a second full build per target; worth turning
  # on for a release branch, where "the tag is what it says it is" is the claim being made.
  validate:
    name: validate (${{ matrix.target }})
    needs: [preflight, build]
    if: ${{ inputs.validate-rebuild && !cancelled() }}
    runs-on: ${{ matrix.os }}
    env:
      # Same switch as the build job: `day rebuild` runs a full pack, and a comparison failure
      # without the underlying build log is undebuggable from CI output alone.
      DAY_VERBOSE: ${{ inputs.day-verbose && '1' || '0' }}
    strategy:
      fail-fast: false
      # The pack matrix, not the build one: this job downloads `dist-<target>`, which only a
      # target's primary profile row produces. Fanning it out per device would have every extra
      # row wait on an artifact nobody uploaded.
      matrix: ${{ fromJSON(needs.preflight.outputs.pack-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}dist-${{ matrix.target }}
          path: shipped

      # The same revision the build leg used, for the same reason — and here it is the whole point
      # of the job: `day rebuild` compares its output against the artifact built above, so a
      # different framework revision would read as an unreproducible build.
      - name: Track the day revision preflight resolved
        if: needs.preflight.outputs.day-rev != ''
        working-directory: ${{ inputs.project-path }}
        run: cargo update -p day --precise "${{ needs.preflight.outputs.day-rev }}"

      - name: Set up the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}
      - name: Rebuild from the artifact's own provenance
        # web-dom ships a zip of static files, not a packaged app: nothing to rebuild-and-compare.
        if: matrix.target != 'web-dom'
        run: |
          set -euo pipefail
          # Every container `day pack` produced for this target, not just the first: the linux
          # legs ship a .flatpak AND a .appimage, and a release check that verified one of them
          # would report a green target with half its downloads unexamined. Each costs a full
          # rebuild, which is why this whole job is opt-in (`validate-rebuild`).
          # One per target elsewhere: android's .aab and windows' -setup.exe are deliberately not
          # listed — they are built from the same payload as the .apk / .msix beside them.
          mapfile -t ARTS < <(find shipped -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.ipa' -o -name '*.apk' -o -name '*.flatpak' \
               -o -name '*.appimage' -o -name '*.msix' -o -name '*.hap' \) | sort)
          if [ "${#ARTS[@]}" -eq 0 ]; then
            echo "::warning::no packaged artifact for ${{ matrix.target }} — nothing to verify"
            exit 0
          fi
          for ART in "${ARTS[@]}"; do
            echo "::group::verifying $(basename "$ART")"
            "$DAY_BIN" rebuild --strict "$ART"
            echo "::endgroup::"
          done

  sign-macos:
    name: sign + notarize (macos-appkit)
    needs: [preflight, build]
    # `!cancelled()` rather than a bare condition: `needs` waits on the WHOLE `macos` matrix, so
    # without it an unrelated leg (macos-gtk's walkthrough, say) failing would silently SKIP the
    # release signing. Skipping is the one outcome a release must never take quietly — if the
    # appkit leg itself failed, this job fails at download-artifact instead, which is honest.
    if: >-
      ${{ !cancelled() && inputs.signing-environment != ''
          && needs.preflight.outputs.release == 'true'
          && needs.preflight.outputs.promotion != 'true' }}
    runs-on: ${{ needs.preflight.outputs.macos_runner }}
    environment: ${{ inputs.signing-environment }}
    permissions:
      contents: read
    steps:
      - name: Download the unsigned .app
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}app-macos-appkit
          path: ${{ runner.temp }}/incoming
      - name: Unpack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          ditto -x -k "$RUNNER_TEMP/incoming/app.zip" "$RUNNER_TEMP/stage"
          APP="$(find "$RUNNER_TEMP/stage" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "::error::no .app in the artifact"; exit 1; }
          # DMGNAME is what `day pack` called the container in the build job. Falling back to the
          # bundle title only covers an artifact staged by an older day; the packed name is the
          # one the provenance sidecars are named after.
          DMGNAME="$(cat "$RUNNER_TEMP/incoming/dmg-name.txt" 2>/dev/null || true)"
          [ -n "$DMGNAME" ] || DMGNAME="$(basename "$APP" .app).dmg"
          {
            echo "APP=$APP"
            echo "TITLE=$(basename "$APP" .app)"
            echo "DMGNAME=$DMGNAME"
            echo "APPID=$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")"
          } >> "$GITHUB_ENV"

      # An ephemeral keychain holding only the Developer ID identity, auto-locking after 15
      # minutes and deleted below. The p12 carries its own chain (Developer ID CA G2), so the
      # signature verifies without touching the runner's login keychain.
      # A missing certificate is a MISCONFIGURATION, not a mode: reaching this job means the caller
      # asked for signing by setting `signing-environment`. Degrading to a dev-signed .dmg here
      # would ship a release macOS refuses to open, so it fails — and says which secret and which
      # environment, because the Security.framework error for an absent secret is indistinguishable
      # from the one for a corrupt certificate. To NOT sign, leave `signing-environment` empty.
      - name: Check the signing material is present
        env:
          CERT_P12: ${{ secrets.DAY_MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DAY_MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.DAY_SIGN_MACOS_IDENTITY }}
          NOTARY_KEY_B64: ${{ secrets.DAY_NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.DAY_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.DAY_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          MISSING=""
          for name in CERT_P12 CERT_PASSWORD IDENTITY NOTARY_KEY_B64 NOTARY_KEY_ID NOTARY_ISSUER; do
            case "$name" in
              CERT_P12)      value="$CERT_P12";      secret=DAY_MACOS_CERT_P12 ;;
              CERT_PASSWORD) value="$CERT_PASSWORD"; secret=DAY_MACOS_CERT_PASSWORD ;;
              IDENTITY)      value="$IDENTITY";      secret=DAY_SIGN_MACOS_IDENTITY ;;
              NOTARY_KEY_B64) value="$NOTARY_KEY_B64"; secret=DAY_NOTARY_KEY_B64 ;;
              NOTARY_KEY_ID) value="$NOTARY_KEY_ID"; secret=DAY_NOTARY_KEY_ID ;;
              NOTARY_ISSUER) value="$NOTARY_ISSUER"; secret=DAY_NOTARY_ISSUER ;;
            esac
            [ -n "$value" ] || MISSING="$MISSING $secret"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::empty in this job:$MISSING — set them in the '${{ inputs.signing-environment }}' environment of $GITHUB_REPOSITORY (Settings → Environments), or as repository/organization secrets the repository can read. Leave the signing-environment input empty to skip signing instead."
            exit 1
          fi

      - name: Create an ephemeral signing keychain
        env:
          CERT_P12: ${{ secrets.DAY_MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DAY_MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.DAY_SIGN_MACOS_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          umask 077
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # macOS `base64 --decode` does not reliably reject bad input — some non-base64 text
          # decodes to garbage with status 0 — and `security import` then reports only "Unable to
          # decode the provided data", the same message an EMPTY secret produces. PKCS#12 is DER: a
          # SEQUENCE with a two-byte length, so the first two bytes are 30 82. (A wrong PASSWORD is
          # a different case — `security` names that one itself.)
          MAGIC="$(head -c 2 "$RUNNER_TEMP/cert.p12" | xxd -p)"
          if [ "$MAGIC" != 3082 ]; then
            echo "::error::DAY_MACOS_CERT_P12 decoded to $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') byte(s) that are not a PKCS#12 certificate (expected DER 30 82, got '${MAGIC:-nothing}'). The secret must hold the output of \`base64 -i Certificates.p12\`, not the certificate itself."
            rm -f "$RUNNER_TEMP/cert.p12"
            exit 1
          fi
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without an interactive prompt, then put the keychain on the
          # search list ahead of the runner's own.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046 # word splitting is the point: one argument per keychain path
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Sign by SHA-1, never by common name. Two Developer ID certificates can share a name —
          # this team has exactly that — and `codesign -s <name>` then fails as "ambiguous" or,
          # worse, picks the wrong one. The hash pins signing to the cert that came out of OUR p12.
          COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c '^[[:space:]]*[0-9][0-9]*)')"
          [ "$COUNT" = 1 ] || { echo "::error::expected exactly 1 identity in the keychain, found $COUNT"; exit 1; }
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*1\)/ {print $2; exit}')"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$IDENTITY" \
            || { echo "::error::the imported certificate is not '$IDENTITY'"; exit 1; }
          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "SIGN_ID=$SIGN_ID"
          } >> "$GITHUB_ENV"

      # Inside-out, never `--deep` — nested code first, the bundle last (DESIGN.md §16.5).
      - name: Sign the .app (Developer ID)
        run: |
          set -euo pipefail
          xattr -crs "$APP"
          ENT_ARG=""
          if [ -f "$RUNNER_TEMP/stage/entitlements.plist" ]; then
            ENT_ARG="--entitlements $RUNNER_TEMP/stage/entitlements.plist"
          fi
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -print0 | while IFS= read -r -d '' item; do
              codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" -s "$SIGN_ID" "$item"
            done
          fi
          # shellcheck disable=SC2086 # ENT_ARG is an intentional two-token flag or empty
          codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" -s "$SIGN_ID" $ENT_ARG "$APP"
          codesign -vvv --strict --verify "$APP"

      - name: Build and sign the .dmg
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          rm -f "$RUNNER_TEMP/stage/entitlements.plist"
          ln -sfn /Applications "$RUNNER_TEMP/stage/Applications"
          DMG="$RUNNER_TEMP/dist/$DMGNAME"
          hdiutil create -quiet -volname "$TITLE" -srcfolder "$RUNNER_TEMP/stage" -ov -format UDZO "$DMG"
          codesign --force --timestamp --keychain "$KEYCHAIN" -s "$SIGN_ID" -i "$APPID.dmg" "$DMG"
          hdiutil verify "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          NOTARY_KEY_B64: ${{ secrets.DAY_NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.DAY_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.DAY_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # The ticket must satisfy Gatekeeper on a machine that has never seen this app.
          spctl -a -vvv -t open --context context:primary-signature "$DMG"

      # The .dmg is assembled in RUNNER_TEMP, but the SBOM and .buildinfo were written next to the
      # unsigned output back in the packing job. `day rebuild` reads both from beside the artifact,
      # so they have to travel with it (§20.4).
      - name: Stage the provenance beside the .dmg
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/incoming"/*.json "$RUNNER_TEMP/dist/" 2>/dev/null || true
          ls -1 "$RUNNER_TEMP/dist"
      - name: Upload the notarized package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}dist-macos-appkit
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

      - name: Destroy the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

  # --- iOS Simulator: uikit -------------------------------------------------

  # The iOS counterpart of sign-macos: the build leg packs `<stem>-ios-uikit-unsigned.ipa` with
  # no Apple material in reach, and this job, which checks out no code, signs it with the
  # distribution certificate and the App Store profile (`day sign apply`, the same signing the
  # App Fair's queue performs on an unsigned .ipa) and republishes `dist-ios-uikit` under the
  # signed name. It runs on a release tag when both secrets exist; without them the unsigned
  # .ipa ships as it is, and the App Store upload refuses it with the list of what to set.
  sign-ios:
    name: sign (ios-uikit)
    needs: [preflight, build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && needs.preflight.outputs.release == 'true'
          && needs.preflight.outputs.promotion != 'true'
          && contains(inputs.targets, 'ios-uikit') }}
    runs-on: ${{ needs.preflight.outputs.macos_runner }}
    permissions:
      contents: read
    steps:
      - name: Check the signing material is present
        id: material
        env:
          CERT_P12: ${{ secrets.DAY_APPLE_CERT_P12 }}
          PROFILE_B64: ${{ secrets.DAY_IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ] || [ -z "$PROFILE_B64" ]; then
            echo "::notice::sign-ios: DAY_APPLE_CERT_P12 and DAY_IOS_PROFILE_B64 are not both set, so the .ipa ships unsigned"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the unsigned .ipa
        if: steps.material.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}dist-ios-uikit
          path: ${{ runner.temp }}/dist
      - name: Find it
        if: steps.material.outputs.present == 'true'
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*-unsigned.ipa' | head -1)"
          [ -n "$IPA" ] || { echo "::error::no *-unsigned.ipa in dist-ios-uikit; the build leg packs the iOS app unsigned for this job to sign"; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"
      - name: Set up the day CLI
        if: steps.material.outputs.present == 'true'
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}
      # The certificate goes into an ephemeral keychain the action destroys when it is done,
      # `day sign apply` re-signs the package as an archive (the profile is embedded, every
      # binary inside is signed with the identity, and no app code runs), and the provenance
      # sidecars beside the unsigned .ipa are renamed after the signed one, the way the release
      # job names its assets, so `day rebuild` still finds them beside the artifact. The App
      # Fair's queue signs with the same action.
      - name: Sign the .ipa
        if: steps.material.outputs.present == 'true'
        uses: daybrite/actions/.github/actions/sign-package@main
        with:
          target: ios-uikit
          package: ${{ env.IPA }}
          apple-cert-p12: ${{ secrets.DAY_APPLE_CERT_P12 }}
          apple-cert-password: ${{ secrets.DAY_APPLE_CERT_PASSWORD }}
          apple-profile-b64: ${{ secrets.DAY_IOS_PROFILE_B64 }}
      - name: Upload the signed package
        if: steps.material.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}dist-ios-uikit
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  release:
    name: release assets
    needs: [preflight, build, sign-macos, sign-ios]
    # `!cancelled()` + explicit results, for the same reason sign-macos documents: without it,
    # GitHub's implicit success() gate reads sign-macos's SKIP (no signing-environment
    # configured — the common case) as "a need did not succeed" and silently skips the release.
    # That is exactly the quiet-skip failure mode the signing job's comment warns against, and it
    # shipped: a green v-tag run with every artifact built and no release created. Build must
    # have succeeded (its artifacts are what gets attached); sign-macos may be success (its
    # signed .dmg replaces the plain one) or skipped (unsigned release), never failed.
    if: >-
      ${{ !cancelled()
          && inputs.release-assets
          && needs.preflight.outputs.release == 'true'
          && needs.preflight.outputs.promotion != 'true'
          && needs.build.result == 'success'
          && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
          && (needs.sign-ios.result == 'success' || needs.sign-ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      # The checkout is for `day screenshot index` further down, which reads the project for
      # website/site.toml's host and the app's locale set. Kept out of the workspace root so the
      # artifact downloads below still land in bare `dist-in/` and `shots-in/`.
      - uses: actions/checkout@v7
        with:
          path: app
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist-in
      # A flavor's packages, when the caller asked for them (inputs.release-flavor). They upload
      # under a name of their own, which is what keeps every other flavor out of the release.
      - name: Download the flavor's packages
        if: inputs.release-flavor != ''
        uses: actions/download-artifact@v7
        with:
          pattern: flavor-${{ inputs.release-flavor }}-dist-*
          path: dist-in
      - name: Download screenshots
        uses: actions/download-artifact@v7
        with:
          pattern: screenshots-*
          path: shots-in
      - name: Assemble release assets
        env:
          TARGETS_IN: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # actions/download-artifact extracts a SINGLE pattern match FLAT into `path` — only
          # multiple matches get `<path>/<artifact-name>/` subdirectories. A one-target app (e.g.
          # an android-mdc-only release) therefore lands its files directly in dist-in/ and
          # shots-in/, and the per-target loops below would find nothing. Normalize the flat shape
          # into the per-artifact layout first; in flat mode the one matched artifact belongs to
          # the workflow's (single) target, so name the synthesized dir after it.
          combo_fallback="$(echo "${TARGETS_IN%%,*}" | xargs)"
          normalize() { # $1 = download dir, $2 = artifact-name prefix
            local dir="$1" prefix="$2"
            [ -d "$dir" ] || return 0
            if ! compgen -G "$dir/$prefix-*/" >/dev/null \
               && [ -n "$(find "$dir" -mindepth 1 -print -quit 2>/dev/null)" ]; then
              mkdir "$dir/$prefix-${combo_fallback}"
              find "$dir" -mindepth 1 -maxdepth 1 ! -name "$prefix-${combo_fallback}" \
                -exec mv {} "$dir/$prefix-${combo_fallback}/" \;
            fi
          }
          normalize dist-in dist
          normalize shots-in screenshots
          # With only a flavor's packages downloaded, the flat-mode fallback above named the
          # directory `dist-<target>`; the loop below reads both shapes, so either name works.
          # Flatten the per-target package dirs. `day pack` already names every artifact
          # `<stem>-<platform>-<toolkit>[-extra].<ext>` and every provenance sidecar after the
          # artifact it describes (`…dmg.buildinfo.json`), so the packed file name IS the release
          # asset name — nothing is spliced in here, which is what keeps a sidecar's prefix equal
          # to its artifact.
          for d in dist-in/dist-*/ dist-in/flavor-*-dist-*/; do
            [ -d "$d" ] || continue
            find "$d" -type f | while read -r f; do
              base="$(basename "$f")"
              # Two edits survive. First: GitHub rewrites a space in an uploaded asset name to a
              # dot (Day Skies.dmg → Day.Skies.dmg), so pick the safe name rather than let it be
              # chosen — a no-op for anything a current `day pack` writes, and cover for a caller
              # pinned to an older CLI.
              base="$(printf '%s' "$base" | tr '[:upper:] ' '[:lower:]-')"
              # Second: drop pack's `-unsigned` .ipa marker (and it in the sidecar prefixes), so
              # the iOS asset keeps ONE name whether or not the run had signing secrets and its
              # `releases/latest/download/<name>` URL stays put.
              base="${base/-unsigned.ipa/.ipa}"
              [ ! -e "assets/$base" ] || { echo "::error::two packages both map to assets/$base"; exit 1; }
              cp "$f" "assets/$base"
            done
          done
          # One zip of screenshots per target.
          for d in shots-in/screenshots-*/; do
            [ -d "$d" ] || continue
            combo="$(basename "$d")"; combo="${combo#screenshots-}"
            if [ -n "$(find "$d" -type f -print -quit)" ]; then
              (cd "$d" && zip -qr "$GITHUB_WORKSPACE/assets/screenshots-${combo}.zip" .)
            fi
          done
          [ -n "$(ls -A assets)" ] || { echo "::error::no release assets found under dist-in/ or shots-in/ — artifact download layout mismatch?"; exit 1; }
      # --- the release's own screenshot bundle -----------------------------------------------
      # One `screenshots.zip` holding every target's captures, and `gallery.json` beside it —
      # the same index, published twice: once at the zip's root so the archive describes itself,
      # once as an asset of its own so a tool can read what a release contains without
      # downloading the images.
      #
      # This is what makes the project site's RELEASE channel buildable from the release alone
      # (daysite's src/lib/channels.ts). The per-target `screenshots-<target>.zip` assets above
      # stay: they are what someone grabbing one platform's captures wants, and every release
      # since before this bundle existed has carried them, which is also the fallback the site
      # build uses on a release that predates it.
      - name: Merge the capture trees
        id: shots
        run: |
          set -euo pipefail
          rm -rf shots-merged
          mkdir -p shots-merged
          for d in shots-in/screenshots-*/; do
            [ -d "$d" ] || continue
            cp -R "$d." shots-merged/
          done
          if [ -n "$(find shots-merged -name '*.png' -print -quit)" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no captures in this run — the release ships no screenshot bundle"
          fi
      # Best-effort: a cold `cargo install day-cli` is minutes. Without the CLI the release still
      # ships — the screenshot bundle carries each target's own gallery.json, which is what the
      # site build merges when the standalone index is absent, and the storefront document is
      # simply not attached.
      - name: Set up the day CLI
        id: daycli
        continue-on-error: true
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}
      # The listing as the CLI resolves it (docs/store.md "Exporting"): the text per target,
      # store and locale, the submission info, the screenshot declarations, the live store
      # records and the permissions, one JSON document a store queue or a catalog reads
      # without a checkout of the app.
      - name: Export the storefront
        if: ${{ steps.daycli.outcome == 'success' }}
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: '"$DAY_BIN" --project "app/${PROJECT_PATH:-.}" store export --out assets/storefront.json'
      - name: Bundle the screenshots
        if: ${{ steps.shots.outputs.merged == 'true' }}
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          if [ "${{ steps.daycli.outcome }}" = success ]; then
            # Indexed from the per-artifact directories, not the merged tree: two device
            # profiles' artifacts can both carry `<target>/gallery.json`, and only one survives
            # a merge. Each root's index is read whole; the merged tree supplies the files.
            roots=()
            for d in shots-in/screenshots-*/; do [ -d "$d" ] && roots+=("${d%/}"); done
            "$DAY_BIN" --project "app/${PROJECT_PATH:-.}" screenshot index \
              --screenshot-paths "${roots[@]}" --out shots-merged/gallery.json
            cp shots-merged/gallery.json assets/gallery.json
          fi
          (cd shots-merged && zip -qr "$GITHUB_WORKSPACE/assets/screenshots.zip" .)
          ls -l assets/screenshots.zip
      # The listing's screenshots against the stores' rules, before the release publishes them:
      # the same check `day store stage` and the App Fair's queue run later, here on the merged
      # index, so a listing a store would refuse fails the app's own release with the reason in
      # its log rather than a queue three repositories away (Games-Fair v2.1.9, 2026-09-25: the
      # index's store lists were empty). Only a target whose listing declares screenshots is
      # held to it; a target that declares none has nothing to send.
      - name: Check the listings' screenshots against the stores
        if: ${{ steps.daycli.outcome == 'success' && steps.shots.outputs.merged == 'true' }}
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          [ -f assets/storefront.json ] && [ -f assets/gallery.json ] || { echo "no storefront export or index to check"; exit 0; }
          failed=0
          for t in $(jq -r '.storefront.targets // {} | to_entries[]
                              | select(((.value.screenshots // {}) | length) > 0
                                       or ([(.value.stores // {})[] | (.screenshots // {}) | length] | add // 0) > 0)
                              | .key' assets/storefront.json); do
            case "$t" in ios-uikit|android-mdc) ;; *) continue ;; esac
            "$DAY_BIN" --project "app/${PROJECT_PATH:-.}" store screenshots assets/gallery.json -p "$t" || failed=1
          done
          if [ "$failed" != 0 ]; then
            echo "::error::a store would refuse this release's listing screenshots (the reasons are above): fix store/storefront.toml or the device profiles, then re-tag"
            exit 1
          fi
      # A curl-able `launch.sh` beside the packages, so the app has a one-line try-it path:
      #   curl -fsSL https://github.com/<repo>/releases/latest/download/launch.sh | bash
      # Generated per release and pinned to its own tag, so the URL a user fetches is what picks
      # the version — `latest/download/…` gets the newest, `download/v1.2.0/…` gets that one, and
      # two of them side by side really are two versions.
      - name: Generate the launch script
        uses: daybrite/actions/.github/actions/launch-script@main
        with:
          assets-dir: assets
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
      - name: Checksum the assets
        run: |
          set -euo pipefail
          # After launch.sh, so it is covered like every other asset.
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -la assets
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Create as a draft and attach everything. It stays a draft until the notes below are in
          # place — and, with `publish-release: false`, for as long as the human reviewing it wants
          # — so a release is never publicly visible half-assembled; --clobber and the edits that
          # follow keep re-runs idempotent.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
      # Someone who lands on a release page should find the command that runs THIS build, above the
      # changelog and ahead of the file list. The URLs are pinned to this tag rather than
      # `latest/download/…`, because on v1.2.0's page the command has to install v1.2.0 however
      # many releases come after it.
      - name: Lead the release notes with the install commands
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Each script is generated only when the release shipped a desktop build it can run, so
          # its presence is exactly the right condition. Neither one means a mobile-only release,
          # which gets no section rather than a command that would 404.
          [ -f assets/launch.sh ] || [ -f assets/launch.ps1 ] || exit 0
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          # shellcheck disable=SC2016 # the backticks below open markdown fences, not substitutions
          {
            echo "<!-- day:install -->"
            echo "## Install and run $GITHUB_REF_NAME"
            echo
            if [ -f assets/launch.sh ]; then
              printf '**macOS and Linux**\n\n```sh\ncurl -fsSL %s/launch.sh | bash\n```\n\n' "$base"
            fi
            if [ -f assets/launch.ps1 ]; then
              printf '**Windows** (PowerShell)\n\n```powershell\nirm %s/launch.ps1 | iex\n```\n\n' "$base"
            fi
            echo "Both print what they are about to download and ask before doing it, then run the"
            echo "app from a temporary directory. To follow the newest release instead of this one,"
            echo "use \`releases/latest/download/\` in place of \`releases/download/$GITHUB_REF_NAME/\`."
            echo "<!-- /day:install -->"
            echo
          } > install.md
          # Prepend to whatever the release already says — GitHub's generated changelog on a fresh
          # one, a human's prose on a release that existed first — minus any block a previous run
          # of this step left, so a re-run replaces its own section instead of stacking copies.
          gh release view "$GITHUB_REF_NAME" --json body -q .body > body.md
          # `sed '/./,$!d'` drops the blank lines the removed block left behind, so the separator
          # is the one install.md ends with and a tenth re-run reads like the first.
          awk '/<!-- day:install -->/ { skip = 1 }
               !skip { print }
               /<!-- \/day:install -->/ { skip = 0 }' body.md | sed '/./,$!d' > kept.md
          cat install.md kept.md > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
      # The one step that decides what the assembled release is (inputs.release-mode). Nothing
      # here ever sets `--draft=true` or demotes a public release: a release that went out
      # cannot be recalled by a later build, and a maintainer who marked a staged release Latest
      # must not find a re-run putting it back.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.preflight.outputs.release_mode }}
        run: |
          set -euo pipefail
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease)
          draft=$(jq -r .isDraft <<<"$state")
          pre=$(jq -r .isPrerelease <<<"$state")
          case "$MODE" in
            draft)
              echo "::notice::$GITHUB_REF_NAME is ready as a DRAFT (release-mode: draft) — \
              publish it to make its assets and the install commands in its notes reachable."
              ;;
            pre-release)
              if [ "$draft" = false ] && [ "$pre" = false ]; then
                echo "::notice::$GITHUB_REF_NAME is already the latest release; this run leaves it there."
              else
                gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
                echo "::notice::$GITHUB_REF_NAME is a PRE-RELEASE: its packages are downloadable \
                by their tag, and releases/latest still answers with the version before it. Mark \
                it Latest when it passes review, which rebuilds the site against it."
              fi
              ;;
            publish)
              gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
              echo "::notice::$GITHUB_REF_NAME is published."
              ;;
            *) echo "::error::release_mode '$MODE' is not one this job knows"; exit 1 ;;
          esac

  # --- store uploads (semantic-version tags only) ---------------------------------------------
  # Three independent jobs that hand the packed artifacts to the APP'S OWN fastlane config. The
  # workflow moves build products; the Fastfile owns the policy — which track, what metadata, how
  # a Mac App Store .pkg gets produced. Credentials never touch these jobs' env: `secrets:
  # inherit` puts the caller's secrets in scope, and the Fastfile reads its own (App Store
  # Connect API key envs, the Play JSON key). The artifact arrives as DAY_IPA / DAY_PKG_OR_APP /
  # DAY_AAB. Whether each job runs was decided in the stores job (an explicit upload-* input, or
  # lanes for the platform plus that store's credentials); like sign-macos, `!cancelled()` keeps an unrelated
  # matrix leg's failure from silently skipping a release upload — if the leg that feeds a job
  # failed, its download-artifact step fails loudly instead.
  # Which store uploads run on this release tag. It is a job of its own because the decision reads
  # whether the store secrets are set, and GitHub masks every line of a secret a job reads, in that
  # job's logs and in its outputs. A service-account JSON key has lines that are a lone `{` or `}`,
  # so while preflight read it, preflight's JSON matrix outputs were dropped as possibly secret and
  # no build job ran (Day-Showcase, 2026-09-14). This job's outputs are only true or false.
  stores:
    name: store uploads
    needs: [preflight]
    if: >-
      ${{ needs.preflight.outputs.release == 'true'
          && needs.preflight.outputs.promotion != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      upload_ios: ${{ steps.stores.outputs.upload_ios }}
      upload_macos: ${{ steps.stores.outputs.upload_macos }}
      upload_play: ${{ steps.stores.outputs.upload_play }}
    steps:
      - uses: actions/checkout@v7
      # Which store uploads run if this build is a release tag. An explicit upload-* input wins.
      # Empty (auto) enables an upload only when the app is set up for that store: it has lanes
      # for the platform (a fastlane/Fastfile under project-path, or the platform/ios and
      # platform/android convention directories, containing the literal `platform :ios`,
      # `platform :mac` or `platform :android` block; for iOS and Play also a store/storefront.toml
      # listing, which `day store stage` turns into lanes) AND the store's upload credentials
      # reached this workflow. Every app scaffold carries a store/ listing for its website and web
      # manifest, so the listing alone does not mean the app publishes to a store, and without
      # the credentials an upload job could only fail. Each auto decision is a ::notice so the
      # run explains itself.
      - name: Decide the store uploads
        id: stores
        env:
          UPLOAD_IOS_IN: ${{ inputs.upload-ios }}
          UPLOAD_MACOS_IN: ${{ inputs.upload-macos }}
          UPLOAD_PLAY_IN: ${{ inputs.upload-play }}
          PROJECT_PATH: ${{ inputs.project-path }}
          STORE_FLAVOR_IN: ${{ inputs.store-flavor }}
          # Whether each store's credentials are set is all that crosses into the step.
          HAS_ASC: ${{ secrets.DAY_ASC_KEY_ID != '' && secrets.DAY_ASC_ISSUER != '' && secrets.DAY_ASC_KEY_B64 != '' }}
          HAS_PLAY: ${{ secrets.DAY_PLAY_JSON_KEY != '' }}
        run: |
          set -euo pipefail
          PP="${PROJECT_PATH:-.}"
          # Where a platform's lanes come from, or nothing: $1=Fastfile marker, $2=whether a
          # store/ listing counts, $3…=candidate Fastfiles.
          lanes() {
            local marker="$1" listing="$2" f
            shift 2
            for f in "$@"; do
              if [ -f "$f" ] && grep -qF "$marker" "$f"; then echo "$f"; return 0; fi
            done
            # With inputs.store-flavor, the listing that gets published is the flavor's. The
            # convention is `store-<flavor>/`, which is what a flavor manifest names; an app that
            # points its `store` key somewhere else sets upload-ios / upload-play explicitly
            # rather than leaving this to guess.
            local dir="$PP/store" f
            [ -n "${STORE_FLAVOR_IN:-}" ] && dir="$PP/store-$STORE_FLAVOR_IN"
            if [ "$listing" = true ]; then
              for f in storefront.toml storefront.yaml storefront.yml app.toml app.yaml app.yml; do
                if [ -f "$dir/$f" ]; then echo "$dir/$f (lanes from 'day store stage')"; break; fi
              done
            fi
            return 0
          }
          decide() { # $1=output name, $2=explicit input, $3=where the lanes are, $4=credentials set, $5=their names
            local name="$1" explicit="$2" lanes="$3" credentials="$4" names="$5" on=false
            case "$explicit" in
              true|false) on="$explicit" ;;
              "")
                if [ -z "$lanes" ]; then
                  echo "::notice::$name=false (auto): the app has no lanes for this store"
                elif [ "$credentials" != true ]; then
                  echo "::notice::$name=false (auto): lanes in $lanes, but the credentials ($names) are not all set"
                else
                  on=true
                  echo "::notice::$name=true (auto): lanes in $lanes, and the credentials ($names) are set"
                fi
                ;;
              *) echo "::error::$name: inputs.upload-* accept '' (auto), 'true', or 'false' — got '$explicit'"; exit 1 ;;
            esac
            echo "$name=$on" | tee -a "$GITHUB_OUTPUT"
          }
          ASC="DAY_ASC_KEY_ID, DAY_ASC_ISSUER and DAY_ASC_KEY_B64"
          decide upload_ios "$UPLOAD_IOS_IN" \
            "$(lanes 'platform :ios' true "$PP/fastlane/Fastfile" "$PP/platform/ios/fastlane/Fastfile")" \
            "$HAS_ASC" "$ASC"
          decide upload_macos "$UPLOAD_MACOS_IN" \
            "$(lanes 'platform :mac' false "$PP/fastlane/Fastfile")" \
            "$HAS_ASC" "$ASC"
          decide upload_play "$UPLOAD_PLAY_IN" \
            "$(lanes 'platform :android' true "$PP/fastlane/Fastfile" "$PP/platform/android/fastlane/Fastfile")" \
            "$HAS_PLAY" "DAY_PLAY_JSON_KEY"

  # sign-ios republishes the signed .ipa under the same dist-ios-uikit name, so having it in
  # `needs` means this job downloads the signed package when the material exists and the
  # unsigned one otherwise, which it refuses below.
  appstore-ios:
    name: upload (ios app store)
    needs: [preflight, build, sign-ios, stores]
    if: ${{ !cancelled() && needs.preflight.outputs.release == 'true' && needs.stores.outputs.upload_ios == 'true' }}
    runs-on: ${{ needs.preflight.outputs.macos_runner }}
    env:
      # `day store stage` below reads the listing of the build being published: the base app's
      # `store/`, or the flavor's `store-<name>/` when the caller named one (inputs.store-flavor).
      DAY_FLAVOR: ${{ inputs.store-flavor }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}${{ inputs.store-flavor != '' && format('flavor-{0}-dist-ios-uikit', inputs.store-flavor) || 'dist-ios-uikit' }}
          path: dist
      - name: Find the .ipa
        id: package
        run: |
          set -euo pipefail
          IPA="$(find dist -type f -name '*.ipa' | head -1)"
          [ -n "$IPA" ] || { echo "::error::no .ipa in the downloaded dist artifact — is ios-uikit in inputs.targets (and in the flavor, when store-flavor is set)?"; exit 1; }
          case "$IPA" in
            *-unsigned.ipa) echo "::error::the packed .ipa is unsigned — the store refuses it. Set DAY_APPLE_CERT_P12, DAY_APPLE_CERT_PASSWORD and DAY_IOS_PROFILE_B64 so the sign-ios job signs it (and DAY_APPLE_TEAM, DAY_ASC_KEY_ID, DAY_ASC_ISSUER, DAY_ASC_KEY_B64 for the upload)"; exit 1 ;;
          esac
          echo "path=$PWD/$IPA" | tee -a "$GITHUB_OUTPUT"
      # The CLI indexes this run's screenshots and, for an app with no fastlane directory of
      # its own, writes the lanes from its store/ listing (docs/store.md).
      - name: Set up the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}
      # With inputs.store-screenshots, the listing's screenshots are the captures this run's
      # listing declares (store/storefront.toml [storefront]), from the screenshots-ios-uikit
      # artifacts the build legs uploaded (`<target>/<device>/<variant>/<shot>.png` plus the
      # target's own gallery.json). `day screenshot index` merges them into the index the
      # store-upload action holds to the store's rules and stages the listing with. No site is
      # involved: the artifact is the tagged version's own captures.
      # One artifact per device profile: the first profile's is `screenshots-ios-uikit`, the
      # others' `screenshots-ios-uikit-<slug>`, each holding `ios-uikit/<slug>/<variant>/…` and
      # its own index. They are NOT merged by the download: `merge-multiple` extracts artifacts
      # concurrently, and two indexes at one path (`ios-uikit/gallery.json`, from a CLI
      # that wrote one per target) collided into a garbled file, after which every capture lost
      # its metadata and the listing came out unmarked (Day-Showcase, 2026-09-24). Each artifact
      # lands in its own directory, the index reads them as separate roots, and only the
      # captures are copied into one tree.
      - name: Download this run's screenshots
        if: ${{ inputs.store-screenshots }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}${{ inputs.store-flavor != '' && format('flavor-{0}-screenshots-ios-uikit*', inputs.store-flavor) || 'screenshots-ios-uikit*' }}
          path: shots-in
      - name: Index this run's screenshots
        id: shots
        if: ${{ inputs.store-screenshots }}
        env:
          TARGET: ios-uikit
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          if [ -z "$(find shots-in -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "::error::the screenshots-$TARGET artifact holds no captures, so there is nothing to upload to the store. Does a dayscript with 'screenshot:' steps run on $TARGET, and does store/storefront.toml [storefront] name them?"
            exit 1
          fi
          # A single matching artifact is extracted flat into shots-in/; give it the
          # per-artifact directory the loop below expects.
          if [ -d "shots-in/$TARGET" ]; then
            mkdir "shots-in/screenshots-$TARGET" && mv "shots-in/$TARGET" "shots-in/screenshots-$TARGET/"
          fi
          roots=()
          mkdir -p shots
          for d in shots-in/*/; do
            roots+=("${d%/}")
            # The captures into one tree, sequentially; an index colliding here is harmless,
            # since the merged index below is read from the roots.
            cp -R "$d." shots/
          done
          "$DAY_BIN" --project "${PROJECT_PATH:-.}" screenshot index --screenshot-paths "${roots[@]}" --out shots/gallery.json
          echo "index=$PWD/shots/gallery.json" | tee -a "$GITHUB_OUTPUT"
      # The limits each store enforces, as data in this repository (the CLI carries the same
      # file as its default); the check and the staging read them through the action's input.
      - name: Take the stores' rules
        id: rules
        uses: daybrite/actions/.github/actions/store-rules@main
      # Stage the listing (or take the app's own Fastfile) and run the lane. The App Fair's
      # queue uploads with the same action.
      - name: Upload to the App Store
        uses: daybrite/actions/.github/actions/store-upload@main
        with:
          target: ios-uikit
          package: ${{ steps.package.outputs.path }}
          lane: ${{ inputs.ios-upload-lane }}
          project-path: ${{ inputs.project-path }}
          flavor: ${{ inputs.store-flavor }}
          screenshots: ${{ steps.shots.outputs.index }}
          rules: ${{ steps.rules.outputs.path }}
          asc-key-id: ${{ secrets.DAY_ASC_KEY_ID }}
          asc-issuer: ${{ secrets.DAY_ASC_ISSUER }}
          asc-key-b64: ${{ secrets.DAY_ASC_KEY_B64 }}

  # sign-macos re-uploads its notarized output under the same dist-macos-appkit name, so having
  # it in `needs` means this job downloads the signed .dmg when signing is configured and the
  # build job's dev-tier dist when it is not (the skipped job costs nothing under !cancelled()).
  appstore-macos:
    name: upload (mac app store)
    needs: [preflight, build, sign-macos, stores]
    if: ${{ !cancelled() && needs.preflight.outputs.release == 'true' && needs.stores.outputs.upload_macos == 'true' }}
    runs-on: ${{ needs.preflight.outputs.macos_runner }}
    env:
      # `day store stage` below reads the listing of the build being published: the base app's
      # `store/`, or the flavor's `store-<name>/` when the caller named one (inputs.store-flavor).
      DAY_FLAVOR: ${{ inputs.store-flavor }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}${{ inputs.store-flavor != '' && format('flavor-{0}-dist-macos-appkit', inputs.store-flavor) || 'dist-macos-appkit' }}
          path: dist
      # A Mac App Store submission needs a .pkg signed with the MAS installer identity. Producing
      # or re-signing that .pkg is the lane's job, not this workflow's: DAY_PKG_OR_APP points at
      # whatever the build shipped — a .pkg if pack made one, else the .app or .dmg.
      - name: Find the build product
        id: package
        run: |
          set -euo pipefail
          FOUND=""
          for pat in '*.pkg' '*.app' '*.dmg'; do
            FOUND="$(find dist -maxdepth 3 -name "$pat" | head -1)"
            [ -n "$FOUND" ] && break
          done
          [ -n "$FOUND" ] || { echo "::error::no .pkg/.app/.dmg in the downloaded dist artifact — is macos-appkit in inputs.targets (and in the flavor, when store-flavor is set)?"; exit 1; }
          echo "path=$PWD/$FOUND" | tee -a "$GITHUB_OUTPUT"
      - name: Set up the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}
      # The Mac App Store takes a .pkg signed with the MAS installer identity, and producing or
      # re-signing it is the app's own lane's job: the CLI stages no macOS listing, so the app
      # has to carry the Fastfile, and the action runs the lane there with DAY_PKG_OR_APP set.
      # No store credentials are set here: forward yours with `secrets: inherit` and have the
      # Fastfile read them.
      - name: Upload to the Mac App Store
        uses: daybrite/actions/.github/actions/store-upload@main
        with:
          target: macos-appkit
          package: ${{ steps.package.outputs.path }}
          lane: ${{ inputs.macos-upload-lane }}
          project-path: ${{ inputs.project-path }}
          flavor: ${{ inputs.store-flavor }}

  playstore-android:
    name: upload (google play)
    needs: [preflight, build, stores]
    if: ${{ !cancelled() && needs.preflight.outputs.release == 'true' && needs.stores.outputs.upload_play == 'true' }}
    runs-on: ubuntu-latest
    env:
      # `day store stage` below reads the listing of the build being published: the base app's
      # `store/`, or the flavor's `store-<name>/` when the caller named one (inputs.store-flavor).
      DAY_FLAVOR: ${{ inputs.store-flavor }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}${{ inputs.store-flavor != '' && format('flavor-{0}-dist-android-mdc', inputs.store-flavor) || 'dist-android-mdc' }}
          path: dist
      - name: Find the .aab
        id: package
        run: |
          set -euo pipefail
          AAB="$(find dist -type f -name '*.aab' | head -1)"
          [ -n "$AAB" ] || { echo "::error::no .aab in the downloaded dist artifact — is android-mdc in inputs.targets (and in the flavor, when store-flavor is set)?"; exit 1; }
          # A dev-tier pack signs with the debug keystore, which Play refuses; the signer's
          # certificate says which key it was.
          if keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -q "CN=Android Debug"; then
            echo "::error::the packed .aab is signed with the debug keystore — Play refuses it. Set DAY_ANDROID_KEYSTORE_B64, DAY_ANDROID_KEY_ALIAS, DAY_KS_PASS and DAY_KEY_PASS so pack signs with the upload key"
            exit 1
          fi
          echo "path=$PWD/$AAB" | tee -a "$GITHUB_OUTPUT"
      # The CLI indexes this run's screenshots and, for an app with no fastlane directory of
      # its own, writes the lanes from its store/ listing (docs/store.md).
      - name: Set up the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}
      # With inputs.store-screenshots, the listing's screenshots are the captures this run's
      # listing declares (store/storefront.toml [storefront]), from the screenshots-android-mdc
      # artifacts the build legs uploaded (`<target>/<device>/<variant>/<shot>.png` plus the
      # target's own gallery.json). `day screenshot index` merges them into the index the
      # store-upload action holds to the store's rules and stages the listing with. No site is
      # involved: the artifact is the tagged version's own captures.
      # One artifact per device profile: the first profile's is `screenshots-android-mdc`, the
      # others' `screenshots-android-mdc-<slug>`, each holding `android-mdc/<slug>/<variant>/…` and
      # its own index. They are NOT merged by the download: `merge-multiple` extracts artifacts
      # concurrently, and two indexes at one path (`android-mdc/gallery.json`, from a CLI
      # that wrote one per target) collided into a garbled file, after which every capture lost
      # its metadata and the listing came out unmarked (Day-Showcase, 2026-09-24). Each artifact
      # lands in its own directory, the index reads them as separate roots, and only the
      # captures are copied into one tree.
      - name: Download this run's screenshots
        if: ${{ inputs.store-screenshots }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}${{ inputs.store-flavor != '' && format('flavor-{0}-screenshots-android-mdc*', inputs.store-flavor) || 'screenshots-android-mdc*' }}
          path: shots-in
      - name: Index this run's screenshots
        id: shots
        if: ${{ inputs.store-screenshots }}
        env:
          TARGET: android-mdc
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          if [ -z "$(find shots-in -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "::error::the screenshots-$TARGET artifact holds no captures, so there is nothing to upload to the store. Does a dayscript with 'screenshot:' steps run on $TARGET, and does store/storefront.toml [storefront] name them?"
            exit 1
          fi
          # A single matching artifact is extracted flat into shots-in/; give it the
          # per-artifact directory the loop below expects.
          if [ -d "shots-in/$TARGET" ]; then
            mkdir "shots-in/screenshots-$TARGET" && mv "shots-in/$TARGET" "shots-in/screenshots-$TARGET/"
          fi
          roots=()
          mkdir -p shots
          for d in shots-in/*/; do
            roots+=("${d%/}")
            # The captures into one tree, sequentially; an index colliding here is harmless,
            # since the merged index below is read from the roots.
            cp -R "$d." shots/
          done
          "$DAY_BIN" --project "${PROJECT_PATH:-.}" screenshot index --screenshot-paths "${roots[@]}" --out shots/gallery.json
          echo "index=$PWD/shots/gallery.json" | tee -a "$GITHUB_OUTPUT"
      # The limits each store enforces, as data in this repository (the CLI carries the same
      # file as its default); the check and the staging read them through the action's input.
      - name: Take the stores' rules
        id: rules
        uses: daybrite/actions/.github/actions/store-rules@main
      # Stage the listing (or take the app's own Fastfile) and run the lane. The App Fair's
      # queue uploads with the same action.
      - name: Upload to Google Play
        uses: daybrite/actions/.github/actions/store-upload@main
        with:
          target: android-mdc
          package: ${{ steps.package.outputs.path }}
          lane: ${{ inputs.play-upload-lane }}
          project-path: ${{ inputs.project-path }}
          flavor: ${{ inputs.store-flavor }}
          screenshots: ${{ steps.shots.outputs.index }}
          rules: ${{ steps.rules.outputs.path }}
          play-json-key: ${{ secrets.DAY_PLAY_JSON_KEY }}

  # --- web-dom → GitHub Pages (opt-in: inputs.deploy-web) -----------------------------------
  # Publishes the web-dom build — already built in release profile and uploaded by the build job
  # as dist-web-dom — to the caller's own GitHub Pages. Whether it runs is decided entirely in the
  # preflight job (deploy-web set, web-dom in targets, and the ref qualifies per
  # web-deploy-tag-pattern).
  #
  # Like the release job, this declares NO job-level `permissions:` block on purpose: GitHub
  # validates a nested job's requested permissions against the CALLER's grant even when the job is
  # skipped, so requesting pages/id-token here would break every caller that doesn't deploy web (it
  # would fail the whole workflow at validation). It inherits the caller's token instead — a web
  # deploy needs the caller to grant `permissions: { pages: write, id-token: write }` (plus the
  # contents: read that checkout always has), or the deploy fails with a 403. One-time repo setting:
  # Settings → Pages → "Build and deployment" → Source = "GitHub Actions".
  pages:
    name: deploy web
    needs: [preflight, build]
    # The whole build is a prerequisite: every matrix leg must succeed before anything publishes,
    # so a run that built nothing, or built only part of the app, leaves the live site as it was.
    if: >-
      ${{ needs.preflight.outputs.deploy_web == 'true' && needs.preflight.outputs.website != 'true'
          && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # Bind the run to the repo's github-pages environment so the live URL shows in the UI.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Serialize Pages deploys for this repo and never cancel one in flight — a half-published site
    # is worse than a slightly stale one.
    concurrency:
      group: day-pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download the web-dom dist
        uses: actions/download-artifact@v7
        with:
          name: dist-web-dom
          path: web-in
      - name: Unpack the dist
        run: |
          set -euo pipefail
          # The build job staged the release dist as <stem>-web-dom.zip with the dist files at the
          # zip root (index.html + shim.js + day.css + app.wasm + assets/…). Found by glob because
          # the stem is the app's, not a fixed string — this artifact holds nothing else.
          ZIP="$(find web-in -maxdepth 1 -name '*.zip' | head -1)"
          [ -n "$ZIP" ] || { echo "::error::no web-dom dist zip in the dist-web-dom artifact"; exit 1; }
          rm -rf web-dist
          unzip -q "$ZIP" -d web-dist
          test -f web-dist/index.html
      # The artifact name carries the RUN ATTEMPT (docs: the re-run story below). Artifacts are
      # scoped to the run, not the attempt, and survive a re-run — so a second attempt uploading
      # `github-pages` again leaves TWO artifacts under that name in the same run, and
      # `deploy-pages` fails with "Multiple artifacts named github-pages were unexpectedly found"
      # before it deploys anything. That turns one flaky build leg into a whole failed workflow,
      # which is exactly what re-running a leg is supposed to avoid.
      #
      # Suffixing makes each attempt's artifact its own name, so the lookup finds exactly one.
      # This works because the upload and the deploy are steps of the SAME job: whichever attempt
      # runs them, both read the same `github.run_attempt`. (The name is only ever used to look
      # the artifact up — `deploy-pages` sends the resolved artifact ID to the Pages API — so any
      # name deploys the same site.) The artifact prefix is in the name for the same reason: a
      # second call of this workflow in one run names its packages `<prefix>dist-<target>`, and
      # its Pages artifact must not collide either, should both calls ever deploy.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ inputs.artifact-prefix }}${{ github.run_attempt }}
          # The whole self-contained static site, all relative — the directory IS the Pages site.
          path: web-dist
      # Belt and braces for the OTHER way duplicates appear, which the attempt suffix cannot
      # separate: `upload-pages-artifact`'s own retry when finalizing times out can leave two
      # artifacts under ONE name within a SINGLE attempt (actions/upload-pages-artifact#97).
      # Drop all but the newest before deploying.
      #
      # Best-effort by design. Listing and deleting artifacts needs an `actions` grant this
      # workflow deliberately does not request — a nested job's permissions are validated against
      # the CALLER's grant even when the job is skipped, so requiring it would break every caller
      # that never deploys web. Without the grant the API call fails, this logs a notice, and the
      # deploy proceeds exactly as it would have: never worse than not having the step.
      - name: Drop duplicate Pages artifacts from a retried upload
        env:
          GH_TOKEN: ${{ github.token }}
          ART: github-pages-${{ inputs.artifact-prefix }}${{ github.run_attempt }}
        run: |
          set -uo pipefail
          if ! ids=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq "[.artifacts[] | select(.name==\"${ART}\")] | sort_by(.created_at) | .[:-1][].id" 2>/dev/null); then
            echo "::notice::cannot list run artifacts (no 'actions: read' grant) — skipping the duplicate sweep"
            exit 0
          fi
          for id in ${ids:-}; do
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null 2>&1; then
              echo "::warning::deleted a duplicate '${ART}' artifact (id $id) left by a retried upload"
            else
              echo "::notice::a duplicate '${ART}' artifact (id $id) needs deleting but the token lacks 'actions: write'"
            fi
          done
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ inputs.artifact-prefix }}${{ github.run_attempt }}

  # --- Project website (daysite) -------------------------------------------------------------
  # When the repository has website/site.toml, this job replaces the bare root deploy above: it
  # builds the daybrite/daysite template against the repo's own data and deploys the result to
  # the repo's GitHub Pages. Same permissions story as the pages job: the caller grants
  # `pages: write` + `id-token: write` and points Settings → Pages at "GitHub Actions".
  #
  # The site publishes the app twice, as two BUILD CHANNELS (daysite's src/lib/channels.ts), and
  # the two are assembled from deliberately different sources:
  #
  #   release  the newest GitHub release, from that release's own assets and nothing else — the
  #            packages it carries, its screenshots.zip, its web-dom dist. It owns the locale
  #            root (`/en/`), so the address someone shares is the released app.
  #   main     the newest build of the default branch, from the artifacts THIS run produced —
  #            the screenshots the dayscripts just captured, the packages the matrix just
  #            packed, the dist the web-dom leg just built. It lives at `/en/main/`, its pages
  #            carry a development-build notice, and its packages are served from the site
  #            itself, because a branch build has no release to link.
  #
  # A repository with no release publishes main at the locale root instead, and its version
  # picker, having one entry, is not drawn.
  website:
    name: deploy website
    # `release` is a need so a tag build's site sees the release it just published: the release
    # job creates the release as a draft and un-drafts it at the end, and `releases/latest`
    # skips drafts. `!cancelled()` plus the explicit result keeps a SKIPPED release (every push
    # to the default branch) from taking the deploy with it — the same gate the release job
    # documents for sign-macos.
    #
    # The whole build is a prerequisite too: the site hosts the web-dom build, the screenshots and
    # the packages this run produced, so it deploys only after every matrix leg succeeded. A run
    # whose build was skipped or failed leaves the live site as it was instead of publishing one
    # without its web app. "Re-run failed jobs" re-runs the failed legs AND every job that needs
    # them, this one included; once those legs pass, needs.build.result counts the first
    # attempt's passing legs with them and this deploys, from the artifacts of both attempts.
    needs: [preflight, build, release]
    if: >-
      ${{ needs.preflight.outputs.website == 'true' && !cancelled()
          && needs.build.result == 'success'
          && needs.release.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: day-pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      - uses: actions/checkout@v7
        with:
          repository: daybrite/daysite
          ref: ${{ inputs.daysite-version }}
          path: daysite
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # From the lockfile as committed, and nothing else: a lock that cannot install is a
      # template bug to fix there, not one to paper over with a fresh resolution that would
      # build a site nobody has seen. Production packages only — the type checker and the
      # search indexer are dev dependencies — except that a site which indexes (site.toml
      # `pagefind = true`) needs the indexer, so it takes the full install.
      - name: Install the template
        working-directory: daysite
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          SITE_TOML="$GITHUB_WORKSPACE/app/${PROJECT_PATH:-.}/website/site.toml"
          if grep -Eq '^[[:space:]]*pagefind[[:space:]]*=[[:space:]]*true' "$SITE_TOML"; then
            npm ci --no-audit --no-fund
          else
            npm ci --no-audit --no-fund --omit=dev
          fi
      # The CLI does three jobs here: it merges the per-target screenshot indexes for both
      # channels, renders the icon family the favicons are copied from, and describes the
      # project's permissions. Best-effort throughout — each consumer below degrades on its own.
      - name: Set up the day CLI
        id: daycli
        continue-on-error: true
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ inputs.day-version }}
          git: ${{ inputs.day-git }}
          source: ${{ inputs.day-source }}
          cache: ${{ inputs.day-cache }}
      # --- the development channel's inputs: what this run built -------------------------------
      # Every screenshots-<target> artifact holds <target>/<variant>/<shot>.png — plus its
      # own gallery.json, written by the dayscript runner with every `screenshot:` step's
      # localized title/caption metadata. Each lands in its own directory: two device
      # profiles' artifacts can carry an index at the same path, and a merged download
      # extracts artifacts concurrently, so the colliding file came out garbled and the
      # captures lost their metadata (Day-Showcase, 2026-09-24). The step below copies the
      # captures into the one tree the gallery assembler reads and indexes from the roots.
      # Tolerated-absent: a run whose dayscripts captured nothing still publishes a site — the
      # gallery page is simply not generated.
      - name: Download this run's screenshots
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: screenshots-*
          path: shots-in
      # `day screenshot index` merges the per-target indexes into shots/gallery.json — the
      # machine-readable index of every screenshot (URL, localized title/caption, theme,
      # locale, platform, dimensions, byte size, sha-256). The assembler republishes it at
      # /main/gallery/gallery.json, where other sites reference this app's screenshots — the way
      # daybrite.dev references the Day Showcase's. Best-effort like the download above: a
      # failure costs the published index, never the site.
      - name: Build the screenshot index
        if: ${{ steps.daycli.outcome == 'success' }}
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          if [ -d shots-in ] && [ -n "$(find shots-in -name '*.png' -print -quit)" ]; then
            # A single matching artifact is extracted flat; give it a directory of its own.
            if ! compgen -G "shots-in/screenshots-*/" >/dev/null; then
              mkdir shots-in/screenshots-all
              find shots-in -mindepth 1 -maxdepth 1 ! -name screenshots-all -exec mv {} shots-in/screenshots-all/ \;
            fi
            roots=()
            mkdir -p shots
            for d in shots-in/screenshots-*/; do
              roots+=("${d%/}")
              cp -R "$d." shots/
            done
            "$DAY_BIN" --project "app/${PROJECT_PATH:-.}" screenshot index \
              --screenshot-paths "${roots[@]}" --out shots/gallery.json
          fi
      # The packages the matrix just packed. The development channel serves them from the site
      # itself — a GitHub Actions artifact needs a signed-in account and expires with the run's
      # retention window, so a link to one is a link most visitors cannot follow. The generator
      # copies only real packages out of these directories (the provenance sidecars beside them
      # describe a download, they are not one), which is what keeps the Pages payload to the
      # installable files.
      - name: Download this run's packages
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ inputs.artifact-prefix }}dist-*
          path: dist-in
      # --- the release channel's inputs: what the release carries ------------------------------
      # The one place GitHub access is a given, so the lookup happens HERE and everything below
      # reads files. A repository with no release yet writes an empty asset list, which the
      # generator reads as "no release channel", the same as a local preview.
      - name: Look up the latest release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq '[.assets[] | {name, size}]' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-assets.json"
            echo "tag=$(jq -r .tag_name "$RUNNER_TEMP/release.json")" | tee -a "$GITHUB_OUTPUT"
          else
            echo '[]' > "$RUNNER_TEMP/release-assets.json"
            echo "::notice::no published release — the site carries the development channel alone"
          fi
      - name: Download the release's screenshots
        if: ${{ steps.release.outputs.tag != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh release` subcommands name their repository from the working directory's git
          # remote, and this job's working directory is not a checkout — the app is cloned into
          # app/. Without this every download here failed with "not a git repository", the
          # release channel published no screenshots, and <site>/gallery/gallery.json 404'd.
          # (`gh api` above is unaffected: it spells the repository in its path.)
          GH_REPO: ${{ github.repository }}
          PROJECT_PATH: ${{ inputs.project-path }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p rel-zips rel-shots
          # The merged `screenshots.zip` when the release has one, and the per-target zips
          # otherwise — every Day release carried those before the bundle existed, and they
          # unzip to the same capture tree, so a release made before this change still gets a
          # full gallery.
          if jq -e 'any(.name == "screenshots.zip")' "$RUNNER_TEMP/release-assets.json" >/dev/null; then
            gh release download "$TAG" --dir rel-zips --clobber --pattern 'screenshots.zip'
          else
            gh release download "$TAG" --dir rel-zips --clobber --pattern 'screenshots-*.zip'
          fi
          # Each zip unpacks into its own directory first: two device profiles' zips can both
          # carry `<target>/gallery.json`, and the index is read from those roots before the
          # captures are folded into one tree.
          roots=()
          for z in rel-zips/*.zip; do
            [ -e "$z" ] || continue
            dir="rel-in/$(basename "$z" .zip)"
            mkdir -p "$dir" && unzip -qo "$z" -d "$dir"
            roots+=("$dir")
            cp -R "$dir/." rel-shots/
          done
          # A merged bundle carries the index at its root; per-target zips carry only their own,
          # so the CLI merges them the way it just did for the development channel.
          if [ ! -f rel-shots/gallery.json ] && [ "${{ steps.daycli.outcome }}" = success ] && [ "${#roots[@]}" -gt 0 ]; then
            "$DAY_BIN" --project "app/${PROJECT_PATH:-.}" screenshot index \
              --screenshot-paths "${roots[@]}" --out rel-shots/gallery.json
          fi
          echo "$(find rel-shots -name '*.png' | wc -l) capture(s) from $TAG"
      # --- shared inputs -----------------------------------------------------------------------
      # The raster favicon set (apple-touch, PWA tile, legacy favicon) comes from the renderer
      # every platform's icon does: `day icon build -p web-dom` writes the size-exact png/ family
      # under build/day/host/, and the generator copies the sizes it needs. The site build
      # carries no image library. Best-effort: without the CLI the site keeps the SVG master
      # (or the largest PNG under resource/icons/) as its only icon.
      - name: Render the icon family
        if: ${{ steps.daycli.outcome == 'success' }}
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          if ! "$DAY_BIN" icon build --help >/dev/null 2>&1; then
            echo "::error::The installed day CLI lacks 'icon build'. Update day-version to build website icons."
            exit 1
          fi
          "$DAY_BIN" --project "app/${PROJECT_PATH:-.}" icon build -p web-dom
      # The storefront as the CLI resolves it (docs/store.md "Exporting"): the app's identity
      # and locales, the listing text per target, store and locale, the live store records,
      # and the declared permissions with their native keys per platform and reasons per
      # locale. Everything the site says about the app comes from this one document, handed
      # to the generator as a file, like the release lookup, so the generator itself runs no
      # tool. Without the CLI there is no site: the generator refuses rather than describe an
      # app it has not read.
      - name: Export the storefront
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          if [ "${{ steps.daycli.outcome }}" != success ]; then
            echo "::error::the website needs the day CLI (\`day store export\` describes the app to the site generator), and it could not be installed"
            exit 1
          fi
          "$DAY_BIN" --project "app/${PROJECT_PATH:-.}" store export --out "$RUNNER_TEMP/day-storefront.json"
      - name: Generate the site data
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          SITE_DIR="$GITHUB_WORKSPACE/app/${PROJECT_PATH:-.}/website"
          # One entry per published channel, in picker order. generate-site.mjs decides which
          # owns the locale root, then runs the gallery assembler and the appindex generator
          # once per channel with that channel's prefixes — including copying the app's icon
          # into the template's public/app/: the SVG master (resource/icons/icon.svg or
          # day-icon.svg) when the project ships one, plus the png/ family rendered above or,
          # failing that, the largest PNG under resource/icons/. Nothing else supplies the site
          # an icon, so a project without any gets the template's defaults and a line in this
          # log saying why.
          jq -n \
            --arg tag "${TAG:-}" --arg version "${TAG#v}" \
            --arg relshots "$GITHUB_WORKSPACE/rel-shots" \
            --arg relassets "$RUNNER_TEMP/release-assets.json" \
            --arg branch "$BRANCH" --arg sha "$GITHUB_SHA" \
            --arg shots "$GITHUB_WORKSPACE/shots" \
            --arg dist "$GITHUB_WORKSPACE/dist-in" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '[ (if $tag == "" then empty else
                 { id: "release", label: $version, tag: $tag,
                   screenshots: $relshots, releaseAssets: $relassets } end),
               { id: "main", label: $branch, ref: $branch, commit: $sha, development: true,
                 screenshots: $shots, downloads: $dist, runURL: $run } ]' \
            > "$RUNNER_TEMP/channels.json"
          node daysite/scripts/generate-site.mjs "app/${PROJECT_PATH:-.}" "$SITE_DIR" \
            --channels "$RUNNER_TEMP/channels.json" \
            --repo "$GITHUB_REPOSITORY" --storefront "$RUNNER_TEMP/day-storefront.json"
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"
      # The hosted web builds, one per channel: the release's own dist under the directory
      # site.toml names (default "webapp"), and this run's under the development channel's
      # segment. Each channel's "Open the web app" then runs the version its pages describe.
      # Absent when web-dom is not a target — the site simply has no such button.
      - name: Download the web-dom dist
        id: webdist
        continue-on-error: ${{ !inputs.deploy-web }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}dist-web-dom
          path: web-in
      - name: Stage each channel's web app
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here for `gh release download` to read a remote from; see the release
          # screenshots step above.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          REQUIRE_WEB: ${{ inputs.deploy-web }}
        run: |
          set -euo pipefail
          # Both directories may be absent — web-dom is not always a target, and not every
          # release ships a dist — and an absent one would fail the `find` below under
          # `pipefail` rather than reading as "nothing to stage".
          mkdir -p web-in rel-web
          # WHERE each build goes is channels.json's answer rather than this script's, so the
          # workflow and the template cannot disagree about the path: `webapp/` for the channel
          # that owns the locale root, `<segment>/webapp/` for the other.
          stage() { # $1 = zip, $2 = directory under the site root
            # Clear the target first. It is meant to be empty in a fresh checkout, but if
            # anything ever ships one (a stray commit did), `unzip` asks whether to overwrite
            # each file — and with no stdin it reads EOF, answers "[N]one", and fails the deploy
            # on a prompt nobody saw. Removing the directory also drops files the new build no
            # longer has, which overwriting alone would leave behind to be served.
            rm -rf "daysite/public/$2"
            mkdir -p "daysite/public/$2"
            unzip -q "$1" -d "daysite/public/$2"
            test -f "daysite/public/$2/index.html"
            echo "staged $(basename "$1") under /$2/"
          }
          REL_DIR="$(jq -r '[.channels[] | select(.development | not) | .webapp][0] // ""' "$SITE_DIR/channels.json")"
          MAIN_DIR="$(jq -r '[.channels[] | select(.development) | .webapp][0] // ""' "$SITE_DIR/channels.json")"
          # Remove template leftovers even when a channel has no artifact to replace them.
          # An old Day-Skies build in public/webapp otherwise posed as a release's web app.
          for dir in "$REL_DIR" "$MAIN_DIR"; do
            if [ -n "$dir" ]; then rm -rf "daysite/public/$dir"; fi
          done
          # This run's dist-web-dom artifact holds the one <stem>-web-dom.zip the build job staged.
          ZIP="$(find web-in -maxdepth 1 -name '*.zip' | head -1)"
          if [ "$REQUIRE_WEB" = true ] && { [ -z "$ZIP" ] || [ -z "$MAIN_DIR" ]; }; then
            echo "::error::deploy-web requires this run's web-dom dist and a development channel destination"
            exit 1
          fi
          if [ -n "$ZIP" ] && [ -n "$MAIN_DIR" ]; then stage "$ZIP" "$MAIN_DIR"; fi
          if [ -n "$REL_DIR" ] && [ -n "${TAG:-}" ]; then
            # The release's dist is chosen by name from its asset list. A `*-web-dom.zip` glob
            # also matches the web-dom target's screenshots-web-dom.zip, whose index.html is the
            # capture index, and that zip was published as the web app whenever `find` listed it
            # first (Day-Games v0.1.2).
            REL_ZIP="$(jq -r '[.[].name | select(endswith("-web-dom.zip") and (startswith("screenshots-") | not))][0] // ""' "$RUNNER_TEMP/release-assets.json")"
            if [ -z "$REL_ZIP" ]; then
              echo "::notice::$TAG ships no web-dom dist, so the release channel has no hosted web app"
            elif gh release download "$TAG" --dir rel-web --clobber --pattern "$REL_ZIP"; then
              stage "rel-web/$REL_ZIP" "$REL_DIR"
            else
              echo "::warning::could not download $REL_ZIP from $TAG, so the release channel has no hosted web app in this deploy"
            fi
          fi
          du -sh daysite/public/* 2>/dev/null || true
      - name: Build the site
        working-directory: daysite
        env:
          DAYSITE_CONFIG: ${{ env.SITE_DIR }}/site.toml
        run: npx astro build
      # The artifact name carries the RUN ATTEMPT (docs: the re-run story below). Artifacts are
      # scoped to the run, not the attempt, and survive a re-run — so a second attempt uploading
      # `github-pages` again leaves TWO artifacts under that name in the same run, and
      # `deploy-pages` fails with "Multiple artifacts named github-pages were unexpectedly found"
      # before it deploys anything. That turns one flaky build leg into a whole failed workflow,
      # which is exactly what re-running a leg is supposed to avoid.
      #
      # Suffixing makes each attempt's artifact its own name, so the lookup finds exactly one.
      # This works because the upload and the deploy are steps of the SAME job: whichever attempt
      # runs them, both read the same `github.run_attempt`. (The name is only ever used to look
      # the artifact up — `deploy-pages` sends the resolved artifact ID to the Pages API — so any
      # name deploys the same site.) The artifact prefix is in the name for the same reason: a
      # second call of this workflow in one run names its packages `<prefix>dist-<target>`, and
      # its Pages artifact must not collide either, should both calls ever deploy.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ inputs.artifact-prefix }}${{ github.run_attempt }}
          path: daysite/dist
      # Belt and braces for the OTHER way duplicates appear, which the attempt suffix cannot
      # separate: `upload-pages-artifact`'s own retry when finalizing times out can leave two
      # artifacts under ONE name within a SINGLE attempt (actions/upload-pages-artifact#97).
      # Drop all but the newest before deploying.
      #
      # Best-effort by design. Listing and deleting artifacts needs an `actions` grant this
      # workflow deliberately does not request — a nested job's permissions are validated against
      # the CALLER's grant even when the job is skipped, so requiring it would break every caller
      # that never deploys web. Without the grant the API call fails, this logs a notice, and the
      # deploy proceeds exactly as it would have: never worse than not having the step.
      - name: Drop duplicate Pages artifacts from a retried upload
        env:
          GH_TOKEN: ${{ github.token }}
          ART: github-pages-${{ inputs.artifact-prefix }}${{ github.run_attempt }}
        run: |
          set -uo pipefail
          if ! ids=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq "[.artifacts[] | select(.name==\"${ART}\")] | sort_by(.created_at) | .[:-1][].id" 2>/dev/null); then
            echo "::notice::cannot list run artifacts (no 'actions: read' grant) — skipping the duplicate sweep"
            exit 0
          fi
          for id in ${ids:-}; do
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null 2>&1; then
              echo "::warning::deleted a duplicate '${ART}' artifact (id $id) left by a retried upload"
            else
              echo "::notice::a duplicate '${ART}' artifact (id $id) needs deleting but the token lacks 'actions: write'"
            fi
          done
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ inputs.artifact-prefix }}${{ github.run_attempt }}
